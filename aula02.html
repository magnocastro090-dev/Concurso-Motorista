:root{--ink:#14343b;--muted:#607780;--teal:#087f78;--mint:#e9f5f0;--paper:#f7f5ef;--line:#dce7e3;--gold:#ffc975}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer}header{background:#10313a;color:#fff;padding:15px max(22px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{letter-spacing:.06em}header small{display:block;color:#bbd5d5;font-size:12px}header button{background:transparent;color:#fff;border:1px solid #709397;border-radius:12px;padding:8px 13px;font-size:13px}.shell{max-width:1100px;margin:28px auto;padding:0 18px;display:grid;grid-template-columns:235px minmax(0,1fr);gap:25px}.side,.page{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 30px #14343b0b}.side{padding:20px;align-self:start;position:sticky;top:16px}.side h3{font-size:12px;letter-spacing:.09em;margin:0 0 14px}.navbtn{display:block;width:100%;border:0;text-align:left;padding:11px 12px;border-radius:12px;background:transparent;color:#547078;margin:4px 0}.navbtn.active{background:var(--mint);color:#006d65;font-weight:750}.navbtn span{display:inline-grid;place-items:center;background:#e4efec;width:26px;height:26px;border-radius:8px;margin-right:7px;font-size:12px}.meter{height:9px;border-radius:30px;background:#e8eeeb;overflow:hidden;margin:9px 0}.meter div{height:100%;background:var(--teal);width:0;transition:width .25s}.side p{font-size:12px;color:var(--muted)}.page{padding:clamp(22px,5vw,48px);min-height:600px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--teal);font-weight:800;text-transform:uppercase}h1{font-size:clamp(32px,5vw,49px);line-height:1.12;letter-spacing:-.04em;margin:10px 0 18px}h2{font-size:clamp(24px,3vw,33px);line-height:1.2;margin:12px 0 18px}h3{font-size:19px;margin:23px 0 8px}p{margin:12px 0}.lead{font-size:19px;color:#3e6067}.callout{padding:17px 20px;background:var(--mint);border-left:5px solid var(--teal);border-radius:12px;margin:23px 0}.example{background:#f7f8f6;border:1px solid var(--line);border-radius:15px;padding:18px 21px;margin:20px 0}.example em{color:#45636a}.actions{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:28px}.btn{border:0;border-radius:13px;padding:12px 19px;font-weight:750;background:var(--teal);color:white}.btn.secondary{background:#eaf2ef;color:#125b59}.btn:disabled{opacity:.4;cursor:not-allowed}.art{width:100%;max-height:245px;display:block;margin:12px auto 22px}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip{font-size:12px;padding:5px 10px;border-radius:30px;border:1px solid #b8d5cd;color:#26655f}.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.triple div{padding:17px 12px;background:#f0f7f3;border-radius:13px;text-align:center}.triple b{display:block;color:#087f78}.triple small{font-size:12px}.options{display:grid;gap:10px;margin:22px 0}.option{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid #d7e5df;background:white;padding:13px 16px;border-radius:12px;color:var(--ink)}.option:hover{border-color:#0a847a}.option.selected{border:2px solid var(--teal);background:#e9f6f0;padding:12px 15px}.letter{font-weight:800;color:#087f78;min-width:24px}.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.qtext{font-size:19px;font-weight:650}.score{font-size:56px;font-weight:800;color:var(--teal);line-height:1.1}.review{border:1px solid var(--line);border-radius:14px;padding:17px;margin:12px 0}.review.good{border-left:5px solid #15876c}.review.bad{border-left:5px solid #d88c38}.small{font-size:13px;color:var(--muted)}.dots{display:flex;gap:5px;flex-wrap:wrap}.dot{width:20px;height:7px;border-radius:5px;background:#e4eeea}.dot.done{background:#168d82}.dot.current{background:#ffc975}@media(max-width:730px){.shell{display:block;margin:12px auto}.side{position:static;margin-bottom:12px;padding:12px}.side nav{display:flex;overflow-x:auto;gap:4px}.navbtn{white-space:nowrap;width:auto;font-size:12px}.side h3,.side p{display:none}.page{min-height:560px;padding:23px}.triple{grid-template-columns:1fr}header{padding:12px 16px}}

</style><style id="study-guides-css">#study-guide-launch{position:fixed;right:18px;bottom:18px;z-index:900;background:#145b57;color:#fff;border:0;border-radius:99px;padding:13px 18px;box-shadow:0 6px 22px #1238;cursor:pointer;font:600 14px system-ui}#study-guide-shade{position:fixed;inset:0;background:#091d24aa;z-index:999;display:none;align-items:center;justify-content:center;padding:14px}#study-guide-shade.open{display:flex}#study-guide-dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;color:#14343b;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0015;font:15px/1.55 system-ui}#study-guide-dialog h2{margin:0;font-size:24px}#study-guide-dialog .ghead{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:16px}#study-guide-dialog .gclose{border:0;border-radius:10px;background:#eaf0ed;padding:9px 13px;cursor:pointer}#study-guide-dialog details{border:1px solid #dce6e0;border-radius:12px;margin:10px 0;overflow:hidden}#study-guide-dialog summary{padding:14px;cursor:pointer;font-weight:750;background:#f4f8f5}#study-guide-dialog .gbody{padding:14px}#study-guide-dialog .gterms{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}#study-guide-dialog .gterms span{background:#e8f4ee;padding:5px 9px;border-radius:7px;font-size:13px}#study-guide-dialog .gexample{background:#f1f5f7;border-left:4px solid #2c827b;padding:10px 12px;border-radius:6px}#study-guide-dialog .gtip{color:#5c4d23;background:#fff7e2;padding:10px 12px;border-radius:8px;margin-top:9px}#study-guide-dialog .gsub{color:#657b7d;font-size:13px;margin-top:4px}@media(max-width:600px){#study-guide-launch{right:12px;bottom:12px;padding:11px 14px}#study-guide-dialog{padding:15px}}</style></head><body><header><div><strong>ROTA DA APROVAÇÃO</strong><small>FURB · Motorista · Português · Aula 02</small></div><a class="course-link" href="index.html">← Disciplinas</a><button id="reset">Reiniciar aula</button></header><main class="shell"><aside class="side"><h3>SEU CAMINHO</h3><nav id="nav"></nav><hr style="border:0;border-top:1px solid #e3eae6;margin:18px 0"><div class="small">Progresso · <span id="pct">0%</span></div><div class="meter"><div id="bar"></div></div><p>Respostas salvas somente neste navegador.</p><p><a href="aula01.html">← Aula 1</a></p></aside><section class="page" id="content" aria-live="polite"></section></main><script>
const lessons=[["Boas-vindas", "Gêneros textuais: reconhecer a finalidade de cada texto", "<p class=\"lead\">Uma notícia, um aviso e uma receita podem falar do mesmo assunto, mas não têm a mesma finalidade.</p><div class=\"callout\"><b>Objetivo:</b> identificar quem escreve, para quem, com qual intenção e como o texto se organiza.</div><p>Esta é a <b>Aula 2</b> da trilha de Português. Começaremos com duas questões de revisão da Aula 1 e depois faremos dez questões novas.</p><p class=\"small\">Questões autorais de treino, não oficiais da FURB.</p>"], ["Revisão", "Antes de avançar: retome a Aula 1", "<p>Na aula anterior, estudamos compreensão, análise e interpretação.</p><div class=\"triple\"><div><b>Compreensão</b><small>Localizar informação</small></div><div><b>Análise</b><small>Observar relações</small></div><div><b>Interpretação</b><small>Inferir com evidência</small></div></div><div class=\"callout\">Ao final desta aula, haverá <b>duas questões de revisão</b> desses conceitos, separadas da nota da matéria nova.</div>"], ["Conceitos", "O que são gêneros textuais?", "<p>Gêneros textuais são formas de comunicação usadas em situações reais: avisos, notícias, receitas, e-mails, cartazes, campanhas, relatos e artigos de opinião.</p><div class=\"example\"><b>Uma mesma informação, gêneros diferentes</b><p><b>Aviso:</b> “A biblioteca abrirá às 10h.”<br><b>Notícia:</b> “Biblioteca amplia atendimento nesta semana.”<br><b>Campanha:</b> “Visite a biblioteca e descubra novos livros!”</p></div><div class=\"callout\"><b>Regra prática:</b> observe <b>finalidade + público + organização + linguagem</b>. Não basta procurar uma palavra isolada.</div>"], ["Informativos", "Aviso, comunicado e notícia", "<h3>Aviso e comunicado</h3><p>Buscam transmitir orientações ou informações úteis: mudança de horário, interrupção de serviço, convocação.</p><div class=\"example\">“Na quarta-feira, o atendimento terminará às 14h.”<p><b>Finalidade:</b> informar uma alteração de funcionamento.</p></div><h3>Notícia</h3><p>Relata um acontecimento de interesse público. Frequentemente responde a <b>o quê, quem, quando, onde, como e por quê</b>, conforme as informações disponíveis.</p><div class=\"example\">“A prefeitura inaugurou ontem um novo espaço de leitura no centro.”<p><b>Finalidade:</b> relatar um fato ocorrido.</p></div><p>Uma notícia pode incluir falas e avaliações de entrevistados. Isso não transforma automaticamente todo o texto em opinião do jornalista.</p>"], ["Instrucionais", "Receita, manual e instruções", "<p>Textos instrucionais ensinam <b>como realizar</b> uma tarefa. Costumam apresentar etapas, sequência e verbos que orientam ações.</p><div class=\"example\"><b>Instrução:</b> “Primeiro, desligue o aparelho. Depois, retire o cabo da tomada.”</div><p>Uma receita combina ingredientes e modo de preparo. Um manual pode trazer recomendações, cuidados e passos numerados.</p><div class=\"callout\"><b>Armadilha:</b> um texto que menciona uma máquina não é necessariamente manual. O que define o gênero é o uso comunicativo, não apenas o assunto.</div>"], ["Persuasivos", "Campanha, anúncio e texto de opinião", "<p>Alguns textos procuram <b>influenciar atitudes ou defender ideias</b>.</p><div class=\"example\"><b>Campanha:</b> “Doe sangue. Sua atitude pode ajudar outras pessoas.”<br><b>Anúncio:</b> “Conheça nossos serviços e condições.”<br><b>Opinião:</b> “A cidade deveria ampliar os espaços públicos de leitura.”</div><p>Campanhas podem buscar uma mudança social; anúncios comerciais promovem produtos ou serviços; artigos de opinião defendem uma posição com argumentos.</p><div class=\"callout\"><b>Diferença essencial:</b> informar um fato não é o mesmo que convencer alguém a agir.</div>"], ["Cotidianos", "E-mail, convite e cartaz", "<p>Um e-mail pode ter várias finalidades: solicitar, informar, convidar ou reclamar. Por isso, <b>o gênero não determina sozinho uma única intenção</b>.</p><div class=\"example\"><b>E-mail institucional</b><p>Assunto: Reunião de planejamento<br>Prezados, confirmamos a reunião de terça-feira às 9h.<br>Atenciosamente, Coordenação.</p></div><p>O convite destaca evento, data, horário e local. O cartaz combina mensagens curtas e destaque visual para divulgar algo.</p><div class=\"callout\">Observe a situação de circulação: um mesmo aviso pode aparecer em um cartaz, em um e-mail ou em uma página na internet.</div>"], ["Comparação", "Como diferenciar textos parecidos?", "<div class=\"example\"><b>Texto A:</b> “O município abriu uma nova unidade de saúde nesta terça-feira.”<p><b>Predomina:</b> relato informativo de um acontecimento.</p></div><div class=\"example\"><b>Texto B:</b> “A abertura é importante, mas o município precisa garantir profissionais suficientes.”<p><b>Predomina:</b> avaliação e defesa de uma posição.</p></div><div class=\"example\"><b>Texto C:</b> “Compareça à unidade com documento de identificação e cartão do SUS.”<p><b>Predomina:</b> orientação ao leitor.</p></div><p>O tema é parecido; o propósito comunicativo é diferente.</p>"], ["Estratégia", "Como resolver questões de gênero textual", "<p><b>Passo 1:</b> identifique o público e o contexto.<br><b>Passo 2:</b> pergunte qual é o objetivo principal: informar, relatar, orientar, convidar, convencer ou expressar opinião.<br><b>Passo 3:</b> observe marcas do texto: títulos, verbos de comando, datas, saudação, argumentos.<br><b>Passo 4:</b> compare as alternativas com o texto completo.</p><div class=\"callout\"><b>Atenção:</b> “gênero textual” e “tipo textual” não são sinônimos. Uma notícia pode conter descrição e narração; uma campanha pode combinar orientação e argumentação.</div><p>Agora, responda às 12 questões: <b>2 de revisão + 10 desta aula</b>. O gabarito só aparecerá no final.</p>"]], review=[{"topic": "Revisão da Aula 1 — inferência", "passage": "Ao chegar à biblioteca, Helena encontrou a porta fechada e um aviso informando que o atendimento começaria uma hora mais tarde naquele dia.", "ask": "O que se pode concluir com segurança?", "options": ["A biblioteca encerrou suas atividades definitivamente.", "Helena chegou antes do horário excepcional de abertura.", "Todos os funcionários faltaram ao trabalho.", "O aviso foi colocado no dia anterior.", "A biblioteca abrirá sempre uma hora mais tarde."], "answer": "B", "comment": "A conclusão B decorre do aviso e da porta fechada. As demais alternativas acrescentam informações não fornecidas."}, {"topic": "Revisão da Aula 1 — ideia central", "passage": "O bairro ganhou uma praça com árvores e bancos. Moradores passaram a utilizá-la para conversar e descansar. A prefeitura informou que novas melhorias dependerão de recursos.", "ask": "Qual é a ideia central do texto?", "options": ["A prefeitura já aprovou todas as melhorias futuras.", "A praça foi construída exclusivamente para crianças.", "O bairro recebeu um espaço público utilizado pelos moradores.", "A praça não possui árvores.", "Os moradores deixaram de frequentar o bairro."], "answer": "C", "comment": "A ideia principal é a criação e utilização da praça. As demais opções contradizem ou extrapolam o texto."}], newQuestions=[{"topic": "Aviso", "passage": "AVISO AOS USUÁRIOS — Na próxima sexta-feira, o posto de atendimento encerrará suas atividades às 15h para manutenção da rede elétrica. O funcionamento normal será retomado na segunda-feira.", "ask": "A finalidade principal desse texto é:", "options": ["Narrar uma experiência pessoal de um funcionário.", "Defender uma opinião sobre o serviço público.", "Informar uma alteração temporária no atendimento.", "Ensinar a consertar uma instalação elétrica.", "Divertir os usuários com uma história."], "answer": "C", "comment": "O aviso informa uma alteração de horário e a retomada das atividades; não narra, opina ou ensina manutenção."}, {"topic": "Notícia", "passage": "A Secretaria Municipal de Cultura inaugurou ontem uma biblioteca comunitária no bairro das Palmeiras. O espaço oferece empréstimo de livros e atividades de leitura para crianças e adultos.", "ask": "Qual característica aproxima o texto do gênero notícia?", "options": ["Relata um acontecimento de interesse público com informações verificáveis.", "Apresenta uma receita com etapas numeradas.", "Tenta vender um produto por meio de uma promoção.", "Descreve uma lembrança pessoal em primeira pessoa.", "Expõe regras de um jogo de tabuleiro."], "answer": "A", "comment": "A notícia relata um fato de interesse público, com informações sobre o que ocorreu, onde e quando."}, {"topic": "Instrução", "passage": "Para solicitar a segunda via do cartão, acesse o portal, preencha o formulário e confirme os dados antes de enviar o pedido.", "ask": "O texto se caracteriza principalmente como:", "options": ["Crônica, pois retrata o cotidiano com humor.", "Texto instrucional, pois orienta uma sequência de ações.", "Editorial, pois expressa a opinião de um jornal.", "Poema, pois utiliza versos e rimas.", "Notícia, pois relata um acontecimento recente."], "answer": "B", "comment": "Os verbos “acesse”, “preencha” e “confirme” orientam etapas que o leitor deve realizar."}, {"topic": "Campanha", "passage": "Água limpa depende de todos. Feche a torneira enquanto escova os dentes e evite desperdícios. Pequenas atitudes fazem diferença.", "ask": "A intenção predominante é:", "options": ["Registrar a ata de uma reunião.", "Informar o horário de funcionamento de um serviço.", "Contar um episódio de infância.", "Convencer o leitor a adotar hábitos de economia de água.", "Apresentar um contrato de prestação de serviços."], "answer": "D", "comment": "A campanha combina orientação com apelo persuasivo para incentivar mudança de comportamento."}, {"topic": "E-mail institucional", "passage": "Assunto: Reunião de equipe. Prezados colegas, a reunião de planejamento ocorrerá na terça-feira, às 9h, na sala 2. Solicito a confirmação de presença até segunda-feira. Atenciosamente, Coordenação.", "ask": "Qual elemento reforça que o texto é um e-mail institucional?", "options": ["A presença de personagens fictícios e conflito narrativo.", "O uso de rimas e estrofes.", "A ausência de destinatário e de assunto.", "O predomínio de linguagem informal e gírias.", "A indicação de assunto, destinatários, solicitação e despedida."], "answer": "E", "comment": "Assunto, saudação, pedido objetivo e despedida são marcas comuns de e-mails profissionais."}, {"topic": "Texto de opinião", "passage": "A ampliação das ciclovias é positiva, mas não basta pintar faixas no asfalto. É necessário integrar os trajetos ao transporte público e garantir segurança nos cruzamentos.", "ask": "O trecho “não basta pintar faixas no asfalto” expressa:", "options": ["Uma opinião de que a ampliação precisa ser acompanhada de outras medidas.", "Uma informação de que todas as ciclovias foram removidas.", "Uma instrução para pintar faixas imediatamente.", "Uma previsão de que o transporte público será extinto.", "Uma descrição neutra de uma pintura concluída."], "answer": "A", "comment": "O autor avalia que a medida isolada é insuficiente; trata-se de posicionamento argumentativo."}, {"topic": "Cartaz", "passage": "FEIRA DE TROCA DE LIVROS | Sábado, 10h às 16h | Centro Comunitário | Entrada gratuita | Traga um livro em bom estado e escolha outro.", "ask": "A combinação de informações curtas, data, local e convite é típica de:", "options": ["Laudo técnico sobre conservação de livros.", "Relatório de prestação de contas.", "Cartaz de divulgação de evento.", "Regulamento completo de biblioteca.", "Romance histórico."], "answer": "C", "comment": "O cartaz apresenta informações essenciais e um convite para participação em um evento."}, {"topic": "Receita", "passage": "Ingredientes: duas bananas, uma xícara de aveia e um ovo. Modo de preparo: amasse as bananas, misture os ingredientes e leve ao forno por vinte minutos.", "ask": "A organização em “Ingredientes” e “Modo de preparo” tem como principal função:", "options": ["Defender uma tese sobre alimentação.", "Facilitar a execução de um procedimento.", "Relatar um acidente doméstico.", "Anunciar uma vaga de emprego.", "Apresentar o resultado de uma pesquisa científica."], "answer": "B", "comment": "A receita organiza materiais e etapas para permitir que o leitor reproduza o preparo."}, {"topic": "Notícia e opinião", "passage": "O município inaugurou um novo terminal de ônibus na segunda-feira. Para a associação de moradores, a obra representa um avanço importante, embora ainda faltem linhas para alguns bairros.", "ask": "Qual alternativa distingue corretamente fato relatado e avaliação?", "options": ["A inauguração é opinião; a avaliação da associação é fato incontestável.", "A falta de linhas é uma ordem dada aos usuários.", "Todas as informações são opiniões do narrador.", "A inauguração é um acontecimento relatado; “avanço importante” é uma avaliação atribuída à associação.", "O texto é uma receita porque menciona transporte."], "answer": "D", "comment": "A inauguração é um acontecimento relatado. A expressão “avanço importante” apresenta um juízo atribuído à associação."}, {"topic": "Gênero e finalidade", "passage": "Caro leitor, defendemos que a cidade invista em calçadas acessíveis. A mobilidade de pedestres precisa ser prioridade, pois beneficia pessoas de todas as idades.", "ask": "Ao considerar o posicionamento defendido, o texto se aproxima principalmente de:", "options": ["Manual de montagem.", "Boletim meteorológico.", "Convite para festa.", "Formulário de inscrição.", "Artigo de opinião ou editorial."], "answer": "E", "comment": "O texto apresenta uma tese e um argumento em defesa de uma política pública, característica de textos opinativos."}], questions=[...review,...newQuestions];
const steps=[...lessons.map(x=>x[0]),'Prova','Resultado'];
const KEY='rota-furb-pt-aula2-v1';
const LEVELS=['intermediaria', 'dificil', 'facil', 'intermediaria', 'facil', 'intermediaria', 'dificil', 'facil', 'intermediaria', 'dificil', 'intermediaria', 'dificil'];
const LEVEL_LABEL={facil:'Fácil',intermediaria:'Intermediária',dificil:'Difícil'};
function levelTag(i){let l=LEVELS[i]||'intermediaria';return `<span class="difficulty ${l}" aria-label="Dificuldade: ${LEVEL_LABEL[l]}">${LEVEL_LABEL[l]}</span>`}
function difficultyStats(answers,start=0,end=questions.length){return ['facil','intermediaria','dificil'].map(l=>{let idx=questions.map((q,i)=>i).filter(i=>i>=start&&i<end&&LEVELS[i]===l);return {level:l,correct:idx.filter(i=>answers[i]===questions[i].answer).length,total:idx.length}})}
function statsHTML(answers,start=0,end=questions.length){return `<div class="review-stats">${difficultyStats(answers,start,end).map(x=>`<div><small>${LEVEL_LABEL[x.level]}</small><b>${x.correct}/${x.total}</b><small>${x.total?Math.round(x.correct/x.total*100):0}% de acertos</small></div>`).join('')}</div>`}
function historyHTML(){let attempts=Array.isArray(state.attempts)?state.attempts:[];if(!attempts.length)return '<p>Nenhuma tentativa registrada.</p>';let first=attempts[0],last=attempts[attempts.length-1],best=Math.max(...attempts.map(a=>a.score/(a.total||1)));let summary=`<div class="attempt-summary"><span>Primeira: ${first.score}/${first.total}</span><span>Melhor: ${Math.round(best*100)}%</span><span>Última: ${last.score}/${last.total}</span></div>`;return summary+attempts.map((a,i)=>{let arr=Array.isArray(a.answers)?a.answers:null;return `<div class="review"><b>Tentativa ${i+1}</b><p class="small">${a.date?new Date(a.date).toLocaleString('pt-BR'):'Data não registrada'} · ${a.score}/${a.total} acertos</p>${arr?`<button type="button" class="history-btn" data-attempt="${i}">Consultar respostas</button><div class="attempt-details" id="attempt-${i}" hidden>${statsHTML(arr,2)}${questions.map((q,j)=>`<p><b>Questão ${j+1} (${LEVEL_LABEL[LEVELS[j]]}):</b> ${arr[j]||'em branco'} · Gabarito ${q.answer} — ${arr[j]===q.answer?'Acerto':'Erro'}</p><p class="small">${esc(q.comment)}</p>`).join('')}</div>`:'<p class="small">Tentativa anterior sem respostas individuais salvas.</p>'}</div>`}).join('')}
function bindHistory(){document.querySelectorAll('[data-attempt]').forEach(b=>b.onclick=()=>{let el=document.getElementById('attempt-'+b.dataset.attempt);el.hidden=!el.hidden;b.textContent=el.hidden?'Consultar respostas':'Ocultar respostas'})}
const blank=()=>({step:0,q:0,answers:Array(12).fill(null),finished:false,seen:0,confirmed:Array(12).fill(false),attempts:[]});
let state=blank();try{let v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&Array.isArray(v.answers)&&v.answers.length===12)state={...blank(),...v};}catch(e){}
if(!Array.isArray(state.confirmed)||state.confirmed.length!==state.answers.length)state.confirmed=Array(state.answers.length).fill(false);
if(!Array.isArray(state.attempts))state.attempts=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nav(){const n=document.getElementById('nav');n.innerHTML=steps.map((s,i)=>`<button class="navbtn ${i===state.step?'active':''}" data-step="${i}"><span>${i+1}</span>${esc(s)}</button>`).join('');n.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const i=+b.dataset.step;if(i===steps.length-1&&!state.finished)return;setStep(i)});let pct=Math.round(100*(state.step===steps.length-1?1:state.step/(steps.length-1)));document.getElementById('pct').textContent=pct+'%';document.getElementById('bar').style.width=pct+'%';}
function setStep(i){if(i>=steps.length-1&&!state.finished)return;state.step=Math.max(0,Math.min(steps.length-1,i));state.seen=Math.max(state.seen,state.step);save();render();window.scrollTo(0,0)}
function actions(){return `<div class="actions"><button class="btn secondary" id="back">← Voltar</button><button class="btn" id="next">${state.step===lessons.length-1?'Começar prova →':'Próxima tela →'}</button></div>`}
function lesson(){let a=lessons[state.step];return `<div class="eyebrow">Português · Aula 2 · Etapa ${state.step+1}</div><h2>${esc(a[1])}</h2>${state.step===0?"<svg class=\"art\" viewBox=\"0 0 600 220\" role=\"img\" aria-label=\"Ilustra\u00e7\u00e3o de tr\u00eas documentos diferentes\"><rect width=\"600\" height=\"220\" rx=\"22\" fill=\"#e9f5f0\"/><g fill=\"#fff\" stroke=\"#9acbc1\" stroke-width=\"3\"><rect x=\"85\" y=\"35\" width=\"115\" height=\"145\" rx=\"10\"/><rect x=\"245\" y=\"35\" width=\"115\" height=\"145\" rx=\"10\"/><rect x=\"405\" y=\"35\" width=\"115\" height=\"145\" rx=\"10\"/></g><g stroke=\"#7fbab0\" stroke-width=\"7\" stroke-linecap=\"round\"><path d=\"M108 76h68M108 99h68M108 122h44M268 76h68M268 99h68M268 122h44M428 76h68M428 99h68M428 122h44\"/></g><g font-size=\"14\" fill=\"#0a716a\" font-weight=\"bold\" text-anchor=\"middle\"><text x=\"142\" y=\"160\">AVISO</text><text x=\"302\" y=\"160\">NOT\u00cdCIA</text><text x=\"462\" y=\"160\">CONVITE</text></g></svg>":state.step===1?"<svg class=\"art\" viewBox=\"0 0 600 200\" role=\"img\" aria-label=\"Fluxo entre leitura, an\u00e1lise e conclus\u00e3o\"><rect width=\"600\" height=\"200\" rx=\"20\" fill=\"#e9f5f0\"/><g fill=\"#fff\" stroke=\"#a6cec6\" stroke-width=\"2\"><rect x=\"30\" y=\"65\" width=\"150\" height=\"75\" rx=\"12\"/><rect x=\"225\" y=\"65\" width=\"150\" height=\"75\" rx=\"12\"/><rect x=\"420\" y=\"65\" width=\"150\" height=\"75\" rx=\"12\"/></g><path d=\"M185 103h34m-12 -9 12 9 -12 9M380 103h34m-12 -9 12 9 -12 9\" fill=\"none\" stroke=\"#07847b\" stroke-width=\"4\"/><g font-size=\"18\" text-anchor=\"middle\" fill=\"#17655f\"><text x=\"105\" y=\"109\">LER</text><text x=\"300\" y=\"109\">LIGAR</text><text x=\"495\" y=\"109\">CONCLUIR</text></g></svg>":''}${a[2]}${actions()}`}
function quiz(){let i=state.q,q=questions[i];return `<div class="eyebrow">${i<2?'Revisão da Aula 1':'Aula 2 · Gêneros textuais'}</div><div class="qhead"><h2>Questão ${i+1} de 12</h2><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="chip">${esc(q.topic)}</span>${levelTag(i)}</div></div><div class="dots">${questions.map((_,j)=>`<span class="dot ${state.answers[j]!==null?'done':''} ${i===j?'current':''}"></span>`).join('')}</div><div class="example"><b>Leia:</b><p>“${esc(q.passage)}”</p></div><p class="qtext">${esc(q.ask)}</p><div class="options">${q.options.map((op,j)=>{let l='ABCDE'[j];return `<button class="option ${state.confirmed[i]?(l===q.answer?'correct':state.answers[i]===l?'wrong':''):(state.answers[i]===l?'selected':'')}" ${state.confirmed[i]?'disabled':''} data-answer="${l}"><span class="letter">${l})</span><span>${esc(op)}</span></button>`}).join('')}</div>${state.confirmed[i]?`<div class="feedback ${state.answers[i]===q.answer?'':'bad'}"><b>${state.answers[i]===q.answer?'✓ Resposta correta!':'✕ Resposta incorreta.'}</b><div>Alternativa correta: <strong>${q.answer}</strong>. ${esc(q.comment)}</div></div>`:''}<p class="small">As duas primeiras questões são revisão. A nota principal considera somente as dez questões novas.</p><div class="actions"><button class="btn secondary" id="qback">← ${i?'Anterior':'Teoria'}</button><button class="btn" id="qnext" ${state.answers[i]===null?'disabled':''}>${!state.confirmed[i]?'Confirmar resposta':i===11?'Finalizar e corrigir':'Próxima questão →'}</button></div>`}
function results(){let rev=review.reduce((n,q,i)=>n+(state.answers[i]===q.answer),0),score=newQuestions.reduce((n,q,i)=>n+(state.answers[i+2]===q.answer),0);return `<div class="eyebrow">Boletim · Aula 2</div><h2>Prova concluída</h2><div class="score">${score}/10</div><p class="lead">Nota da Aula 2: ${score*10}% · Revisão da Aula 1: ${rev}/2</p><div class="meter"><div style="width:${score*10}%"></div></div><p class="small">Avaliação autoral para estudo; não é prova oficial nem previsão de resultado no concurso.</p><h3>Desempenho por dificuldade</h3>${statsHTML(state.answers,2)}<h3>Histórico de tentativas (preservado)</h3>${historyHTML()}<h3>Correção comentada</h3>${questions.map((q,i)=>`<div class="review ${state.answers[i]===q.answer?'good':'bad'}"><b>${i<2?'Revisão':'Aula 2'} · Questão ${i+1} — ${state.answers[i]===q.answer?'Acerto':'Revisar'}</b><p class="small">Sua resposta: ${state.answers[i]} · Gabarito: ${q.answer}</p><p>${esc(q.comment)}</p></div>`).join('')}<div class="actions"><button class="btn secondary" id="theory">Revisar aula</button><button class="btn" id="retry">Refazer prova</button></div>`}
function render(){nav();let c=document.getElementById('content');if(state.step<lessons.length){c.innerHTML=lesson();document.getElementById('back').onclick=()=>setStep(Math.max(0,state.step-1));document.getElementById('next').onclick=()=>setStep(state.step+1)}else if(state.step===lessons.length){c.innerHTML=quiz();c.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(state.confirmed[state.q])return;state.answers[state.q]=b.dataset.answer;save();render()});document.getElementById('qback').onclick=()=>{if(state.q){state.q--;save();render()}else setStep(lessons.length-1)};document.getElementById('qnext').onclick=()=>{if(state.answers[state.q]===null)return;if(!state.confirmed[state.q]){state.confirmed[state.q]=true;save();render();return;}if(state.q<11){state.q++;save();render()}else{state.finished=true;state.attempts.push({date:new Date().toISOString(),score:newQuestions.reduce((n,q,i)=>n+(state.answers[i+2]===q.answer),0),total:10,answers:[...state.answers],difficulty:difficultyStats(state.answers,2),reviewScore:review.reduce((n,q,i)=>n+(state.answers[i]===q.answer),0)});setStep(steps.length-1)}}}else{c.innerHTML=results();bindHistory();document.getElementById('theory').onclick=()=>setStep(0);document.getElementById('retry').onclick=()=>{state.answers=Array(12).fill(null);state.confirmed=Array(12).fill(false);state.q=0;state.finished=false;setStep(lessons.length)}}}
document.getElementById('reset').onclick=()=>{if(confirm('Isso apagará também TODO o histórico de tentativas desta aula neste navegador. Deseja continuar?')){state=blank();save();render()}};render();
</script><script id="study-guides-js">(function(){const GUIDE=["Gêneros textuais", [["Notícia", "Relata acontecimentos de interesse público.", ["fato", "quando", "onde", "quem"], "“A prefeitura inaugurou ontem uma biblioteca no centro.”", "Procure dados verificáveis e linguagem informativa."], ["Aviso e comunicado", "Transmitem orientação ou informação prática.", ["atenção", "informamos", "horário", "local"], "“O atendimento será suspenso na sexta-feira, das 8h às 12h.”", "Observe público-alvo, data e finalidade."], ["Receita e instrução", "Ensinam a realizar uma atividade em etapas.", ["misture", "adicione", "aguarde", "primeiro"], "“Misture os ingredientes e asse por 30 minutos.”", "Verbos no imperativo podem indicar instruções."], ["Propaganda", "Busca convencer o leitor a adotar uma ideia ou ação.", ["aproveite", "conheça", "participe"], "“Participe da campanha de coleta seletiva!”", "Identifique a intenção persuasiva, não só o assunto."], ["Relato e crônica", "Relato apresenta experiências; crônica costuma observar situações do cotidiano.", ["eu", "ontem", "naquele dia"], "“Na volta do trabalho, percebi como a rua havia mudado.”", "Um gênero pode combinar narração, descrição e reflexão."]]];function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const btn=document.createElement('button');btn.id='study-guide-launch';btn.type='button';btn.textContent='📖 Regras e exemplos';btn.setAttribute('aria-haspopup','dialog');const shade=document.createElement('div');shade.id='study-guide-shade';shade.innerHTML='<div id="study-guide-dialog" role="dialog" aria-modal="true" aria-label="Regras e exemplos"><div class="ghead"><div><h2>Regras e exemplos</h2><div class="gsub">'+e(GUIDE[0])+' · Consulta rápida para revisar a qualquer momento</div></div><button class="gclose" type="button">Fechar ✕</button></div>'+GUIDE[1].map((g,i)=>'<details '+(i===0?'open':'')+'><summary>'+e(g[0])+'</summary><div class="gbody"><p>'+e(g[1])+'</p><b>Termos e regras</b><div class="gterms">'+g[2].map(x=>'<span>'+e(x)+'</span>').join('')+'</div><b>Exemplo</b><div class="gexample">'+e(g[3])+'</div><div class="gtip"><b>Atenção:</b> '+e(g[4])+'</div></div></details>').join('')+'</div>';document.body.append(btn,shade);function close(){shade.classList.remove('open');btn.focus()}btn.addEventListener('click',()=>{shade.classList.add('open');shade.querySelector('.gclose').focus()});shade.querySelector('.gclose').addEventListener('click',close);shade.addEventListener('click',ev=>{if(ev.target===shade)close()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&shade.classList.contains('open'))close()});})();</script></body></html>
