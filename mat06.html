id #20864e;background:#e3f6ea}.option.wrong{border:2px solid #d04444;background:#ffe8e8}.option:disabled{cursor:default;opacity:1}.difficulty{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px}.difficulty:before{content:"";width:11px;height:11px;border-radius:50%;background:#248b5d}.difficulty.Intermediária:before{background:#e1a42c}.difficulty.Difícil:before{background:#dc4444}.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.feedback{background:#edf8f0;border:1px solid #a6d5b7;border-radius:12px;padding:14px;margin:14px 0}.feedback.bad{background:#fff0f0;border-color:#e5aaaa}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#eef5f2;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}.stat small{color:#607a78}.history{border:1px solid #dbe7e1;padding:14px;border-radius:12px;margin:10px 0}.history summary{cursor:pointer;font-weight:700}.history p{margin:7px 0}.diagram{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0}.diagram span{background:#e2f2eb;border:2px solid #70b5a5;border-radius:12px;padding:14px;text-align:center;font-weight:700}.diagram b{color:#087f78}.diagram small{font-weight:400}.speed,.signs,.tires{display:flex;justify-content:space-around;gap:12px;flex-wrap:wrap;margin:20px 0}.speed span{background:#f5f5f5;border:5px solid #d02f36;border-radius:50%;width:94px;height:94px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:30px;font-weight:900;line-height:1}.speed small{font-size:9px;text-align:center;line-height:1.2;margin-top:5px}.stop{background:#c92f3b;color:white;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);width:110px;height:110px;display:grid;place-items:center;font-weight:900;border:6px solid white}.limit{border:9px solid #c92f3b;border-radius:50%;width:110px;height:110px;display:grid;place-items:center;font-size:38px;font-weight:900}.traffic{border-radius:15px;background:#252c2f;padding:10px;display:flex;flex-direction:column;gap:7px}.traffic i{width:24px;height:24px;border-radius:50%;background:#dd3a3a}.traffic i:nth-child(2){background:#f2b93c}.traffic i:nth-child(3){background:#32ad64}.tires>div{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}.tire{width:110px;height:50px;border:9px solid #30383b;border-radius:12px;background:linear-gradient(90deg,#666 0 28%,#db8c43 28% 72%,#666 72%)}.tire.edges{background:linear-gradient(90deg,#db8c43 0 28%,#666 28% 72%,#db8c43 72%)}.bar{background:#e3e8e6;border-radius:8px;height:28px;overflow:hidden}.bar span{display:block;height:100%;background:#087f78}.notice{font-size:13px;color:#536f70;border-left:3px solid #087f78;padding-left:12px}@media(max-width:600px){.stats{grid-template-columns:1fr}.card{padding:20px}.speed span{width:75px;height:75px;font-size:22px}}</style><style id="study-guides-css">#study-guide-launch{position:fixed;right:18px;bottom:18px;z-index:900;background:#145b57;color:#fff;border:0;border-radius:99px;padding:13px 18px;box-shadow:0 6px 22px #1238;cursor:pointer;font:600 14px system-ui}#study-guide-shade{position:fixed;inset:0;background:#091d24aa;z-index:999;display:none;align-items:center;justify-content:center;padding:14px}#study-guide-shade.open{display:flex}#study-guide-dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;color:#14343b;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0015;font:15px/1.55 system-ui}#study-guide-dialog h2{margin:0;font-size:24px}#study-guide-dialog .ghead{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:16px}#study-guide-dialog .gclose{border:0;border-radius:10px;background:#eaf0ed;padding:9px 13px;cursor:pointer}#study-guide-dialog details{border:1px solid #dce6e0;border-radius:12px;margin:10px 0;overflow:hidden}#study-guide-dialog summary{padding:14px;cursor:pointer;font-weight:750;background:#f4f8f5}#study-guide-dialog .gbody{padding:14px}#study-guide-dialog .gterms{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}#study-guide-dialog .gterms span{background:#e8f4ee;padding:5px 9px;border-radius:7px;font-size:13px}#study-guide-dialog .gexample{background:#f1f5f7;border-left:4px solid #2c827b;padding:10px 12px;border-radius:6px}#study-guide-dialog .gtip{color:#5c4d23;background:#fff7e2;padding:10px 12px;border-radius:8px;margin-top:9px}#study-guide-dialog .gsub{color:#657b7d;font-size:13px;margin-top:4px}@media(max-width:600px){#study-guide-launch{right:12px;bottom:12px;padding:11px 14px}#study-guide-dialog{padding:15px}}</style><style id="official-material-css">.official-section{max-width:960px;margin:18px auto 70px;padding:0 16px}.official-panel{background:#fff;border:1px solid #dbe7e1;border-radius:18px;padding:22px;box-shadow:0 6px 22px #123410}.official-panel h2{margin:0 0 6px}.official-item{margin:15px 0;border:1px solid #dbe7e1;border-radius:12px;padding:15px}.official-quote{white-space:pre-wrap;background:#f2f7f5;border-left:4px solid #147e74;padding:13px;margin:10px 0}.official-meta{font-size:13px;color:#546e70}.official-warning{background:#fff4d9;padding:12px;border-radius:9px;font-size:14px}.official-panel a{font-weight:700}.official-panel summary{cursor:pointer;font-weight:700}</style><style id="math-worked-css">.worked{font-size:16px;line-height:1.75}.worked h3{font-size:17px;line-height:1.4;margin:20px 0 7px;color:#115b59}.worked p{margin:8px 0 14px}.mathfrac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;min-width:1.25em;margin:0 .13em;font-variant-numeric:tabular-nums}.mathfrac>span:first-child{border-bottom:1.7px solid currentColor;padding:0 .2em .14em}.mathfrac>span:last-child{padding:.14em .2em 0}.selected-explanation{background:#fff7df;padding:12px;border-radius:10px;border-left:4px solid #b58321}.feedback{overflow-wrap:anywhere}.worked .mathfrac{font-size:1.12em}</style></head><body><header><div><strong>ROTA DA APROVAÇÃO</strong><small>Conhecimentos Específicos · Aula 02</small></div><a href="index.html">← Disciplinas</a></header><main><div class="progress"><span id="meter"></span></div><section class="card" id="app"></section></main><script>const DATA={"subject":"Raciocínio Lógico e Matemático","title":"Sequências e padrões lógicos","sections":[["Progressão aditiva","<p>Observe a diferença entre termos consecutivos.</p><div class=\"callout\"><b>Exemplo explicado:</b> 2, 5, 8, 11: soma 3; próximo 14.</div>"],["Padrão multiplicativo","<p>Observe se cada termo é multiplicado por um fator.</p><div class=\"callout\"><b>Exemplo explicado:</b> 3, 6, 12, 24: multiplica por 2; próximo 48.</div>"],["Alternância","<p>Algumas sequências alternam duas regras; separe posições pares e ímpares.</p><div class=\"callout\"><b>Exemplo explicado:</b> 1, 10, 2, 20, 3, 30: próximo 4.</div>"],["Verificação","<p>Teste a regra em todos os termos, não apenas nos dois primeiros.</p><div class=\"callout\"><b>Exemplo explicado:</b> 4, 7, 10, 13: diferença +3 em cada passo.</div>"]],"questions":[["2, 4, 6, 8, ...",["10","12","4","7"],0,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>A sequência cresce sempre de 2 em 2.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>2 → 4 → 6 → 8 → 10. Próximo termo: 8 + 2 = 10.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não salte dois termos.</p></div>","Fácil"],["5, 10, 15, 20, ...",["30","25","19","22"],1,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Cada termo aumenta 5.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>5 → 10 → 15 → 20 → 25.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não confunda incremento constante com multiplicação.</p></div>","Fácil"],["3, 6, 12, 24, ...",["48","36","42","45"],0,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Cada termo é o dobro do anterior.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>3 × 2 = 6; 6 × 2 = 12; 12 × 2 = 24; 24 × 2 = 48.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Somar 12 não mantém a regra.</p></div>","Fácil"],["1, 4, 9, 16, ...",["20","25","19","22"],1,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Os termos são 1², 2², 3² e 4².</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>1, 4, 9, 16; próximo 5² = 5 × 5 = 25.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>A diferença cresce, não é constante.</p></div>","Intermediária"],["20, 17, 14, 11, ...",["8","9","2","5"],0,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>A sequência diminui 3 a cada passo.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>20 − 3 = 17; 17 − 3 = 14; 14 − 3 = 11; 11 − 3 = 8.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Verifique mais de um intervalo.</p></div>","Intermediária"],["2, 6, 18, 54, ...",["108","162","156","159"],1,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Cada termo é multiplicado por 3.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>2 × 3 = 6; 6 × 3 = 18; 18 × 3 = 54; 54 × 3 = 162.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Dobrar 54 não segue o padrão.</p></div>","Intermediária"],["1, 10, 2, 20, 3, 30, ...",["4","40","-2","1"],0,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Há duas sequências intercaladas: 1,2,3,... e 10,20,30,...</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>Após 3,30 vem 4,40; o próximo número é 4.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não continue apenas a sequência dos múltiplos de dez.</p></div>","Intermediária"],["100, 50, 25, ...",["15","12,5","6","9"],1,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Cada termo é metade do anterior.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>100 ÷ 2 = 50; 50 ÷ 2 = 25; 25 ÷ 2 = 12,5.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não arredonde 12,5 para 15.</p></div>","Difícil"],["4, 7, 10, 13, ...",["16","17","10","13"],0,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>A sequência aumenta 3 em cada etapa.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>4 → 7 → 10 → 13 → 16.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>O incremento é +3, não +4.</p></div>","Difícil"],["1, 2, 4, 7, 11, ...",["15","16","10","13"],1,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>As diferenças são +1, +2, +3 e +4.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>1 → 2 (+1) → 4 (+2) → 7 (+3) → 11 (+4); próximo +5: 16.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não repita +4; o incremento também cresce.</p></div>","Difícil"]],"id":"mat06","number":"06","review":[]};const KEY='rota-furb-'+DATA.id+'-v1';const all=[...(DATA.review||[]),...DATA.questions];const labels=['A','B','C','D','E'];let s=load();function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.attempts))return o}catch(e){}return {page:0,q:0,answers:Array(all.length).fill(null),confirmed:Array(all.length).fill(false),attempts:[],finished:false}}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function esc(t){return String(t).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function explanation(q,i,answer){const chosen=answer===undefined?s.answers[i]:answer;const correct=q[2];const wrong=chosen!==correct;const label=chosen===null?'Nenhuma alternativa':labels[chosen]+') '+q[1][chosen];const msg=wrong?'<b>Você marcou '+esc(label)+'.</b> Essa alternativa não corresponde ao resultado pedido. Compare o valor escolhido com as etapas do cálculo acima e observe se você marcou uma etapa intermediária, confundiu a operação ou deixou de converter as unidades. A resposta correta é <b>'+labels[correct]+') '+esc(q[1][correct])+'</b>.':'Você marcou a alternativa correta. Confira o raciocínio abaixo para verificar se chegou ao resultado pelo procedimento adequado.';return q[3].replace('<p class="selected-explanation"></p>','<p class="selected-explanation">'+msg+'</p>')}function badge(d){return '<span class="difficulty '+esc(d)+'">'+esc(d)+'</span>'}function go(n){s.page=n;save();render();scrollTo(0,0)}function finish(){if(!s.finished){s.attempts.push({date:new Date().toISOString(),answers:[...s.answers],score:DATA.questions.reduce((v,q,i)=>v+(s.answers[i+(DATA.review||[]).length]===q[2]),0),reviewScore:(DATA.review||[]).reduce((v,q,i)=>v+(s.answers[i]===q[2]),0)});s.finished=true;}go(DATA.sections.length+2)}function retry(){s.answers=Array(all.length).fill(null);s.confirmed=Array(all.length).fill(false);s.q=0;s.finished=false;go(DATA.sections.length+1)}function render(){const el=document.getElementById('app');let p=s.page;document.getElementById('meter').style.width=(Math.min(p,DATA.sections.length+2)/(DATA.sections.length+2)*100)+'%';if(p===0){el.innerHTML='<div class="eyebrow">'+esc(DATA.subject)+' · Aula '+esc(DATA.number)+'</div><h1>'+esc(DATA.title)+'</h1><p class="muted">Aula em telas sequenciais, com explicações, exemplos e avaliação interativa.</p><div class="callout"><b>O que você vai estudar:</b> '+DATA.sections.map(x=>esc(x[0])).join(' · ')+'</div><p class="notice">Material autoral para estudo, não oficial da FURB. A dificuldade é estimativa pedagógica.</p><div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="go(1)">Começar aula →</button></div>';}else if(p<=DATA.sections.length){let a=DATA.sections[p-1];el.innerHTML='<div class="eyebrow">Conteúdo '+p+' de '+DATA.sections.length+'</div><h1>'+esc(a[0])+'</h1>'+a[1]+'<div class="actions"><button class="btn secondary" onclick="go('+(p-1)+')">← Voltar</button><button class="btn" onclick="go('+(p+1)+')">'+(p===DATA.sections.length?'Ir para avaliação':'Próxima tela')+' →</button></div>';}else if(p===DATA.sections.length+1){let i=s.q,q=all[i],isReview=i<(DATA.review||[]).length,confirmed=s.confirmed[i];let options=q[1].map((o,j)=>'<button class="option '+(confirmed&&j===q[2]?'correct':confirmed&&j===s.answers[i]?'wrong':!confirmed&&j===s.answers[i]?'selected':'')+'" '+(confirmed?'disabled':'')+' onclick="choose('+j+')"><b>'+labels[j]+')</b> '+esc(o)+(confirmed&&j===q[2]?' ✓':confirmed&&j===s.answers[i]?' ✕':'')+'</button>').join('');el.innerHTML='<div class="qhead"><div><b>Questão '+(i+1)+' de '+all.length+'</b><div class="muted">'+(isReview?'Revisão da aula anterior':'Conteúdo da aula atual')+'</div></div>'+badge(q[4])+'</div><h2>'+esc(q[0])+'</h2>'+options+(confirmed?'<div class="feedback '+(s.answers[i]===q[2]?'':'bad')+'"><b>'+(s.answers[i]===q[2]?'Resposta correta!':'Resposta incorreta.')+'</b>'+explanation(q,i)+'</div>':'<p class="muted">Selecione uma alternativa e confirme para conferir a explicação.</p>')+'<div class="actions"><button class="btn secondary" onclick="previous()">← Voltar</button><button class="btn" '+(s.answers[i]===null?'disabled':'')+' onclick="advance()">'+(!confirmed?'Confirmar resposta':i===all.length-1?'Finalizar avaliação':'Próxima questão →')+'</button></div>';}else{const last=s.attempts[s.attempts.length-1],first=s.attempts[0],best=Math.max(...s.attempts.map(a=>a.score),0);const current=last||{score:0,reviewScore:0};let diffs=['Fácil','Intermediária','Difícil'].map(d=>{let ix=DATA.questions.map((q,i)=>[q,i]).filter(x=>x[0][4]===d);let ok=ix.filter(x=>current.answers[x[1]+(DATA.review||[]).length]===x[0][2]).length;return '<div class="stat">'+badge(d)+'<b>'+ok+'/'+ix.length+'</b><small>acertos</small></div>'}).join('');let hist=s.attempts.map((a,i)=>'<details class="history"><summary>'+ (i+1)+'ª tentativa · '+new Date(a.date).toLocaleString('pt-BR')+' · '+a.score+'/10</summary><p>Revisão: '+a.reviewScore+'/'+(DATA.review||[]).length+'</p>'+all.map((q,j)=>'<p><b>'+(j+1)+'. '+esc(q[0])+'</b><br>'+badge(q[4])+' · Sua resposta: '+(a.answers[j]===null?'Sem resposta':labels[a.answers[j]])+' · Correta: '+labels[q[2]]+'<br>'+explanation(q,j,a.answers[j])+'</p>').join('')+'</details>').join('');el.innerHTML='<div class="eyebrow">Avaliação concluída</div><h1>Seu desempenho</h1><div class="stats"><div class="stat"><small>Primeira nota</small><b>'+first.score+'/10</b></div><div class="stat"><small>Melhor nota</small><b>'+best+'/10</b></div><div class="stat"><small>Última nota</small><b>'+current.score+'/10</b></div></div><h2>Acertos por dificuldade</h2><div class="stats">'+diffs+'</div><p><b>Revisão da aula anterior:</b> '+current.reviewScore+'/'+(DATA.review||[]).length+' (fora da nota principal).</p><h2>Histórico de tentativas</h2>'+hist+'<div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="retry()">Refazer prova (sem apagar histórico)</button></div>';} }function choose(j){if(!s.confirmed[s.q]){s.answers[s.q]=j;save();render()}}function previous(){if(s.q===0){go(DATA.sections.length)}else{s.q--;save();render()}}function advance(){if(s.answers[s.q]===null)return;if(!s.confirmed[s.q]){s.confirmed[s.q]=true;save();render();return}if(s.q===all.length-1){finish()}else{s.q++;save();render()}}render();</script><script id="study-guides-js">(function(){const GUIDE=["Sequências e padrões lógicos", [["Progressão aditiva", "Observe a diferença entre termos consecutivos.", ["Progressão aditiva"], "2, 5, 8, 11: soma 3; próximo 14.", "Observe a regra e confira o exemplo antes de responder."], ["Padrão multiplicativo", "Observe se cada termo é multiplicado por um fator.", ["Padrão multiplicativo"], "3, 6, 12, 24: multiplica por 2; próximo 48.", "Observe a regra e confira o exemplo antes de responder."], ["Alternância", "Algumas sequências alternam duas regras; separe posições pares e ímpares.", ["Alternância"], "1, 10, 2, 20, 3, 30: próximo 4.", "Observe a regra e confira o exemplo antes de responder."], ["Verificação", "Teste a regra em todos os termos, não apenas nos dois primeiros.", ["Verificação"], "4, 7, 10, 13: diferença +3 em cada passo.", "Observe a regra e confira o exemplo antes de responder."]]];function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const btn=document.createElement('button');btn.id='study-guide-launch';btn.type='button';btn.textContent='📖 Regras e exemplos';btn.setAttribute('aria-haspopup','dialog');const shade=document.createElement('div');shade.id='study-guide-shade';shade.innerHTML='<div id="study-guide-dialog" role="dialog" aria-modal="true" aria-label="Regras e exemplos"><div class="ghead"><div><h2>Regras e exemplos</h2><div class="gsub">'+e(GUIDE[0])+' · Consulta rápida para revisar a qualquer momento</div></div><button class="gclose" type="button">Fechar ✕</button></div>'+GUIDE[1].map((g,i)=>'<details '+(i===0?'open':'')+'><summary>'+e(g[0])+'</summary><div class="gbody"><p>'+e(g[1])+'</p><b>Termos e regras</b><div class="gterms">'+g[2].map(x=>'<span>'+e(x)+'</span>').join('')+'</div><b>Exemplo</b><div class="gexample">'+e(g[3])+'</div><div class="gtip"><b>Atenção:</b> '+e(g[4])+'</div></div></details>').join('')+'</div>';document.body.append(btn,shade);function close(){shade.classList.remove('open');btn.focus()}btn.addEventListener('click',()=>{shade.classList.add('open');shade.querySelector('.gclose').focus()});shade.querySelector('.gclose').addEventListener('click',close);shade.addEventListener('click',ev=>{if(ev.target===shade)close()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&shade.classList.contains('open'))close()});})();</script></body></html>
