<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10323a"><title>Rota da Aprovação • Português Aula 1</title><style>
:root{--ink:#14343b;--muted:#607780;--teal:#087f78;--mint:#e9f5f0;--paper:#f7f5ef;--line:#dce7e3;--gold:#ffc975}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer}header{background:#10313a;color:#fff;padding:15px max(22px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{letter-spacing:.06em}header small{display:block;color:#bbd5d5;font-size:12px}header button{background:transparent;color:#fff;border:1px solid #709397;border-radius:12px;padding:8px 13px;font-size:13px}.shell{max-width:1100px;margin:28px auto;padding:0 18px;display:grid;grid-template-columns:235px minmax(0,1fr);gap:25px}.side,.page{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 30px #14343b0b}.side{padding:20px;align-self:start;position:sticky;top:16px}.side h3{font-size:12px;letter-spacing:.09em;margin:0 0 14px}.navbtn{display:block;width:100%;border:0;text-align:left;padding:11px 12px;border-radius:12px;background:transparent;color:#547078;margin:4px 0}.navbtn.active{background:var(--mint);color:#006d65;font-weight:750}.navbtn span{display:inline-grid;place-items:center;background:#e4efec;width:26px;height:26px;border-radius:8px;margin-right:7px;font-size:12px}.meter{height:9px;border-radius:30px;background:#e8eeeb;overflow:hidden;margin:9px 0}.meter div{height:100%;background:var(--teal);width:0;transition:width .25s}.side p{font-size:12px;color:var(--muted)}.page{padding:clamp(22px,5vw,48px);min-height:600px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--teal);font-weight:800;text-transform:uppercase}h1{font-size:clamp(32px,5vw,49px);line-height:1.12;letter-spacing:-.04em;margin:10px 0 18px}h2{font-size:clamp(24px,3vw,33px);line-height:1.2;margin:12px 0 18px}h3{font-size:19px;margin:23px 0 8px}p{margin:12px 0}.lead{font-size:19px;color:#3e6067}.callout{padding:17px 20px;background:var(--mint);border-left:5px solid var(--teal);border-radius:12px;margin:23px 0}.example{background:#f7f8f6;border:1px solid var(--line);border-radius:15px;padding:18px 21px;margin:20px 0}.example em{color:#45636a}.actions{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-top:28px}.btn{border:0;border-radius:13px;padding:12px 19px;font-weight:750;background:var(--teal);color:white}.btn.secondary{background:#eaf2ef;color:#125b59}.btn:disabled{opacity:.4;cursor:not-allowed}.art{width:100%;max-height:245px;display:block;margin:12px auto 22px}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip{font-size:12px;padding:5px 10px;border-radius:30px;border:1px solid #b8d5cd;color:#26655f}.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.triple div{padding:17px 12px;background:#f0f7f3;border-radius:13px;text-align:center}.triple b{display:block;color:#087f78}.triple small{font-size:12px}.options{display:grid;gap:10px;margin:22px 0}.option{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid #d7e5df;background:white;padding:13px 16px;border-radius:12px;color:var(--ink)}.option:hover{border-color:#0a847a}.option.selected{border:2px solid var(--teal);background:#e9f6f0;padding:12px 15px}.letter{font-weight:800;color:#087f78;min-width:24px}.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.qtext{font-size:19px;font-weight:650}.score{font-size:56px;font-weight:800;color:var(--teal);line-height:1.1}.review{border:1px solid var(--line);border-radius:14px;padding:17px;margin:12px 0}.review.good{border-left:5px solid #15876c}.review.bad{border-left:5px solid #d88c38}.small{font-size:13px;color:var(--muted)}.dots{display:flex;gap:5px;flex-wrap:wrap}.dot{width:20px;height:7px;border-radius:5px;background:#e4eeea}.dot.done{background:#168d82}.dot.current{background:#ffc975}@media(max-width:730px){.shell{display:block;margin:12px auto}.side{position:static;margin-bottom:12px;padding:12px}.side nav{display:flex;overflow-x:auto;gap:4px}.navbtn{white-space:nowrap;width:auto;font-size:12px}.side h3,.side p{display:none}.page{min-height:560px;padding:23px}.triple{grid-template-columns:1fr}header{padding:12px 16px}}


.option.correct{background:#e0f6e9!important;border:2px solid #16824b!important;color:#115d37!important}.option.wrong{background:#ffebea!important;border:2px solid #c83939!important;color:#9a2525!important}.option:disabled{cursor:default;opacity:1}.feedback{padding:16px;border-radius:14px;margin:15px 0;border:1px solid #cce6d9;background:#f0faf5}.feedback.bad{border-color:#f0b8b8;background:#fff2f1}.feedback b{display:block;margin-bottom:7px}.course-link{display:inline-flex;padding:9px 14px;background:#e9f5f0;color:#075e58;border-radius:10px;text-decoration:none;font-weight:700;margin-top:8px}.option{width:100%;text-align:left}.review.bad{border-left-color:#c83939!important}
</style></head><body><header><div><strong>ROTA DA APROVAÇÃO</strong><small>FURB · Motorista · Português</small></div><a class="course-link" href="index.html">← Disciplinas</a><button id="reset">Reiniciar progresso</button></header><main class="shell"><aside class="side"><h3>SEU CAMINHO</h3><nav id="nav"></nav><hr style="border:0;border-top:1px solid #e3eae6;margin:18px 0"><div class="small">Progresso da aula · <span id="pct">0%</span></div><div class="meter"><div id="bar"></div></div><p>Salvo somente neste navegador. Sem cadastro.</p></aside><section class="page" id="content" aria-live="polite"></section></main><script>
const questions=[{"topic": "Aviso de biblioteca", "passage": "Devido à manutenção da rede elétrica, a biblioteca permanecerá fechada na manhã de terça-feira. O atendimento será retomado às 13h, caso o serviço seja concluído no prazo previsto. Em caso de atraso, uma nova informação será publicada no site.", "ask": "De acordo com o aviso, qual afirmação é correta?", "options": ["A biblioteca ficará fechada durante toda a terça-feira, sem exceções.", "A retomada às 13h depende da conclusão do serviço no prazo previsto.", "O atendimento será retomado obrigatoriamente às 13h.", "A manutenção ocorrerá na quarta-feira.", "O site deixará de publicar informações sobre o atendimento."], "answer": "B", "comment": "A retomada às 13h depende da conclusão da manutenção no prazo. As alternativas A e C transformam uma condição em certeza; D troca o dia; E contradiz o aviso."}, {"topic": "Comunicado", "passage": "O mutirão de limpeza reuniu moradores de três ruas. Ao final, os participantes decidiram organizar novos encontros mensais. A prefeitura informou que poderá fornecer equipamentos, conforme a disponibilidade.", "ask": "Qual conclusão pode ser sustentada pelo texto?", "options": ["A prefeitura garantiu equipamentos para todos os encontros.", "Todos os moradores da cidade participaram.", "O mutirão foi realizado durante três meses.", "Há intenção de continuar a iniciativa com encontros mensais.", "A prefeitura proibiu a realização de novos encontros."], "answer": "D", "comment": "A decisão de organizar novos encontros sustenta D. 'Poderá' não significa garantia; 'três ruas' não significa a cidade inteira nem três meses."}, {"topic": "Texto informativo", "passage": "A horta comunitária começou com seis canteiros. Depois de um ano, passou a ter doze. O aumento permitiu cultivar mais variedades de hortaliças, mas a distribuição ainda depende do trabalho voluntário.", "ask": "Qual é a ideia central?", "options": ["A horta cresceu e diversificou a produção, embora continue dependente de voluntários.", "A distribuição deixou de depender de voluntários.", "A horta foi encerrada após um ano.", "A quantidade de canteiros permaneceu igual.", "O texto trata exclusivamente de métodos de irrigação."], "answer": "A", "comment": "A alternativa A reúne o crescimento da horta e a dependência de voluntários. B, C e D contradizem o texto; E introduz assunto ausente."}, {"topic": "Opinião", "passage": "A praça recebeu bancos novos e iluminação. A mudança foi importante, mas ainda faltam árvores que ofereçam sombra durante o dia. Um espaço público acolhedor precisa considerar diferentes horários de uso.", "ask": "A palavra “mas” estabelece relação de:", "options": ["Adição de duas informações equivalentes.", "Explicação da causa da reforma.", "Oposição entre uma melhoria e uma necessidade ainda existente.", "Conclusão de que a praça será fechada.", "Condição para a instalação dos bancos."], "answer": "C", "comment": "'Mas' introduz oposição ou ressalva: houve melhorias, porém ainda faltam árvores. Não indica causa nem condição."}, {"topic": "Relato", "passage": "Quando chegou à escola, Lúcia encontrou o portão fechado. Consultou o aviso afixado na entrada e descobriu que as aulas daquele turno haviam sido suspensas por falta de energia.", "ask": "Qual informação é explícita?", "options": ["Lúcia havia sido avisada por telefone.", "O problema de energia duraria uma semana.", "Todos os turnos tiveram aulas suspensas.", "A escola estava definitivamente fechada.", "As aulas daquele turno foram suspensas por falta de energia."], "answer": "E", "comment": "O texto informa diretamente que as aulas daquele turno foram suspensas por falta de energia. As demais alternativas inventam informações."}, {"topic": "Informação e opinião", "passage": "A feira do bairro funciona aos domingos, das 7h às 12h. Para muitos frequentadores, é o lugar mais agradável para comprar frutas e verduras.", "ask": "Qual trecho expressa uma avaliação subjetiva?", "options": ["“funciona aos domingos”", "“das 7h às 12h”", "“a feira do bairro”", "“o lugar mais agradável”", "“comprar frutas e verduras”"], "answer": "D", "comment": "'Mais agradável' expressa avaliação subjetiva. As outras expressões descrevem informações ou elementos do texto."}, {"topic": "Referência textual", "passage": "A equipe preparou um relatório sobre as pontes da região. O documento será enviado aos responsáveis pela manutenção, que deverão avaliar as recomendações.", "ask": "A expressão “O documento” retoma:", "options": ["As pontes da região.", "Um relatório preparado pela equipe.", "Os responsáveis pela manutenção.", "As recomendações futuras.", "A região inteira."], "answer": "B", "comment": "'O documento' retoma 'um relatório'. As outras expressões não são o referente dessa retomada."}, {"topic": "Condição", "passage": "Se a previsão de chuva forte se confirmar, a apresentação será transferida para o auditório. Caso contrário, ocorrerá no pátio, como planejado.", "ask": "Qual alternativa preserva o sentido?", "options": ["A apresentação ocorrerá no auditório independentemente do tempo.", "O evento foi cancelado.", "A previsão de chuva forte já se confirmou.", "O pátio foi interditado permanentemente.", "A escolha do local depende da confirmação da previsão de chuva forte."], "answer": "E", "comment": "'Se... caso contrário' estabelece condição. A escolha do local depende da previsão de chuva forte se confirmar."}, {"topic": "Argumentação", "passage": "Separar resíduos recicláveis é uma medida útil, mas não substitui a redução do desperdício. Comprar apenas o necessário também contribui para diminuir a quantidade de lixo produzida.", "ask": "O autor defende principalmente que:", "options": ["A redução do desperdício deve acompanhar a separação dos recicláveis.", "A reciclagem deve ser abandonada.", "Comprar mais produtos diminui a quantidade de lixo.", "Separar resíduos é a única medida necessária.", "O lixo produzido não depende dos hábitos de consumo."], "answer": "A", "comment": "O autor defende medidas complementares: separar recicláveis e reduzir desperdício. As outras opções distorcem ou contradizem o argumento."}, {"topic": "Leitura crítica", "passage": "Após a instalação de um novo sistema de agendamento, o tempo médio de espera caiu de 40 para 25 minutos. A administração informou que continuará avaliando os resultados antes de decidir se ampliará o serviço.", "ask": "Assinale a alternativa que NÃO é sustentada pelo texto.", "options": ["O tempo médio de espera diminuiu após a instalação do sistema.", "A administração pretende continuar avaliando os resultados.", "A ampliação do serviço já foi definitivamente aprovada.", "A espera média passou a ser de 25 minutos.", "A decisão sobre ampliar o serviço ainda depende de avaliação."], "answer": "C", "comment": "A ampliação ainda não foi aprovada; a administração continuará avaliando. A questão pede a alternativa NÃO sustentada."}];
const steps=['Boas-vindas','Conceitos','Ideia central','Inferências','Fato e opinião','Relações e referências','Técnicas de prova','Exemplos resolvidos','Prova','Resultado'];
const KEY='rota-furb-pt-aula1-v3';
const blank=()=>({step:0,seen:0,q:0,answers:Array(10).fill(null),finished:false,confirmed:Array(10).fill(false),attempts:[]});
let state=blank();try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&Array.isArray(old.answers)&&old.answers.length===10){state={...blank(),...old};}}catch(e){}
if(!Array.isArray(state.confirmed)||state.confirmed.length!==state.answers.length)state.confirmed=Array(state.answers.length).fill(false);
if(!Array.isArray(state.attempts))state.attempts=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const svg=(kind)=>{let art={book:`<rect x="118" y="65" width="160" height="126" rx="10" fill="#fff9eb"/><rect x="282" y="65" width="160" height="126" rx="10" fill="#e2f5ed"/><path d="M280 75v116" stroke="#4b9d91" stroke-width="5"/><path d="M143 100h104M143 125h92M143 150h103M307 100h104M307 125h92M307 150h103" stroke="#8dbbb1" stroke-width="7" stroke-linecap="round"/><circle cx="413" cy="168" r="38" fill="#c5eee1" stroke="#09857b" stroke-width="9"/><path d="m441 196 40 40" stroke="#09857b" stroke-width="13" stroke-linecap="round"/>`,flow:`<rect x="35" y="85" width="145" height="95" rx="16" fill="#e3f3ed"/><rect x="225" y="85" width="145" height="95" rx="16" fill="#d4ece6"/><rect x="415" y="85" width="145" height="95" rx="16" fill="#e3f3ed"/><path d="m184 133h36m-9 -10 10 10 -10 10M375 133h35m-9 -10 10 10 -10 10" stroke="#0a8077" stroke-width="5" fill="none"/><text x="107" y="139" text-anchor="middle" font-size="17" fill="#164a4b">PISTAS</text><text x="297" y="139" text-anchor="middle" font-size="17" fill="#164a4b">LIGAÇÃO</text><text x="487" y="139" text-anchor="middle" font-size="17" fill="#164a4b">CONCLUSÃO</text>`,focus:`<circle cx="297" cy="133" r="90" fill="#e4f5ef"/><circle cx="297" cy="133" r="60" fill="none" stroke="#08877b" stroke-width="10"/><circle cx="297" cy="133" r="24" fill="#ffc975"/><path d="M297 18v35M297 214v35M183 133h35M376 133h35" stroke="#09857b" stroke-width="6" stroke-linecap="round"/>`,scale:`<path d="M297 55v151M190 95h214M220 95l-48 84h96zM370 95l-48 84h96z" fill="#e2f4ee" stroke="#087f78" stroke-width="6" stroke-linejoin="round"/><circle cx="297" cy="52" r="14" fill="#ffc975"/><path d="M245 208h104" stroke="#087f78" stroke-width="12" stroke-linecap="round"/>`};return `<svg class="art" viewBox="0 0 600 270" role="img" aria-label="Ilustração didática" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="600" height="270" rx="24" fill="#f0f8f4"/>${art[kind]||art.book}</svg>`};
function setStep(n){if(n===9&&!state.finished)return;state.step=Math.max(0,Math.min(9,n));state.seen=Math.max(state.seen,state.step);save();render();window.scrollTo({top:0,behavior:'instant'});}
function go(n){setStep(n)}
function nav(){document.getElementById('nav').innerHTML=steps.map((s,i)=>`<button class="navbtn ${state.step===i?'active':''}" data-step="${i}" ${i===9&&!state.finished?'disabled':''}><span>${i+1}</span>${s}</button>`).join('');document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>setStep(+b.dataset.step)));let done=state.finished?100:Math.min(95,Math.round((state.seen*8+state.answers.filter(x=>x!==null).length*2.5)));document.getElementById('pct').textContent=done+'%';document.getElementById('bar').style.width=done+'%'}
function actions(prev,next,label='Avançar →'){return `<div class="actions"><button class="btn secondary" id="back">← Voltar</button><button class="btn" id="next">${label}</button></div>`}
function lesson(){let pages=[
`<div class="eyebrow">Trilha de estudos · Aula 01</div><h1>Entender o texto é o primeiro passo.</h1><p class="lead">Aprenda a compreender, analisar e interpretar textos com explicações, esquemas e uma prova de 10 questões.</p>${svg('book')}<div class="chips"><span class="chip">Nível fundamental</span><span class="chip">10 questões</span><span class="chip">Progresso salvo</span></div><div class="callout"><b>Objetivo:</b> localizar informações, reconhecer relações entre ideias e tirar conclusões sustentadas pelo texto — sem inventar fatos.</div><p class="small">Material independente, baseado no tópico de compreensão, análise e interpretação de textos do Anexo III do Edital nº 001/2026. Questões autorais, não oficiais da FURB.</p>`,
`<div class="eyebrow">01 · Fundamentos</div><h2>Três maneiras de ler um texto</h2>${svg('book')}<div class="triple"><div><b>COMPREENDER</b><small>O que está escrito?</small></div><div><b>ANALISAR</b><small>Como as ideias se ligam?</small></div><div><b>INTERPRETAR</b><small>O que se pode concluir?</small></div></div><h3>Compreensão</h3><p>Identificar informações <b>explícitas</b>, como nomes, datas, horários e acontecimentos.</p><h3>Análise</h3><p>Observar como o texto foi construído: palavras, relações entre frases e expressões como <b>embora</b>, <b>porque</b> e <b>portanto</b>.</p><h3>Interpretação</h3><p>Formular uma conclusão com base em pistas do texto. Uma interpretação não é uma invenção.</p><div class="example"><b>Leia:</b> “Embora o céu estivesse claro, Renata levou um guarda-chuva. À tarde, choveu.”<p><b>Compreensão:</b> Renata levou um guarda-chuva.<br><b>Análise:</b> “embora” introduz contraste.<br><b>Interpretação:</b> Renata agiu com precaução.</p></div>`,
`<div class="eyebrow">02 · Mensagem principal</div><h2>Tema, ideia central e detalhes</h2>${svg('focus')}<p><b>Tema</b> é o assunto geral. <b>Ideia central</b> é o principal recado sobre esse assunto. <b>Detalhes</b> ajudam a explicar ou comprovar a mensagem.</p><div class="example">“A biblioteca passou a abrir aos sábados. A mudança permite que moradores que trabalham durante a semana possam emprestar livros. O atendimento será das 9h às 13h.”</div><p><b>Tema:</b> funcionamento da biblioteca.<br><b>Ideia central:</b> abertura aos sábados amplia o acesso.<br><b>Detalhe:</b> horário das 9h às 13h.</p><div class="callout"><b>Técnica:</b> tente resumir o texto em uma frase. Se sua frase mencionar apenas um horário ou nome, talvez você tenha escolhido um detalhe, e não a ideia central.</div>`,
`<div class="eyebrow">03 · Inferência</div><h2>O que está escrito e o que se pode concluir?</h2>${svg('flow')}<p><b>Explícito:</b> a informação está declarada. <b>Implícito:</b> o sentido é sugerido. <b>Inferir:</b> ligar pistas para chegar a uma conclusão fundamentada.</p><div class="example">“A reunião estava marcada para as 14h. Às 14h10, a sala permanecia vazia e a porta estava trancada.”</div><p><b>Explícito:</b> às 14h10, a sala estava vazia.<br><b>Inferência possível:</b> a reunião provavelmente não havia começado naquela sala.<br><b>Conclusão indevida:</b> a reunião foi cancelada definitivamente.</p><div class="callout">Cuidado com palavras absolutas: <b>sempre, nunca, todos, obrigatoriamente</b>. O texto pode indicar apenas uma possibilidade.</div>`,
`<div class="eyebrow">04 · Leitura crítica</div><h2>Fato, opinião e intenção do autor</h2>${svg('scale')}<p><b>Fato:</b> afirmação verificável. <b>Opinião:</b> avaliação ou julgamento. Uma afirmação verificável não é necessariamente verdadeira sem comprovação.</p><div class="example"><b>“A feira abre às 8h.”</b> Informação factual.<br><b>“A feira é o melhor passeio da cidade.”</b> Opinião — “melhor” é um julgamento.</div><h3>Para que o texto foi escrito?</h3><p>Um aviso busca <b>informar</b>. Uma campanha pode <b>convencer</b>. Uma instrução pretende <b>orientar</b>. Um relato conta acontecimentos. Observe a mensagem inteira.</p><div class="callout">Se a pergunta pedir a opinião do autor, não responda com sua opinião pessoal: identifique a posição expressa no texto.</div>`,
`<div class="eyebrow">05 · Construção do sentido</div><h2>Relações entre frases e palavras retomadas</h2>${svg('flow')}<p>Palavras pequenas podem mudar completamente o sentido.</p><div class="example"><b>Causa:</b> porque, já que — “Ficou em casa porque chovia.”<br><b>Consequência:</b> por isso, portanto — “Chovia; por isso, ficou em casa.”<br><b>Oposição:</b> mas, porém — “Estudou, mas não terminou.”<br><b>Concessão:</b> embora — “Embora cansado, estudou.”<br><b>Condição:</b> se, caso — “Se chover, a atividade será adiada.”<br><b>Finalidade:</b> para, a fim de — “Saiu cedo para chegar no horário.”</div><h3>Palavras que retomam outras</h3><p>“A prefeitura instalou novas placas. <b>Elas</b> serão avaliadas após três meses.” A palavra <b>elas</b> retoma <b>novas placas</b>.</p><div class="callout">Substitua mentalmente o pronome pelo termo que você acha que ele retoma. Veja se a frase continua coerente.</div>`,
`<div class="eyebrow">06 · Estratégia de prova</div><h2>Como evitar armadilhas</h2>${svg('focus')}<h3>1. Generalização</h3><p>“Alguns moradores participaram” não significa “todos participaram”.</p><h3>2. Inversão</h3><p>“O evento foi adiado devido à chuva” não significa que o evento causou a chuva.</p><h3>3. Informação inventada</h3><p>Se o texto menciona bicicletas para pequenas entregas, não conclua que todos os carros foram eliminados.</p><h3>4. Palavra decisiva</h3><p>Leia atentamente: <b>incorreta, exceto, não, apenas</b>.</p><div class="callout"><b>Método em cinco passos:</b> leia o comando; leia o texto; localize evidências; compare todas as alternativas; confira se a questão pede a correta ou a incorreta.</div>`,
`<div class="eyebrow">07 · Exemplos resolvidos</div><h2>Agora, vamos aplicar</h2><div class="example"><b>Comunicado</b><p>“A partir de segunda-feira, o atendimento presencial será realizado mediante agendamento. Pessoas que já possuem horário marcado não precisarão fazer nova solicitação. O atendimento telefônico permanecerá disponível.”</p><b>Pergunta:</b> quem já possui horário marcado precisa agendar novamente?<p><b>Resposta:</b> não. O segundo período informa expressamente a dispensa. Não confunda agendamento obrigatório com cancelamento do atendimento.</p></div><div class="example"><b>Texto de opinião</b><p>“A cidade ganhou novas ciclovias. Ainda assim, considero que a integração com o transporte público precisa melhorar. Não basta ampliar caminhos: é necessário planejar os deslocamentos.”</p><b>Pergunta:</b> qual a posição principal do autor?<p><b>Resposta:</b> ampliar ciclovias, sozinho, não resolve a integração dos deslocamentos. “Ainda assim” introduz uma ressalva.</p></div><div class="callout">Você concluiu a teoria. A seguir, a prova terá dez questões, uma por tela. O gabarito será revelado somente depois de finalizar.</div>`,
];return pages[state.step]}
function quiz(){let i=state.q,q=questions[i];return `<div class="eyebrow">Avaliação · Português</div><div class="qhead"><h2>Questão ${i+1} de 10</h2><span class="chip">${esc(q.topic)}</span></div><div class="dots">${questions.map((_,j)=>`<span class="dot ${state.answers[j]!==null?'done':''} ${i===j?'current':''}"></span>`).join('')}</div><div class="example"><b>Leia o texto:</b><p>“${esc(q.passage)}”</p></div><p class="qtext">${esc(q.ask)}</p><div class="options">${q.options.map((op,j)=>`<button class="option ${state.confirmed[i]?(String.fromCharCode(65+j)===q.answer?'correct':state.answers[i]===String.fromCharCode(65+j)?'wrong':''):(state.answers[i]===String.fromCharCode(65+j)?'selected':'')}" ${state.confirmed[i]?'disabled':''} data-answer="${String.fromCharCode(65+j)}"><span class="letter">${String.fromCharCode(65+j)})</span><span>${esc(op)}</span></button>`).join('')}</div>${state.confirmed[i]?`<div class="feedback ${state.answers[i]===q.answer?'':'bad'}"><b>${state.answers[i]===q.answer?'✓ Resposta correta!':'✕ Resposta incorreta.'}</b><div>Alternativa correta: <strong>${q.answer}</strong>. ${esc(q.comment)}</div></div>`:''}<p class="small">As respostas ficam salvas no navegador. Após confirmar, a correção aparece em verde ou vermelho.</p><div class="actions"><button class="btn secondary" id="qback">← ${i?'Questão anterior':'Voltar à teoria'}</button><button class="btn" id="qnext" ${state.answers[i]===null?'disabled':''}>${!state.confirmed[i]?'Confirmar resposta':i===9?'Finalizar e corrigir':'Próxima questão →'}</button></div>`}
function results(){let score=questions.reduce((a,q,i)=>a+(state.answers[i]===q.answer),0);return `<div class="eyebrow">Boletim de desempenho</div><h2>Sua avaliação foi concluída!</h2><div class="score">${score}/10</div><p class="lead">${score>=9?'Ótimo aproveitamento nesta avaliação.':score>=7?'Bom resultado. Revise os pontos que geraram dúvidas.':score>=5?'Você está desenvolvendo a base. Vale revisar a teoria.':'Recomendamos retomar os conceitos e exemplos antes de refazer a prova.'}</p><div class="meter"><div style="width:${score*10}%"></div></div><p class="small">Este resultado mede apenas esta prova autoral, não prevê desempenho no concurso.</p><h3>Histórico de tentativas</h3>${state.attempts.slice().reverse().map((a,i)=>`<div class="review"><b>Tentativa ${state.attempts.length-i}</b><p class="small">${new Date(a.date).toLocaleString('pt-BR')} · ${a.score}/${a.total} acertos</p></div>`).join('')||'<p>Nenhuma tentativa registrada.</p>'}<h3>Correção comentada</h3>${questions.map((q,i)=>`<div class="review ${state.answers[i]===q.answer?'good':'bad'}"><b>Questão ${i+1} — ${state.answers[i]===q.answer?'Acertou':'Revisar'}</b><p class="small">Sua resposta: ${state.answers[i]||'em branco'} · Correta: ${q.answer}</p><p>${esc(q.comment)}</p></div>`).join('')}<div class="actions"><button class="btn secondary" id="theory">Revisar teoria</button><button class="btn" id="retry">Refazer prova</button></div>`}
function render(){nav();let c=document.getElementById('content');if(state.step<8){c.innerHTML=lesson()+actions(state.step-1,state.step+1,state.step===7?'Iniciar prova →':'Continuar →');document.getElementById('back').onclick=()=>setStep(Math.max(0,state.step-1));document.getElementById('next').onclick=()=>setStep(state.step+1)}else if(state.step===8){c.innerHTML=quiz();c.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(state.confirmed[state.q])return;state.answers[state.q]=b.dataset.answer;save();render()});document.getElementById('qback').onclick=()=>{if(state.q>0){state.q--;save();render()}else setStep(7)};document.getElementById('qnext').onclick=()=>{if(state.answers[state.q]===null)return;if(!state.confirmed[state.q]){state.confirmed[state.q]=true;save();render();return;}if(state.q<9){state.q++;save();render()}else{state.finished=true;state.attempts.push({date:new Date().toISOString(),score:questions.reduce((n,q,i)=>n+(state.answers[i]===q.answer),0),total:questions.length,answers:[...state.answers]});setStep(9)}}}else{c.innerHTML=results();document.getElementById('theory').onclick=()=>setStep(1);document.getElementById('retry').onclick=()=>{state.answers=Array(10).fill(null);state.confirmed=Array(10).fill(false);state.q=0;state.finished=false;setStep(8)}}}
document.getElementById('reset').onclick=()=>{if(confirm('Deseja apagar o progresso desta aula neste navegador?')){state=blank();save();render()}};render();
</script></body></html>
