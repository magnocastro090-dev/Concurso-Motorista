<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Rota da Aprovação · Conhecimentos Específicos · Aula 03</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f6f0;color:#14343b;font:16px/1.65 system-ui,Segoe UI,sans-serif}header{background:#10313a;color:white;padding:15px max(18px,calc((100vw - 1060px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header small{display:block;color:#b6d2d0;font-size:12px}a{color:#087f78}header a{color:white;text-decoration:none;border:1px solid #638b8a;padding:8px 12px;border-radius:10px;font-size:13px}main{max-width:960px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #dbe7e1;border-radius:20px;padding:clamp(20px,5vw,40px);box-shadow:0 10px 35px #1234 0a}h1{font-size:clamp(27px,4vw,43px);line-height:1.18;margin:6px 0 18px}h2{font-size:25px;line-height:1.25}p{margin:12px 0}.muted{color:#647b7d}.eyebrow{font-size:12px;font-weight:800;color:#087f78;letter-spacing:.08em;text-transform:uppercase}.example,.callout{padding:17px 19px;background:#eef7f2;border-radius:12px;margin:18px 0}.example{background:#f7f8f6;border:1px solid #dbe7e1}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}.btn{border:0;border-radius:12px;background:#087f78;color:white;padding:12px 19px;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:#e6f3ee;color:#116d65}.btn:disabled{opacity:.4;cursor:default}.progress{height:8px;background:#e1eae5;border-radius:20px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:#087f78;transition:width .2s}.option{display:flex;gap:10px;align-items:start;width:100%;padding:13px 16px;border:1px solid #d5e4dd;border-radius:12px;background:white;color:#14343b;text-align:left;margin:9px 0;font:inherit;cursor:pointer}.option.selected{border:2px solid #087f78;background:#eef8f3}.option.correct{border:2px solid #20864e;background:#e3f6ea}.option.wrong{border:2px solid #d04444;background:#ffe8e8}.option:disabled{cursor:default;opacity:1}.difficulty{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px}.difficulty:before{content:"";width:11px;height:11px;border-radius:50%;background:#248b5d}.difficulty.Intermediária:before{background:#e1a42c}.difficulty.Difícil:before{background:#dc4444}.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.feedback{background:#edf8f0;border:1px solid #a6d5b7;border-radius:12px;padding:14px;margin:14px 0}.feedback.bad{background:#fff0f0;border-color:#e5aaaa}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#eef5f2;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}.stat small{color:#607a78}.history{border:1px solid #dbe7e1;padding:14px;border-radius:12px;margin:10px 0}.history summary{cursor:pointer;font-weight:700}.history p{margin:7px 0}.diagram{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0}.diagram span{background:#e2f2eb;border:2px solid #70b5a5;border-radius:12px;padding:14px;text-align:center;font-weight:700}.diagram b{color:#087f78}.diagram small{font-weight:400}.speed,.signs,.tires{display:flex;justify-content:space-around;gap:12px;flex-wrap:wrap;margin:20px 0}.speed span{background:#f5f5f5;border:5px solid #d02f36;border-radius:50%;width:94px;height:94px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:30px;font-weight:900;line-height:1}.speed small{font-size:9px;text-align:center;line-height:1.2;margin-top:5px}.stop{background:#c92f3b;color:white;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);width:110px;height:110px;display:grid;place-items:center;font-weight:900;border:6px solid white}.limit{border:9px solid #c92f3b;border-radius:50%;width:110px;height:110px;display:grid;place-items:center;font-size:38px;font-weight:900}.traffic{border-radius:15px;background:#252c2f;padding:10px;display:flex;flex-direction:column;gap:7px}.traffic i{width:24px;height:24px;border-radius:50%;background:#dd3a3a}.traffic i:nth-child(2){background:#f2b93c}.traffic i:nth-child(3){background:#32ad64}.tires>div{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}.tire{width:110px;height:50px;border:9px solid #30383b;border-radius:12px;background:linear-gradient(90deg,#666 0 28%,#db8c43 28% 72%,#666 72%)}.tire.edges{background:linear-gradient(90deg,#db8c43 0 28%,#666 28% 72%,#db8c43 72%)}.bar{background:#e3e8e6;border-radius:8px;height:28px;overflow:hidden}.bar span{display:block;height:100%;background:#087f78}.notice{font-size:13px;color:#536f70;border-left:3px solid #087f78;padding-left:12px}@media(max-width:600px){.stats{grid-template-columns:1fr}.card{padding:20px}.speed span{width:75px;height:75px;font-size:22px}}</style><style id="study-guides-css">#study-guide-launch{position:fixed;right:18px;bottom:18px;z-index:900;background:#145b57;color:#fff;border:0;border-radius:99px;padding:13px 18px;box-shadow:0 6px 22px #1238;cursor:pointer;font:600 14px system-ui}#study-guide-shade{position:fixed;inset:0;background:#091d24aa;z-index:999;display:none;align-items:center;justify-content:center;padding:14px}#study-guide-shade.open{display:flex}#study-guide-dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;color:#14343b;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0015;font:15px/1.55 system-ui}#study-guide-dialog h2{margin:0;font-size:24px}#study-guide-dialog .ghead{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:16px}#study-guide-dialog .gclose{border:0;border-radius:10px;background:#eaf0ed;padding:9px 13px;cursor:pointer}#study-guide-dialog details{border:1px solid #dce6e0;border-radius:12px;margin:10px 0;overflow:hidden}#study-guide-dialog summary{padding:14px;cursor:pointer;font-weight:750;background:#f4f8f5}#study-guide-dialog .gbody{padding:14px}#study-guide-dialog .gterms{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}#study-guide-dialog .gterms span{background:#e8f4ee;padding:5px 9px;border-radius:7px;font-size:13px}#study-guide-dialog .gexample{background:#f1f5f7;border-left:4px solid #2c827b;padding:10px 12px;border-radius:6px}#study-guide-dialog .gtip{color:#5c4d23;background:#fff7e2;padding:10px 12px;border-radius:8px;margin-top:9px}#study-guide-dialog .gsub{color:#657b7d;font-size:13px;margin-top:4px}@media(max-width:600px){#study-guide-launch{right:12px;bottom:12px;padding:11px 14px}#study-guide-dialog{padding:15px}}</style><style id="official-material-css">.official-section{max-width:960px;margin:18px auto 70px;padding:0 16px}.official-panel{background:#fff;border:1px solid #dbe7e1;border-radius:18px;padding:22px;box-shadow:0 6px 22px #123410}.official-panel h2{margin:0 0 6px}.official-item{margin:15px 0;border:1px solid #dbe7e1;border-radius:12px;padding:15px}.official-quote{white-space:pre-wrap;background:#f2f7f5;border-left:4px solid #147e74;padding:13px;margin:10px 0}.official-meta{font-size:13px;color:#546e70}.official-warning{background:#fff4d9;padding:12px;border-radius:9px;font-size:14px}.official-panel a{font-weight:700}.official-panel summary{cursor:pointer;font-weight:700}</style></head><body><header><div><strong>ROTA DA APROVAÇÃO</strong><small>Conhecimentos Específicos · Aula 02</small></div><a href="index.html">← Disciplinas</a></header><main><div class="progress"><span id="meter"></span></div><section class="card" id="app"></section></main><script>const DATA={"subject": "Conhecimentos Específicos", "title": "Infrações, penalidades e medidas administrativas", "sections": [["1. Infração, penalidade e medida administrativa", "<p>Infração é a conduta que viola regra de trânsito. Penalidade é a consequência sancionatória prevista na lei. Medida administrativa é providência operacional aplicada nas condições legais, muitas vezes para impedir a continuidade de uma situação irregular.</p><p class=\"notice\"><b>Base legal:</b> CTB, arts. 161, 256 e 269. <a href=\"https://www.planalto.gov.br/ccivil_03/leis/l9503compilado.htm\" target=\"_blank\" rel=\"noopener\">Consultar redação oficial atualizada</a>. As explicações abaixo são didáticas, não transcrições integrais dos artigos.</p><ul><li><b>Exemplos de penalidades:</b> multa, advertência por escrito, suspensão do direito de dirigir e cassação da habilitação, conforme hipóteses legais.</li><li><b>Exemplos de medidas administrativas:</b> retenção ou remoção do veículo, recolhimento de documento, transbordo do excesso de carga, conforme hipóteses legais.</li><li>Uma infração pode dar origem a penalidade e a medida administrativa, conforme o caso.</li></ul><div class=\"example\"><b>Exemplo prático</b><p>Uma questão pergunta se “transbordo de excesso de carga” é medida administrativa. Sim: é providência prevista no art. 269. Multa, por outro lado, é penalidade.</p></div><div class=\"callout\"><b>Atenção na prova:</b> Não trate retenção e remoção como sinônimos nem classifique multa como medida administrativa.</div>"], ["2. Gravidade, pontos e consequências", "<p>As infrações são classificadas por gravidade e podem gerar pontos e valores de multa conforme o CTB. A soma de pontos é relevante, mas há infrações que têm consequências específicas, independentemente de atingir um total de pontos.</p><p class=\"notice\"><b>Base legal:</b> CTB, arts. 258, 259 e 261. <a href=\"https://www.planalto.gov.br/ccivil_03/leis/l9503compilado.htm\" target=\"_blank\" rel=\"noopener\">Consultar redação oficial atualizada</a>. As explicações abaixo são didáticas, não transcrições integrais dos artigos.</p><ul><li>Leve: 3 pontos.</li><li>Média: 4 pontos.</li><li>Grave: 5 pontos.</li><li>Gravíssima: 7 pontos.</li></ul><div class=\"example\"><b>Exemplo prático</b><p>Duas infrações graves e uma média totalizam 14 pontos (5 + 5 + 4). Isso, isoladamente, não permite concluir que haverá suspensão: é preciso observar as regras legais aplicáveis.</p></div><div class=\"callout\"><b>Atenção na prova:</b> A gravidade da infração e a penalidade específica são informações diferentes.</div>"], ["3. Suspensão por pontos e EAR", "<p>A suspensão por acúmulo de pontos exige atenção às condições do art. 261. Para condutores comuns, o limite no período de 12 meses depende da quantidade de infrações gravíssimas. Há regra específica para condutor que exerce atividade remunerada ao veículo (EAR).</p><p class=\"notice\"><b>Base legal:</b> CTB, art. 261. <a href=\"https://www.planalto.gov.br/ccivil_03/leis/l9503compilado.htm\" target=\"_blank\" rel=\"noopener\">Consultar redação oficial atualizada</a>. As explicações abaixo são didáticas, não transcrições integrais dos artigos.</p><ul><li>Regra geral: 20 pontos com duas ou mais infrações gravíssimas.</li><li>Regra geral: 30 pontos com uma infração gravíssima.</li><li>Regra geral: 40 pontos sem infração gravíssima.</li><li>Para condutor com EAR, o limite por pontos é de 40, independentemente da natureza das infrações, conforme regra legal específica.</li></ul><div class=\"example\"><b>Exemplo prático</b><p>Motorista com EAR alcança 30 pontos, incluindo infrações gravíssimas. Não se deve aplicar automaticamente a mesma faixa de suspensão por pontos de quem não possui EAR.</p></div><div class=\"callout\"><b>Atenção na prova:</b> Não confunda suspensão por pontos com suspensão decorrente de infração que prevê essa penalidade de forma específica.</div>"], ["4. Retenção, remoção e recolhimento", "<p>Essas medidas têm objetivos diferentes. A retenção está associada à regularização de irregularidade nas condições previstas; a remoção envolve deslocamento do veículo para depósito ou local indicado, conforme a lei. Recolhimento de documentos segue hipóteses específicas.</p><p class=\"notice\"><b>Base legal:</b> CTB, arts. 269, 270 e 271. <a href=\"https://www.planalto.gov.br/ccivil_03/leis/l9503compilado.htm\" target=\"_blank\" rel=\"noopener\">Consultar redação oficial atualizada</a>. As explicações abaixo são didáticas, não transcrições integrais dos artigos.</p><ul><li>Identifique primeiro a irregularidade descrita.</li><li>Verifique qual medida o dispositivo correspondente prevê.</li><li>Não suponha que toda irregularidade exige remoção.</li><li>O procedimento concreto depende dos requisitos legais e da possibilidade de regularização.</li></ul><div class=\"example\"><b>Exemplo prático</b><p>Em prova, a alternativa pode dizer que “retenção é penalidade aplicada pelo juiz”. Está incorreta: retenção é medida administrativa prevista no CTB.</p></div><div class=\"callout\"><b>Atenção na prova:</b> Medidas administrativas não são sinônimos de sanções penais.</div>"], ["5. Crimes de trânsito e infrações administrativas", "<p>Nem toda infração de trânsito é crime. O CTB prevê crimes específicos no Capítulo XIX, com requisitos e penas próprios. Para responder corretamente, é preciso identificar a conduta, a existência de vítima, o elemento de culpa ou dolo quando pertinente e circunstâncias legalmente previstas.</p><p class=\"notice\"><b>Base legal:</b> CTB, arts. 291 a 312-B. <a href=\"https://www.planalto.gov.br/ccivil_03/leis/l9503compilado.htm\" target=\"_blank\" rel=\"noopener\">Consultar redação oficial atualizada</a>. As explicações abaixo são didáticas, não transcrições integrais dos artigos.</p><ul><li>Infração administrativa: sujeita a penalidades e medidas do CTB.</li><li>Crime de trânsito: pode gerar processo penal e penas previstas em lei.</li><li>Uma mesma situação pode ter repercussões administrativas e penais, conforme o caso.</li></ul><div class=\"example\"><b>Exemplo prático</b><p>Um enunciado descreve morte causada por condutor sob influência de álcool. Não basta dizer “homicídio culposo”: é preciso verificar a forma legal aplicável e suas consequências.</p></div><div class=\"callout\"><b>Atenção na prova:</b> Desconfie de alternativas que substituem reclusão por mera multa ou afirmam que bons antecedentes impedem toda consequência penal.</div>"], ["6. Condutas após acidente", "<p>A prioridade é preservar a vida e evitar novos riscos. O CTB prevê deveres e condutas proibidas relacionados a acidentes, inclusive situações envolvendo omissão de socorro e afastamento do local para fugir de responsabilidade.</p><p class=\"notice\"><b>Base legal:</b> CTB, arts. 176, 304 e 305. <a href=\"https://www.planalto.gov.br/ccivil_03/leis/l9503compilado.htm\" target=\"_blank\" rel=\"noopener\">Consultar redação oficial atualizada</a>. As explicações abaixo são didáticas, não transcrições integrais dos artigos.</p><ul><li>Adote medidas seguras de sinalização e proteção do local.</li><li>Acione serviços de emergência quando houver vítimas.</li><li>Não movimente vítimas sem necessidade e sem orientação adequada, salvo risco iminente que exija intervenção.</li><li>Não abandone o local com o propósito de fugir à responsabilidade penal ou civil.</li></ul><div class=\"example\"><b>Exemplo prático</b><p>Após colisão com vítima, o motorista sai do local apenas para evitar identificação. A situação exige análise da conduta tipificada no art. 305, não pode ser tratada como simples falta de cortesia.</p></div><div class=\"callout\"><b>Atenção na prova:</b> O texto legal distingue condutas diferentes. Não confunda deixar de prestar socorro com afastar-se para fugir à responsabilidade.</div>"], ["7. Órgãos de trânsito: quem faz o quê", "<p>O Sistema Nacional de Trânsito reúne órgãos e entidades com atribuições distintas. Questões de concurso frequentemente trocam nomes para confundir competência normativa, fiscalização e execução.</p><p class=\"notice\"><b>Base legal:</b> CTB, arts. 5º a 25. <a href=\"https://www.planalto.gov.br/ccivil_03/leis/l9503compilado.htm\" target=\"_blank\" rel=\"noopener\">Consultar redação oficial atualizada</a>. As explicações abaixo são didáticas, não transcrições integrais dos artigos.</p><ul><li><b>CONTRAN:</b> órgão máximo normativo e consultivo do Sistema Nacional de Trânsito.</li><li><b>SENATRAN:</b> órgão máximo executivo de trânsito da União.</li><li><b>Órgãos estaduais e municipais:</b> exercem atribuições próprias previstas no CTB.</li><li><b>CETRAN:</b> conselho estadual de trânsito, com atribuições previstas na lei.</li></ul><div class=\"example\"><b>Exemplo prático</b><p>Se o enunciado pergunta quem estabelece normas regulamentares do CTB no âmbito da competência do conselho nacional, a referência é o CONTRAN.</p></div><div class=\"callout\"><b>Atenção na prova:</b> CONTRAN não é sinônimo de SENATRAN; um é conselho normativo, outro é órgão executivo.</div>"], ["8. Fiscalização: leitura cuidadosa de enunciados", "<p>Questões sobre infrações costumam apresentar uma descrição concreta e perguntar qual consequência se aplica. Não é seguro responder por semelhança com casos conhecidos: a infração exata pode mudar o enquadramento.</p><ul><li>Identifique o comportamento: estacionar, parar, circular, transportar, ultrapassar, conduzir sob influência etc.</li><li>Localize o dispositivo legal e a natureza da infração.</li><li>Separe penalidade de medida administrativa.</li><li>Observe exceções e requisitos expressos.</li><li>Confira se a questão trata de crime ou de infração administrativa.</li></ul><div class=\"example\"><b>Exemplo prático</b><p>Uma questão afirma “multa é medida administrativa”. Releia a distinção: multa aparece entre as penalidades do art. 256; medidas estão no art. 269.</p></div><div class=\"callout\"><b>Atenção na prova:</b> Não memorize somente o gabarito de uma prova antiga: a banca pode trocar um detalhe e alterar a resposta.</div>"], ["9. Revisão guiada antes dos exercícios", "<p>Antes da avaliação, faça uma checagem mental das distinções mais cobradas. A finalidade é conseguir justificar cada escolha pela regra, não pela posição da alternativa.</p><ul><li>Você consegue dar dois exemplos de penalidade e dois de medida administrativa?</li><li>Consegue explicar o que muda no limite por pontos para motorista com EAR?</li><li>Consegue distinguir CONTRAN de SENATRAN?</li><li>Consegue diferenciar infração administrativa e crime de trânsito?</li><li>Sabe qual artigo consultar quando a questão menciona abandono do local de acidente?</li></ul><div class=\"example\"><b>Exemplo prático</b><p>Se você acertar “transbordo de carga” apenas porque viu a questão anterior, retorne ao art. 269 e explique com suas palavras por que é medida administrativa.</p></div><div class=\"callout\"><b>Atenção na prova:</b> A avaliação é uma etapa de verificação; a aprendizagem principal deve acontecer neste capítulo.</div>"]], "questions": [["Ao fiscalizar um veículo com excesso de carga, qual providência é classificada como medida administrativa?", ["Transbordo do excesso de carga", "Multa", "Suspensão do direito de dirigir", "Advertência por escrito", "Cassação da habilitação"], 0, "O CTB separa penalidades (art. 256) de medidas administrativas (art. 269). O transbordo da carga excedente é medida administrativa (art. 269, VIII): busca regularizar a situação do veículo. A multa e a suspensão são penalidades, e não medidas administrativas. Por isso A está correta.", "Intermediária"], ["Qual alternativa apresenta uma penalidade prevista no CTB, e não uma medida administrativa?", ["Retenção do veículo", "Remoção do veículo", "Recolhimento do documento de habilitação", "Multa", "Transbordo do excesso de carga"], 3, "O art. 256 do CTB inclui a multa entre as penalidades. Retenção, remoção, recolhimento de documento e transbordo são providências administrativas previstas no art. 269. A distinção importa porque uma medida pode acompanhar uma penalidade, mas não é sinônimo dela.", "Fácil"], ["A retenção do veículo deve ser entendida, em regra, como:", ["Pena criminal de trânsito", "Medida administrativa para sanar irregularidade, conforme a hipótese legal", "Cancelamento definitivo da CNH", "Sinônimo de multa", "Suspensão automática do direito de dirigir"], 1, "O art. 270 do CTB disciplina a retenção do veículo. Ela é medida administrativa destinada à regularização nas situações previstas, não pena criminal nem suspensão de habilitação. A alternativa B é a única que respeita essa classificação.", "Intermediária"], ["Qual órgão estabelece normas regulamentares previstas no CTB e diretrizes da Política Nacional de Trânsito?", ["CETRAN", "Prefeitura", "CONTRAN", "Polícia Rodoviária Federal", "Departamento de obras"], 2, "O art. 12, I, do CTB atribui essa competência ao Conselho Nacional de Trânsito (CONTRAN). CETRAN atua em âmbito estadual e não substitui o órgão máximo normativo e consultivo do Sistema Nacional de Trânsito.", "Intermediária"], ["A suspensão do direito de dirigir, quando aplicada nos termos do CTB, é:", ["Medida administrativa", "Penalidade", "Apenas advertência informal", "Procedimento de manutenção", "Modalidade de sinalização"], 1, "O art. 256 do CTB lista a suspensão do direito de dirigir entre as penalidades. Não se deve confundir com recolhimento de documento, que é medida administrativa em hipóteses previstas.", "Fácil"], ["Um motorista se afasta do local do acidente para fugir à responsabilidade penal ou civil. A conduta é tratada pelo CTB como:", ["Simples falha de manutenção", "Crime de trânsito previsto no art. 305", "Infração exclusivamente por estacionamento", "Direito automático do condutor", "Conduta sem previsão legal"], 1, "O art. 305 do CTB tipifica afastar-se o condutor do local do acidente para fugir à responsabilidade penal ou civil que lhe possa ser atribuída. A finalidade de escapar à responsabilidade é parte essencial do enunciado. Portanto, B é a resposta; não basta afirmar que todo afastamento é crime.", "Difícil"], ["Para condutor com EAR registrada, qual é o limite de pontos no período de 12 meses referido no art. 261, § 5º, do CTB?", ["20 pontos em qualquer caso", "30 pontos em qualquer caso", "40 pontos, independentemente da natureza das infrações", "15 pontos", "50 pontos"], 2, "O art. 261, § 5º, do CTB prevê 40 pontos para condutor que exerce atividade remunerada ao veículo, independentemente da natureza das infrações. Isso difere das faixas gerais de 20, 30 ou 40 pontos, que variam conforme infrações gravíssimas. Confira a redação vigente do dispositivo na biblioteca.", "Difícil"], ["No CTB, qual situação exemplifica medida administrativa e não penalidade?", ["Advertência por escrito", "Multa", "Cassação da CNH", "Remoção do veículo", "Suspensão do direito de dirigir"], 3, "O art. 269 inclui a remoção entre as medidas administrativas. As demais alternativas são penalidades do art. 256. Uma medida administrativa atua na situação concreta do veículo ou do condutor, mas não deve ser confundida com a punição.", "Fácil"], ["Sobre a relação entre penalidade e medida administrativa, é correto afirmar:", ["Uma substitui sempre a outra", "Uma medida nunca pode acompanhar multa", "Podem coexistir quando a legislação assim prevê", "Toda infração exige remoção", "Toda infração exige suspensão"], 2, "O CTB prevê sanções e providências distintas para certas infrações. A medida administrativa não elimina automaticamente a penalidade, nem é obrigatória em toda infração. A opção C evita os absolutos indevidos (“sempre”, “nunca”, “toda”).", "Intermediária"], ["Em uma questão que pede a classificação jurídica da multa de trânsito, qual fonte deve ser consultada primeiro?", ["Opinião do condutor", "Manual do fabricante", "CTB, art. 256", "Código Civil, apenas", "Tabela de manutenção"], 2, "O art. 256 do CTB enumera penalidades e inclui a multa. O art. 269 enumera medidas administrativas. Consultar os dispositivos correspondentes evita confundir categorias. Por isso a alternativa C é a correta.", "Difícil"]], "id": "esp03", "number": "03", "review": []};const KEY='rota-furb-'+DATA.id+'-v1';const all=[...(DATA.review||[]),...DATA.questions];const labels=['A','B','C','D','E'];let s=load();function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.attempts))return o}catch(e){}return {page:0,q:0,answers:Array(all.length).fill(null),confirmed:Array(all.length).fill(false),attempts:[],finished:false}}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function esc(t){return String(t).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function badge(d){return '<span class="difficulty '+esc(d)+'">'+esc(d)+'</span>'}function go(n){s.page=n;save();render();scrollTo(0,0)}function finish(){if(!s.finished){s.attempts.push({date:new Date().toISOString(),answers:[...s.answers],score:DATA.questions.reduce((v,q,i)=>v+(s.answers[i+(DATA.review||[]).length]===q[2]),0),reviewScore:(DATA.review||[]).reduce((v,q,i)=>v+(s.answers[i]===q[2]),0)});s.finished=true;}go(DATA.sections.length+2)}function retry(){s.answers=Array(all.length).fill(null);s.confirmed=Array(all.length).fill(false);s.q=0;s.finished=false;go(DATA.sections.length+1)}function render(){const el=document.getElementById('app');let p=s.page;document.getElementById('meter').style.width=(Math.min(p,DATA.sections.length+2)/(DATA.sections.length+2)*100)+'%';if(p===0){el.innerHTML='<div class="eyebrow">'+esc(DATA.subject)+' · Aula '+esc(DATA.number)+'</div><h1>'+esc(DATA.title)+'</h1><p class="muted">Aula em telas sequenciais, com explicações, exemplos e avaliação interativa.</p><div class="callout"><b>O que você vai estudar:</b> '+DATA.sections.map(x=>esc(x[0])).join(' · ')+'</div><p class="notice">Material autoral para estudo, não oficial da FURB. A dificuldade é estimativa pedagógica.</p><div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="go(1)">Começar aula →</button></div>';}else if(p<=DATA.sections.length){let a=DATA.sections[p-1];el.innerHTML='<div class="eyebrow">Conteúdo '+p+' de '+DATA.sections.length+'</div><h1>'+esc(a[0])+'</h1>'+a[1]+'<div class="actions"><button class="btn secondary" onclick="go('+(p-1)+')">← Voltar</button><button class="btn" onclick="go('+(p+1)+')">'+(p===DATA.sections.length?'Ir para avaliação':'Próxima tela')+' →</button></div>';}else if(p===DATA.sections.length+1){let i=s.q,q=all[i],isReview=i<(DATA.review||[]).length,confirmed=s.confirmed[i];let options=q[1].map((o,j)=>'<button class="option '+(confirmed&&j===q[2]?'correct':confirmed&&j===s.answers[i]?'wrong':!confirmed&&j===s.answers[i]?'selected':'')+'" '+(confirmed?'disabled':'')+' onclick="choose('+j+')"><b>'+labels[j]+')</b> '+esc(o)+(confirmed&&j===q[2]?' ✓':confirmed&&j===s.answers[i]?' ✕':'')+'</button>').join('');el.innerHTML='<div class="qhead"><div><b>Questão '+(i+1)+' de '+all.length+'</b><div class="muted">'+(isReview?'Revisão da aula anterior':'Conteúdo da aula atual')+'</div></div>'+badge(q[4])+'</div><h2>'+esc(q[0])+'</h2>'+options+(confirmed?'<div class="feedback '+(s.answers[i]===q[2]?'':'bad')+'"><b>'+(s.answers[i]===q[2]?'Resposta correta!':'Resposta incorreta.')+'</b>'+esc(q[3])+'</div>':'<p class="muted">Selecione uma alternativa e confirme para conferir a explicação.</p>')+'<div class="actions"><button class="btn secondary" onclick="previous()">← Voltar</button><button class="btn" '+(s.answers[i]===null?'disabled':'')+' onclick="advance()">'+(!confirmed?'Confirmar resposta':i===all.length-1?'Finalizar avaliação':'Próxima questão →')+'</button></div>';}else{const last=s.attempts[s.attempts.length-1],first=s.attempts[0],best=Math.max(...s.attempts.map(a=>a.score),0);const current=last||{score:0,reviewScore:0};let diffs=['Fácil','Intermediária','Difícil'].map(d=>{let ix=DATA.questions.map((q,i)=>[q,i]).filter(x=>x[0][4]===d);let ok=ix.filter(x=>current.answers[x[1]+(DATA.review||[]).length]===x[0][2]).length;return '<div class="stat">'+badge(d)+'<b>'+ok+'/'+ix.length+'</b><small>acertos</small></div>'}).join('');let hist=s.attempts.map((a,i)=>'<details class="history"><summary>'+ (i+1)+'ª tentativa · '+new Date(a.date).toLocaleString('pt-BR')+' · '+a.score+'/10</summary><p>Revisão: '+a.reviewScore+'/'+(DATA.review||[]).length+'</p>'+all.map((q,j)=>'<p><b>'+(j+1)+'. '+esc(q[0])+'</b><br>'+badge(q[4])+' · Sua resposta: '+(a.answers[j]===null?'Sem resposta':labels[a.answers[j]])+' · Correta: '+labels[q[2]]+'<br>'+esc(q[3])+'</p>').join('')+'</details>').join('');el.innerHTML='<div class="eyebrow">Avaliação concluída</div><h1>Seu desempenho</h1><div class="stats"><div class="stat"><small>Primeira nota</small><b>'+first.score+'/10</b></div><div class="stat"><small>Melhor nota</small><b>'+best+'/10</b></div><div class="stat"><small>Última nota</small><b>'+current.score+'/10</b></div></div><h2>Acertos por dificuldade</h2><div class="stats">'+diffs+'</div><p><b>Revisão da aula anterior:</b> '+current.reviewScore+'/'+(DATA.review||[]).length+' (fora da nota principal).</p><h2>Histórico de tentativas</h2>'+hist+'<div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="retry()">Refazer prova (sem apagar histórico)</button></div>';} }function choose(j){if(!s.confirmed[s.q]){s.answers[s.q]=j;save();render()}}function previous(){if(s.q===0){go(DATA.sections.length)}else{s.q--;save();render()}}function advance(){if(s.answers[s.q]===null)return;if(!s.confirmed[s.q]){s.confirmed[s.q]=true;save();render();return}if(s.q===all.length-1){finish()}else{s.q++;save();render()}}render();</script><script id="study-guides-js">(function(){const GUIDE=["Infrações, penalidades e medidas administrativas", [["Infração", "É a inobservância de preceito da legislação de trânsito. A conduta deve corresponder à tipificação legal.", ["Infração"], "Desrespeitar sinalização pode constituir infração.", "Revise a explicação e confira a aplicação no contexto."], ["Penalidade", "É consequência prevista na lei, como multa ou suspensão do direito de dirigir, quando cabível.", ["Penalidade"], "A multa é penalidade; não é medida administrativa.", "Revise a explicação e confira a aplicação no contexto."], ["Medida administrativa", "Providência aplicada pela autoridade/agente nas hipóteses legais, como retenção ou remoção de veículo.", ["Medida administrativa"], "A remoção é medida administrativa, não sinônimo de multa.", "Revise a explicação e confira a aplicação no contexto."], ["Responsabilidade", "A atribuição de responsabilidade depende da natureza da infração e das regras do CTB.", ["Responsabilidade"], "Nem toda infração recai automaticamente sobre o proprietário.", "Revise a explicação e confira a aplicação no contexto."]]];function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const btn=document.createElement('button');btn.id='study-guide-launch';btn.type='button';btn.textContent='📖 Regras e exemplos';btn.setAttribute('aria-haspopup','dialog');const shade=document.createElement('div');shade.id='study-guide-shade';shade.innerHTML='<div id="study-guide-dialog" role="dialog" aria-modal="true" aria-label="Regras e exemplos"><div class="ghead"><div><h2>Regras e exemplos</h2><div class="gsub">'+e(GUIDE[0])+' · Consulta rápida para revisar a qualquer momento</div></div><button class="gclose" type="button">Fechar ✕</button></div>'+GUIDE[1].map((g,i)=>'<details '+(i===0?'open':'')+'><summary>'+e(g[0])+'</summary><div class="gbody"><p>'+e(g[1])+'</p><b>Termos e regras</b><div class="gterms">'+g[2].map(x=>'<span>'+e(x)+'</span>').join('')+'</div><b>Exemplo</b><div class="gexample">'+e(g[3])+'</div><div class="gtip"><b>Atenção:</b> '+e(g[4])+'</div></div></details>').join('')+'</div>';document.body.append(btn,shade);function close(){shade.classList.remove('open');btn.focus()}btn.addEventListener('click',()=>{shade.classList.add('open');shade.querySelector('.gclose').focus()});shade.querySelector('.gclose').addEventListener('click',close);shade.addEventListener('click',ev=>{if(ev.target===shade)close()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&shade.classList.contains('open'))close()});})();</script></body></html>
