fic{border-radius:15px;background:#252c2f;padding:10px;display:flex;flex-direction:column;gap:7px}.traffic i{width:24px;height:24px;border-radius:50%;background:#dd3a3a}.traffic i:nth-child(2){background:#f2b93c}.traffic i:nth-child(3){background:#32ad64}.tires>div{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}.tire{width:110px;height:50px;border:9px solid #30383b;border-radius:12px;background:linear-gradient(90deg,#666 0 28%,#db8c43 28% 72%,#666 72%)}.tire.edges{background:linear-gradient(90deg,#db8c43 0 28%,#666 28% 72%,#db8c43 72%)}.bar{background:#e3e8e6;border-radius:8px;height:28px;overflow:hidden}.bar span{display:block;height:100%;background:#087f78}.notice{font-size:13px;color:#536f70;border-left:3px solid #087f78;padding-left:12px}@media(max-width:600px){.stats{grid-template-columns:1fr}.card{padding:20px}.speed span{width:75px;height:75px;font-size:22px}}</style><style id="study-guides-css">#study-guide-launch{position:fixed;right:18px;bottom:18px;z-index:900;background:#145b57;color:#fff;border:0;border-radius:99px;padding:13px 18px;box-shadow:0 6px 22px #1238;cursor:pointer;font:600 14px system-ui}#study-guide-shade{position:fixed;inset:0;background:#091d24aa;z-index:999;display:none;align-items:center;justify-content:center;padding:14px}#study-guide-shade.open{display:flex}#study-guide-dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;color:#14343b;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0015;font:15px/1.55 system-ui}#study-guide-dialog h2{margin:0;font-size:24px}#study-guide-dialog .ghead{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:16px}#study-guide-dialog .gclose{border:0;border-radius:10px;background:#eaf0ed;padding:9px 13px;cursor:pointer}#study-guide-dialog details{border:1px solid #dce6e0;border-radius:12px;margin:10px 0;overflow:hidden}#study-guide-dialog summary{padding:14px;cursor:pointer;font-weight:750;background:#f4f8f5}#study-guide-dialog .gbody{padding:14px}#study-guide-dialog .gterms{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}#study-guide-dialog .gterms span{background:#e8f4ee;padding:5px 9px;border-radius:7px;font-size:13px}#study-guide-dialog .gexample{background:#f1f5f7;border-left:4px solid #2c827b;padding:10px 12px;border-radius:6px}#study-guide-dialog .gtip{color:#5c4d23;background:#fff7e2;padding:10px 12px;border-radius:8px;margin-top:9px}#study-guide-dialog .gsub{color:#657b7d;font-size:13px;margin-top:4px}@media(max-width:600px){#study-guide-launch{right:12px;bottom:12px;padding:11px 14px}#study-guide-dialog{padding:15px}}</style><style id="official-material-css">.official-section{max-width:960px;margin:18px auto 70px;padding:0 16px}.official-panel{background:#fff;border:1px solid #dbe7e1;border-radius:18px;padding:22px;box-shadow:0 6px 22px #123410}.official-panel h2{margin:0 0 6px}.official-item{margin:15px 0;border:1px solid #dbe7e1;border-radius:12px;padding:15px}.official-quote{white-space:pre-wrap;background:#f2f7f5;border-left:4px solid #147e74;padding:13px;margin:10px 0}.official-meta{font-size:13px;color:#546e70}.official-warning{background:#fff4d9;padding:12px;border-radius:9px;font-size:14px}.official-panel a{font-weight:700}.official-panel summary{cursor:pointer;font-weight:700}</style></head><body><header><div><strong>ROTA DA APROVAÇÃO</strong><small>Conhecimentos Específicos · Aula 02</small></div><a href="index.html">← Disciplinas</a></header><main><div class="progress"><span id="meter"></span></div><section class="card" id="app"></section></main><script>const DATA={"subject": "Conhecimentos Específicos", "title": "Motor, transmissão, suspensão, freios e direção", "sections": [["1. Motor: função e funcionamento básico", "<p>O motor transforma energia do combustível em movimento por processos de admissão, compressão, combustão e escape nos motores de quatro tempos. Filtros, lubrificação e arrefecimento são essenciais para reduzir desgaste e controlar temperatura. Ruídos anormais, perda de potência e fumaça incomum exigem avaliação.</p><div class=\"example\"><b>Situação prática</b><p>A luz de pressão do óleo acende em funcionamento: procure parar com segurança e seguir orientação do fabricante; continuar rodando pode causar danos graves.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Não confunda temperatura do motor com nível de óleo.</div><p><b>Correspondência com o programa:</b> Edital: noções de motor, conservação e pequenos reparos de emergência.</p>"], ["2. Lubrificação e verificação do óleo", "<p>O óleo reduz atrito e desgaste, ajuda a dissipar calor e protege componentes. Verifique nível com o veículo em condições indicadas pelo fabricante, usando vareta ou sistema eletrônico conforme modelo. Não complete com produto incompatível. Vazamentos e alertas exigem registro.</p><div class=\"example\"><b>Situação prática</b><p>Nível abaixo do mínimo não deve ser ignorado; confira especificação e comunique a necessidade de manutenção.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Óleo escuro isoladamente não determina a hora exata de troca: siga plano de manutenção e avaliação técnica.</div><p><b>Correspondência com o programa:</b> Edital: óleo e lubrificantes.</p>"], ["3. Sistema de arrefecimento", "<p>O sistema mantém o motor na faixa de temperatura adequada por meio de fluido, bomba, radiador, termostato e ventilação. Superaquecimento pode resultar de vazamento ou falha em componentes. Não abra tampa do reservatório pressurizado com o motor quente, pelo risco de queimadura.</p><div class=\"example\"><b>Situação prática</b><p>Ao notar temperatura excessiva, estacione em local seguro, desligue conforme orientação e peça assistência.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Água fria despejada em motor muito quente e abertura imediata de tampa podem agravar riscos.</div><p><b>Correspondência com o programa:</b> Edital: sistema de arrefecimento.</p>"], ["4. Transmissão e embreagem", "<p>A transmissão leva torque do motor às rodas e permite adequar força e velocidade. Em veículo manual, a embreagem acopla e desacopla o motor da transmissão; em automático, o funcionamento varia conforme projeto. Trancos, patinação, ruídos e dificuldade de engate devem ser comunicados.</p><div class=\"example\"><b>Situação prática</b><p>Em subida, segurar o veículo apenas no ponto de embreagem pode causar desgaste e perda de controle; use procedimento correto de imobilização.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Marcha mais alta não é automaticamente a mais segura para qualquer subida ou descida.</div><p><b>Correspondência com o programa:</b> Edital: sistema de transmissão.</p>"], ["5. Suspensão, direção e pneus", "<p>Suspensão mantém contato dos pneus com o solo e contribui para estabilidade e conforto. Direção permite orientar as rodas; folgas, vibrações e puxadas laterais podem indicar problemas. Pressão e sulcos dos pneus afetam aderência, frenagem e consumo.</p><div class=\"example\"><b>Situação prática</b><p>Veículo puxa fortemente para um lado: verifique condições e solicite inspeção, sem presumir uma única causa.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Alinhamento e balanceamento têm finalidades diferentes; ambos não substituem inspeção de pneus e suspensão.</div><p><b>Correspondência com o programa:</b> Edital: suspensão, direção e pneus.</p>"], ["6. Sistema de freios e ABS", "<p>Freios transformam energia de movimento em calor e reduzem velocidade. O ABS ajuda a evitar travamento das rodas em frenagens intensas, favorecendo controle direcional; não elimina limites de aderência nem garante menor distância em todo piso. Pedal anormal, ruídos e vazamentos são sinais de alerta.</p><div class=\"example\"><b>Situação prática</b><p>Em pista molhada, mantenha distância maior mesmo com ABS; tecnologia não substitui direção defensiva.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> ABS não autoriza velocidade excessiva ou frenagem tardia.</div><p><b>Correspondência com o programa:</b> Edital: freios e condições de segurança.</p>"], ["7. Bateria, alternador e sistema elétrico", "<p>A bateria fornece energia para partida e consumidores elétricos; o alternador, acionado pelo motor, gera eletricidade e alimenta o sistema, recarregando a bateria quando apropriado. Fusíveis protegem circuitos; faróis e sinalizadores são itens de segurança.</p><div class=\"example\"><b>Situação prática</b><p>Se o alternador deixa de carregar, a bateria pode sustentar parte dos consumidores por tempo limitado até descarregar.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> O alternador não é a peça que armazena energia para a partida: essa função é da bateria.</div><p><b>Correspondência com o programa:</b> Edital: bateria, faróis e sistema elétrico.</p>"], ["8. Inspeção e panes em viagem", "<p>Antes de sair, verifique visualmente pneus, iluminação, níveis permitidos, vazamentos e alertas. Durante a viagem, não ignore sinais de superaquecimento, falha de freio ou direção. Pare em segurança, sinalize e solicite assistência quando necessário.</p><div class=\"example\"><b>Situação prática</b><p>Se o pedal do freio apresenta comportamento anormal, interrompa o uso do veículo com segurança e acione manutenção.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Pequeno reparo de emergência não significa improvisar em componentes críticos de segurança.</div><p><b>Correspondência com o programa:</b> Edital: inspeção diária, manutenção preventiva e avarias.</p>"]], "questions": [["Função principal dos freios:", ["reduzir velocidade", "aumentar potência", "Ambas as alternativas", "Nenhuma das alternativas"], 0, "Freios desaceleram o veículo.", "Fácil"], ["Função da transmissão:", ["resfriar radiador", "levar movimento às rodas", "Ambas as alternativas", "Nenhuma das alternativas"], 1, "Transmissão conduz torque.", "Fácil"], ["Suspensão auxilia em:", ["absorver irregularidades", "acender faróis", "Ambas as alternativas", "Nenhuma das alternativas"], 0, "Suspensão contribui para estabilidade e conforto.", "Fácil"], ["Arrefecimento ajuda a:", ["encher pneus", "controlar temperatura do motor", "Ambas as alternativas", "Nenhuma das alternativas"], 1, "Arrefecimento dissipa calor.", "Intermediária"], ["Reservatório de arrefecimento muito quente deve ser:", ["mantido fechado até resfriar", "aberto imediatamente", "Ambas as alternativas", "Nenhuma das alternativas"], 0, "Abrir quente pode causar queimaduras.", "Intermediária"], ["A direção permite:", ["medir combustível", "orientar trajetória", "Ambas as alternativas", "Nenhuma das alternativas"], 1, "Sistema de direção controla orientação.", "Intermediária"], ["Pedal de freio anormal exige:", ["avaliação de segurança", "ignorar o sintoma", "Ambas as alternativas", "Nenhuma das alternativas"], 0, "Falha de freio é risco relevante.", "Intermediária"], ["Bateria faz parte do:", ["sistema de escapamento", "sistema elétrico", "Ambas as alternativas", "Nenhuma das alternativas"], 1, "Bateria fornece energia elétrica.", "Difícil"], ["Vibração anormal na direção pode indicar:", ["necessidade de inspeção", "funcionamento sempre normal", "Ambas as alternativas", "Nenhuma das alternativas"], 0, "Vibração deve ser investigada.", "Difícil"], ["Luz de advertência no painel deve ser:", ["sempre ignorada", "interpretada e verificada", "Ambas as alternativas", "Nenhuma das alternativas"], 1, "Alertas indicam condição que requer atenção.", "Difícil"]], "id": "esp06", "number": "06", "review": []};const KEY='rota-furb-'+DATA.id+'-v1';const all=[...(DATA.review||[]),...DATA.questions];const labels=['A','B','C','D','E'];let s=load();function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.attempts))return o}catch(e){}return {page:0,q:0,answers:Array(all.length).fill(null),confirmed:Array(all.length).fill(false),attempts:[],finished:false}}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function esc(t){return String(t).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function badge(d){return '<span class="difficulty '+esc(d)+'">'+esc(d)+'</span>'}function go(n){s.page=n;save();render();scrollTo(0,0)}function finish(){if(!s.finished){s.attempts.push({date:new Date().toISOString(),answers:[...s.answers],score:DATA.questions.reduce((v,q,i)=>v+(s.answers[i+(DATA.review||[]).length]===q[2]),0),reviewScore:(DATA.review||[]).reduce((v,q,i)=>v+(s.answers[i]===q[2]),0)});s.finished=true;}go(DATA.sections.length+2)}function retry(){s.answers=Array(all.length).fill(null);s.confirmed=Array(all.length).fill(false);s.q=0;s.finished=false;go(DATA.sections.length+1)}function render(){const el=document.getElementById('app');let p=s.page;document.getElementById('meter').style.width=(Math.min(p,DATA.sections.length+2)/(DATA.sections.length+2)*100)+'%';if(p===0){el.innerHTML='<div class="eyebrow">'+esc(DATA.subject)+' · Aula '+esc(DATA.number)+'</div><h1>'+esc(DATA.title)+'</h1><p class="muted">Aula em telas sequenciais, com explicações, exemplos e avaliação interativa.</p><div class="callout"><b>O que você vai estudar:</b> '+DATA.sections.map(x=>esc(x[0])).join(' · ')+'</div><p class="notice">Material autoral para estudo, não oficial da FURB. A dificuldade é estimativa pedagógica.</p><div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="go(1)">Começar aula →</button></div>';}else if(p<=DATA.sections.length){let a=DATA.sections[p-1];el.innerHTML='<div class="eyebrow">Conteúdo '+p+' de '+DATA.sections.length+'</div><h1>'+esc(a[0])+'</h1>'+a[1]+'<div class="actions"><button class="btn secondary" onclick="go('+(p-1)+')">← Voltar</button><button class="btn" onclick="go('+(p+1)+')">'+(p===DATA.sections.length?'Ir para avaliação':'Próxima tela')+' →</button></div>';}else if(p===DATA.sections.length+1){let i=s.q,q=all[i],isReview=i<(DATA.review||[]).length,confirmed=s.confirmed[i];let options=q[1].map((o,j)=>'<button class="option '+(confirmed&&j===q[2]?'correct':confirmed&&j===s.answers[i]?'wrong':!confirmed&&j===s.answers[i]?'selected':'')+'" '+(confirmed?'disabled':'')+' onclick="choose('+j+')"><b>'+labels[j]+')</b> '+esc(o)+(confirmed&&j===q[2]?' ✓':confirmed&&j===s.answers[i]?' ✕':'')+'</button>').join('');el.innerHTML='<div class="qhead"><div><b>Questão '+(i+1)+' de '+all.length+'</b><div class="muted">'+(isReview?'Revisão da aula anterior':'Conteúdo da aula atual')+'</div></div>'+badge(q[4])+'</div><h2>'+esc(q[0])+'</h2>'+options+(confirmed?'<div class="feedback '+(s.answers[i]===q[2]?'':'bad')+'"><b>'+(s.answers[i]===q[2]?'Resposta correta!':'Resposta incorreta.')+'</b>'+esc(q[3])+'</div>':'<p class="muted">Selecione uma alternativa e confirme para conferir a explicação.</p>')+'<div class="actions"><button class="btn secondary" onclick="previous()">← Voltar</button><button class="btn" '+(s.answers[i]===null?'disabled':'')+' onclick="advance()">'+(!confirmed?'Confirmar resposta':i===all.length-1?'Finalizar avaliação':'Próxima questão →')+'</button></div>';}else{const last=s.attempts[s.attempts.length-1],first=s.attempts[0],best=Math.max(...s.attempts.map(a=>a.score),0);const current=last||{score:0,reviewScore:0};let diffs=['Fácil','Intermediária','Difícil'].map(d=>{let ix=DATA.questions.map((q,i)=>[q,i]).filter(x=>x[0][4]===d);let ok=ix.filter(x=>current.answers[x[1]+(DATA.review||[]).length]===x[0][2]).length;return '<div class="stat">'+badge(d)+'<b>'+ok+'/'+ix.length+'</b><small>acertos</small></div>'}).join('');let hist=s.attempts.map((a,i)=>'<details class="history"><summary>'+ (i+1)+'ª tentativa · '+new Date(a.date).toLocaleString('pt-BR')+' · '+a.score+'/10</summary><p>Revisão: '+a.reviewScore+'/'+(DATA.review||[]).length+'</p>'+all.map((q,j)=>'<p><b>'+(j+1)+'. '+esc(q[0])+'</b><br>'+badge(q[4])+' · Sua resposta: '+(a.answers[j]===null?'Sem resposta':labels[a.answers[j]])+' · Correta: '+labels[q[2]]+'<br>'+esc(q[3])+'</p>').join('')+'</details>').join('');el.innerHTML='<div class="eyebrow">Avaliação concluída</div><h1>Seu desempenho</h1><div class="stats"><div class="stat"><small>Primeira nota</small><b>'+first.score+'/10</b></div><div class="stat"><small>Melhor nota</small><b>'+best+'/10</b></div><div class="stat"><small>Última nota</small><b>'+current.score+'/10</b></div></div><h2>Acertos por dificuldade</h2><div class="stats">'+diffs+'</div><p><b>Revisão da aula anterior:</b> '+current.reviewScore+'/'+(DATA.review||[]).length+' (fora da nota principal).</p><h2>Histórico de tentativas</h2>'+hist+'<div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="retry()">Refazer prova (sem apagar histórico)</button></div>';} }function choose(j){if(!s.confirmed[s.q]){s.answers[s.q]=j;save();render()}}function previous(){if(s.q===0){go(DATA.sections.length)}else{s.q--;save();render()}}function advance(){if(s.answers[s.q]===null)return;if(!s.confirmed[s.q]){s.confirmed[s.q]=true;save();render();return}if(s.q===all.length-1){finish()}else{s.q++;save();render()}}render();</script><script id="study-guides-js">(function(){const GUIDE=["Motor, transmissão, suspensão, freios e direção", [["Motor e arrefecimento", "O motor transforma energia do combustível em movimento; o arrefecimento ajuda a manter temperatura adequada.", ["Motor e arrefecimento"], "Superaquecimento exige parada segura e avaliação, sem abrir reservatório quente.", "Observe a regra e confira o exemplo antes de responder."], ["Transmissão", "Transmite o movimento do motor às rodas, conforme o conjunto do veículo.", ["Transmissão"], "Ruídos ou dificuldade de engate merecem inspeção.", "Observe a regra e confira o exemplo antes de responder."], ["Suspensão e direção", "Suspensão ajuda a absorver irregularidades; direção orienta as rodas. Folgas e vibrações comprometem controle.", ["Suspensão e direção"], "Veículo puxando para um lado pode exigir avaliação de pneus, alinhamento ou freios.", "Observe a regra e confira o exemplo antes de responder."], ["Freios e sistema elétrico", "Freios reduzem velocidade; bateria e alternador integram alimentação elétrica. Luzes de advertência exigem atenção.", ["Freios e sistema elétrico"], "Pedal de freio anormal requer verificação antes de continuar.", "Observe a regra e confira o exemplo antes de responder."]]];function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const btn=document.createElement('button');btn.id='study-guide-launch';btn.type='button';btn.textContent='📖 Regras e exemplos';btn.setAttribute('aria-haspopup','dialog');const shade=document.createElement('div');shade.id='study-guide-shade';shade.innerHTML='<div id="study-guide-dialog" role="dialog" aria-modal="true" aria-label="Regras e exemplos"><div class="ghead"><div><h2>Regras e exemplos</h2><div class="gsub">'+e(GUIDE[0])+' · Consulta rápida para revisar a qualquer momento</div></div><button class="gclose" type="button">Fechar ✕</button></div>'+GUIDE[1].map((g,i)=>'<details '+(i===0?'open':'')+'><summary>'+e(g[0])+'</summary><div class="gbody"><p>'+e(g[1])+'</p><b>Termos e regras</b><div class="gterms">'+g[2].map(x=>'<span>'+e(x)+'</span>').join('')+'</div><b>Exemplo</b><div class="gexample">'+e(g[3])+'</div><div class="gtip"><b>Atenção:</b> '+e(g[4])+'</div></div></details>').join('')+'</div>';document.body.append(btn,shade);function close(){shade.classList.remove('open');btn.focus()}btn.addEventListener('click',()=>{shade.classList.add('open');shade.querySelector('.gclose').focus()});shade.querySelector('.gclose').addEventListener('click',close);shade.addEventListener('click',ev=>{if(ev.target===shade)close()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&shade.classList.contains('open'))close()});})();</script></body></html>
