size:18px;color:#3e5960}.passage{background:#f4f8f5;border-left:4px solid #288f7d;border-radius:10px;padding:18px 21px;margin:23px 0;font-size:17px}.worked{background:#fafaf7;border:1px solid #dfe8e1;border-radius:12px;padding:18px 20px;margin:23px 0}.worked p{margin:8px 0}.paper table{width:100%;border-collapse:collapse;margin:22px 0;font-size:14px;line-height:1.5}.paper th{background:#e7f1eb;text-align:left}.paper td,.paper th{padding:12px;border:1px solid #d9e5df;vertical-align:top}.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:30px}.btn{border:0;background:var(--green);color:white;padding:12px 19px;border-radius:11px;font-weight:750}.btn.secondary{background:#e7f0ec;color:#0e5b54}.btn:disabled{opacity:.4;cursor:not-allowed}.qcount{font-size:13px;color:var(--muted);font-weight:700}.qtitle{font-size:19px;font-weight:700;line-height:1.55}.choices{display:grid;gap:10px;margin:22px 0}.choice{width:100%;display:flex;gap:12px;text-align:left;border:1px solid #d5e4dc;border-radius:11px;background:#fff;padding:14px;color:var(--ink);line-height:1.5}.choice.selected{background:#e8f4ee;border:2px solid var(--green);padding:13px}.choice.correct{background:#e6f6e9;border:2px solid var(--good);padding:13px}.choice.wrong{background:#fff0ed;border:2px solid var(--bad);padding:13px}.choice:disabled{cursor:default;opacity:1}.letter{font-weight:800;min-width:22px;color:var(--green)}.feedback{padding:19px;border-radius:13px;background:#f0f8f2;border:1px solid #b8dac4;margin:20px 0}.feedback.bad{background:#fff5f3;border-color:#e7c5c1}.feedback ul{margin:10px 0;padding-left:20px}.feedback li{margin:7px 0}.tag{display:inline-block;font-size:12px;padding:4px 10px;border:1px solid #b5d5c9;border-radius:30px;color:#276e62;margin-right:6px}.score{font-size:55px;font-weight:850;color:var(--green)}.history{border:1px solid var(--line);border-radius:13px;padding:17px;margin:12px 0}.history summary{cursor:pointer;font-weight:700}.small{font-size:13px;color:var(--muted)}.quiznav{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.quiznav button{width:32px;height:32px;border-radius:8px;border:1px solid #bed4cb;background:white;color:var(--ink)}.quiznav button.active{background:var(--green);color:white}.quiznav button.done{border-color:var(--green)}footer{font-size:12px;color:var(--muted);padding:0 22px 30px;max-width:1100px;margin:auto}@media(max-width:760px){.layout{display:block;margin:12px auto}.sidebar{position:static;margin-bottom:12px;padding:12px}.sidebar nav{display:flex;overflow-x:auto}.nav{flex:0 0 auto;width:auto;white-space:nowrap}.sidebar h2,.sidebar p{display:none}.paper{padding:22px}.paper table{font-size:12px}.paper td,.paper th{padding:8px}header{padding:12px 15px}h1{font-size:32px}}

</style></head><body><header><div><b>ROTA DA APROVAÇÃO</b><small>FURB · Motorista · Câmara de São Francisco do Sul</small></div><a href="index.html#portugues">← Painel de estudos</a></header><div class="layout"><aside class="sidebar"><h2>Capítulos desta aula</h2><nav id="nav" aria-label="Capítulos e avaliação"></nav><div class="progress"><div id="bar"></div></div><p>Progresso nesta aula: <span id="pct">0%</span></p><button type="button" class="nav" id="reset">Reiniciar tentativa (sem apagar histórico)</button></aside><main class="paper" id="content" aria-live="polite"></main></div><footer>Conteúdo autoral de Ortografia, alinhado ao tópico previsto no Anexo III do Edital 001/2026. Não é material oficial da FURB. Os dados são salvos neste navegador.</footer><script>
const KEY='rota-furb-pt-aula3-v4',VERSION=3;
const chapters=[{"title": "Ortografia: como reconhecer a grafia correta", "body": "<p class=\"lead\">Ortografia é o conjunto de convenções que determina a escrita das palavras. A pronúncia ajuda, mas não basta: em português, o mesmo som pode ser representado por letras diferentes. Por isso, a escolha entre <b>s/z, g/j e x/ch</b> exige reconhecer famílias de palavras, regras de formação e casos que precisam ser memorizados.</p><h3>Três perguntas antes de escolher uma grafia</h3><p><b>1.</b> A palavra pertence a uma família conhecida? <i>Casa → caseiro</i>; <i>analisar → análise</i>. <b>2.</b> Há um sufixo com grafia regular? <i>Beleza</i> e <i>tristeza</i> terminam em <b>-eza</b>. <b>3.</b> A palavra é um caso de uso consagrado? <i>Jeito</i> se escreve com J; <i>enxergar</i>, com X.</p><div class=\"worked\"><b>Exemplo comentado</b><p>“A <i>pesquiza</i> indicou aumento da <i>seguransa</i>.” Ambas estão incorretas: escrevemos <b>pesquisa</b> e <b>segurança</b>. O som de /z/ em <i>pesquisa</i> não autoriza trocar S por Z, assim como o som de /s/ em <i>segurança</i> não autoriza trocar Ç por S.</p></div><p>Em questões de concurso, não basta reconhecer a palavra visualmente. Leia a frase inteira e observe se a prova está avaliando <b>grafia, significado ou emprego no contexto</b>.</p>"}, {"title": "Emprego de S, Z, SS, Ç e SC", "body": "<p>O som /s/ pode ser escrito de diferentes formas. Não existe uma única regra que resolva todas as palavras, mas há padrões muito úteis.</p><table><tr><th>Padrão</th><th>Exemplos corretos</th><th>Como pensar</th></tr><tr><td><b>-ês / -esa</b> em gentílicos e títulos</td><td>português, francesa, camponesa</td><td>Observe a função do sufixo.</td></tr><tr><td><b>-ez / -eza</b> formando substantivos abstratos</td><td>rapidez, beleza, firmeza</td><td>Qualidade ou estado: rápido → rapidez; belo → beleza.</td></tr><tr><td><b>-oso / -osa</b></td><td>cuidadoso, perigosa</td><td>Adjetivos com esse sufixo usam S.</td></tr><tr><td><b>SS</b> entre vogais em muitas palavras</td><td>passagem, necessário, processo</td><td>SS representa /s/ entre vogais; um S isolado costuma representar /z/.</td></tr><tr><td><b>Ç</b> antes de A, O, U</td><td>segurança, atenção, serviço</td><td>Não se usa Ç antes de E ou I.</td></tr></table><h3>O que não confundir</h3><p><b>Casa</b> tem S com som de /z/; <b>caça</b> tem Ç com som de /s/. <b>Cozer</b> significa cozinhar; <b>coser</b> significa costurar. A troca de letra pode mudar a palavra e o sentido.</p><div class=\"worked\"><b>Aplicação</b><p>“O motorista demonstrou <i>prudênsia</i> na travessia.” O correto é <b>prudência</b>. Já “O atendimento ocorreu com <i>rapides</i>” deve ser <b>rapidez</b>, substantivo formado de <i>rápido</i>.</p></div>"}, {"title": "Emprego de G, J, X e CH", "body": "<p>O som representado por G antes de E/I pode se aproximar do J, mas a escrita depende da palavra. <b>Viagem</b> (substantivo) se escreve com G; <b>viajem</b> (forma do verbo viajar) se escreve com J.</p><div class=\"worked\"><b>Compare</b><p>“A <b>viagem</b> foi tranquila.” Aqui, a palavra nomeia um deslocamento: substantivo com G.</p><p>“Espero que eles <b>viajem</b> amanhã.” Aqui, é verbo: <i>que eles viajem</i>, com J.</p></div><p>Em muitos substantivos terminados em <b>-agem</b>, emprega-se G: <i>garagem, passagem, paisagem, bagagem</i>. Há exceções, como <i>pajem</i>. Palavras derivadas tendem a conservar a família: <i>loja → lojista</i>; <i>laranja → laranjeira</i>.</p><h3>X ou CH?</h3><p>Após ditongo, é comum o X: <i>caixa, peixe, faixa</i>. Depois de <i>en-</i>, há palavras com X, como <i>enxada</i> e <i>enxergar</i>, mas não se deve transformar essa observação em regra absoluta: <i>encher</i> e <i>enchente</i> se escrevem com CH, pois pertencem à família de <i>cheio</i>.</p><table><tr><th>Forma correta</th><th>Erro frequente</th></tr><tr><td>mexer</td><td>mecher</td></tr><tr><td>enxergar</td><td>enchergar</td></tr><tr><td>chegar</td><td>xegar</td></tr><tr><td>jeito</td><td>geito</td></tr></table><p>Quando a grafia não é explicada por um padrão produtivo, o caminho é consultar um dicionário e estudar a palavra em frases completas.</p>"}, {"title": "Os quatro porquês: sentido e posição", "body": "<p class=\"lead\">As quatro formas não são intercambiáveis. Para decidir, analise <b>a função da expressão na oração</b>, e não apenas se há um ponto de interrogação.</p><table><tr><th>Forma</th><th>Quando usar</th><th>Exemplo explicado</th></tr><tr><td><b>por que</b></td><td>Perguntas diretas ou indiretas; pode equivaler a “por qual motivo”. Também ocorre em estruturas equivalentes a “pelo qual”.</td><td>“<b>Por que</b> o ônibus atrasou?” / “Não sei <b>por que</b> atrasou.”</td></tr><tr><td><b>porque</b></td><td>Conjunção que introduz causa ou explicação.</td><td>“O ônibus atrasou <b>porque</b> houve interdição.”</td></tr><tr><td><b>por quê</b></td><td>Forma interrogativa ou equivalente a “por qual motivo” antes de pausa forte, geralmente no fim da oração.</td><td>“O ônibus atrasou, mas ninguém explicou <b>por quê</b>.”</td></tr><tr><td><b>porquê</b></td><td>Substantivo, com sentido de “motivo”; normalmente acompanhado de determinante.</td><td>“O fiscal perguntou <b>o porquê</b> da parada.”</td></tr></table><h3>Uma frase pode exigir duas formas diferentes</h3><div class=\"worked\"><p>“Ninguém explicou <b>por que</b> a viagem foi interrompida, embora todos quisessem conhecer <b>o porquê</b> da decisão.”</p><p>A primeira ocorrência introduz uma <b>pergunta indireta</b>; a segunda é um <b>substantivo</b> precedido de artigo.</p><p>“O condutor parou <b>porque</b> havia risco na pista; os passageiros perguntaram <b>por quê</b>.” A primeira indica <b>causa</b>; a segunda aparece ao final da oração.</p></div><h3>Armadilhas comuns</h3><p>“Não entendi <i>porque</i> ele saiu” está inadequado se o sentido é “não entendi <b>por qual motivo</b> ele saiu”: nesse caso, escreva <b>por que</b>. Já “Ele saiu <b>porque</b> estava cansado” informa a causa.</p><p>O acento de <b>por quê</b> não depende de a frase terminar com interrogação: “Ele saiu sem dizer <b>por quê</b>.” também está correto.</p>"}, {"title": "Mais casos: onde/aonde, mal/mau e há/a", "body": "<p>Questões de ortografia frequentemente misturam grafia com o significado das palavras. São pares que precisam ser estudados em contexto.</p><h3>Onde e aonde</h3><p><b>Onde</b> indica localização ou permanência: “Onde está o veículo?”. <b>Aonde</b> combina a preposição <i>a</i> com <i>onde</i> e costuma aparecer com verbos que exigem destino introduzido por <i>a</i>: “Aonde você pretende ir?”. Para origem, empregue <b>de onde</b>: “De onde veio o documento?”.</p><h3>Mal e mau</h3><p><b>Mal</b> se opõe a <i>bem</i>: “Ele dirigiu mal”. <b>Mau</b> se opõe a <i>bom</i>: “O veículo está em mau estado”. Faça a substituição: se couber <i>bem</i>, geralmente é <i>mal</i>; se couber <i>bom</i>, é <i>mau</i>.</p><h3>Há e a</h3><p><b>Há</b>, do verbo haver, indica tempo decorrido ou existência: “A inspeção ocorreu há dois dias”; “Há vagas disponíveis”. A preposição <b>a</b> pode indicar tempo futuro ou distância: “A prova será daqui a duas semanas”; “O posto fica a três quilômetros”.</p><div class=\"worked\"><b>Questão resolvida</b><p>“O veículo apresentou <i>mal</i> funcionamento <i>a</i> três dias.” As duas escolhas estão erradas: escreva <b>mau funcionamento</b> (oposto de bom funcionamento) e <b>há três dias</b> (tempo decorrido).</p></div>"}, {"title": "Hífen e escrita de palavras compostas", "body": "<p>O hífen é um sinal ortográfico. Seu uso depende da formação da palavra; não se decide apenas pela pronúncia.</p><h3>Prefixos: padrões úteis</h3><p>Em geral, usa-se hífen quando o prefixo termina na <b>mesma vogal</b> com que começa o segundo elemento: <i>micro-ondas, anti-inflamatório</i>. Quando as vogais são diferentes, normalmente não há hífen: <i>autoescola, infraestrutura</i>. Com <b>R</b> ou <b>S</b> após prefixo terminado em vogal, frequentemente não se usa hífen e a consoante é duplicada: <i>antirracismo, ultrassom</i>.</p><p>Alguns prefixos exigem atenção específica. <b>Ex-</b> com sentido de condição anterior usa hífen: <i>ex-diretor</i>. <b>Vice-</b> usa hífen: <i>vice-presidente</i>. <b>Pré-</b>, <b>pós-</b> e <b>pró-</b>, quando tônicos e autônomos, usam hífen: <i>pré-escola, pós-graduação</i>.</p><table><tr><th>Correto</th><th>Por quê?</th></tr><tr><td>autoescola</td><td>Prefixo terminado em O + palavra iniciada por E: vogais diferentes.</td></tr><tr><td>micro-ondas</td><td>O + O: vogais iguais.</td></tr><tr><td>antirracismo</td><td>O R é duplicado após o prefixo terminado em vogal.</td></tr><tr><td>ex-motorista</td><td>Ex- indicando condição anterior.</td></tr></table><p>Há particularidades e exceções em palavras compostas e prefixadas. O estudo deve priorizar as regras recorrentes e verificar casos duvidosos em vocabulário ortográfico atualizado.</p>"}, {"title": "Parônimos e homônimos em contexto", "body": "<p>Palavras parecidas podem ter significados distintos. Em prova, a escolha correta depende da frase.</p><table><tr><th>Par</th><th>Diferença</th></tr><tr><td><b>descrição / discrição</b></td><td>Descrição: ato de descrever; discrição: reserva, prudência.</td></tr><tr><td><b>comprimento / cumprimento</b></td><td>Comprimento: extensão; cumprimento: saudação ou execução de obrigação.</td></tr><tr><td><b>tráfego / tráfico</b></td><td>Tráfego: circulação; tráfico: comércio ilícito.</td></tr><tr><td><b>ratificar / retificar</b></td><td>Ratificar: confirmar; retificar: corrigir.</td></tr><tr><td><b>emergir / imergir</b></td><td>Emergir: vir à superfície; imergir: mergulhar.</td></tr></table><div class=\"worked\"><b>Exemplo</b><p>“O setor precisou <b>retificar</b> o relatório, pois havia um erro na quilometragem.” A palavra indica <b>corrigir</b>. Se o relatório estivesse correto e precisasse de confirmação, o verbo adequado seria <b>ratificar</b>.</p></div><p>O examinador pode apresentar cinco frases com palavras formalmente parecidas e pedir a única inadequada. Para resolver, substitua mentalmente a palavra por sua definição e veja se o sentido permanece coerente.</p>"}, {"title": "Método de análise: erros isolados e múltiplos", "body": "<p>Ao encontrar “assinale a frase incorreta”, faça duas leituras: primeiro compreenda o sentido; depois confira cada palavra suspeita. Uma alternativa pode conter <b>duas formas corretas diferentes</b>, e outra pode conter um único erro sutil.</p><div class=\"worked\"><b>Exemplo resolvido passo a passo</b><p><b>I.</b> “O fiscal explicou <b>por que</b> a via foi interditada e informou <b>o porquê</b> da medida.” Correta: pergunta indireta + substantivo.</p><p><b>II.</b> “O ônibus atrasou <b>porque</b> choveu, mas ninguém sabia <b>por quê</b>.” Correta: causa + expressão ao final.</p><p><b>III.</b> “Não sei <b>porque</b> o relatório foi <b>retificado</b>.” Incorreta: o correto é <b>por que</b>, pois significa “por qual motivo”. A palavra <i>retificado</i> está correta.</p><p><b>IV.</b> “O servidor agiu com <b>discrição</b> e confirmou <b>o cumprimento</b> da ordem.” Correta: reserva + execução de uma determinação.</p></div><p>Observe que o erro da frase III não é descoberto pela aparência das palavras: é necessário identificar a <b>função sintática e o sentido</b>. Esse é o tipo de raciocínio que os exercícios a seguir exigem.</p><p>O objetivo não é decorar a letra do gabarito. É conseguir justificar por que as outras quatro alternativas estão corretas.</p>"}];
const questions=[{"topic": "Porquês", "level": "Intermediário", "passage": "Considere o uso dos porquês em diferentes contextos.", "ask": "Assinale a única frase em que há emprego INCORRETO.", "options": ["O condutor explicou por que diminuiu a velocidade e informou o porquê da decisão.", "O ônibus atrasou porque houve bloqueio na via, mas ninguém soube dizer por quê.", "Não compreendi porque a inspeção foi adiada, embora conheça o motivo do atraso anterior.", "Por que a garagem foi fechada antes do horário previsto?", "Os passageiros perguntaram por que a viagem havia sido cancelada."], "answer": "C", "why": ["Correta: pergunta indireta (“por qual motivo”) e substantivo precedido de artigo.", "Correta: conjunção causal e expressão ao final de oração.", "Incorreta: em “não compreendi por que”, há pergunta indireta; escreva separado.", "Correta: pergunta direta.", "Correta: pergunta indireta."]}, {"topic": "Ortografia S/Z", "level": "Intermediário", "passage": "Observe a grafia das palavras destacadas em cada alternativa.", "ask": "Qual frase apresenta erro ortográfico?", "options": ["A equipe agiu com rapidez e prudência durante o atendimento.", "O relatório descreveu uma passagem perigosa.", "O condutor demonstrou firmeza ao tomar a decisão.", "A manutenção foi feita com seguransa e atenção.", "O processo exigiu análise cuidadosa."], "answer": "D", "why": ["Rapidez (-ez) e prudência estão grafadas corretamente.", "Passagem e perigosa estão corretas.", "Firmeza, formada com -eza, está correta.", "O correto é “segurança”, com Ç.", "Processo e análise estão corretas."]}, {"topic": "G/J", "level": "Intermediário", "passage": "Compare as formas “viagem” e “viajem”.", "ask": "Assinale a alternativa correta quanto ao emprego de G e J.", "options": ["Espero que os servidores viagem amanhã cedo.", "A viajem de retorno foi adiada.", "Os passageiros fizeram uma viajem tranquila.", "O setor autorizou que os motoristas viagem à noite.", "A viagem foi tranquila; espero que todos viajem com segurança."], "answer": "E", "why": ["Após “espero que”, a forma verbal é “viajem”.", "O substantivo é “viagem”, com G.", "O substantivo “viagem” é escrito com G.", "A forma verbal adequada é “viajem”, com J.", "Correta: substantivo “viagem” com G e verbo “viajem” com J."]}, {"topic": "X/CH", "level": "Fácil", "passage": "Algumas palavras com som semelhante têm grafias diferentes.", "ask": "Em qual alternativa todas as palavras estão escritas corretamente?", "options": ["Enxergar, mexer, enchente e faixa.", "Enchergar, mexer, enchente e faixa.", "Enxergar, mecher, enchente e faixa.", "Enxergar, mexer, enxente e faixa.", "Enxergar, mexer, enchente e faicha."], "answer": "A", "why": ["Todas estão corretas; “enchente” pertence à família de “cheio”.", "“Enchergar” está errado; o correto é “enxergar”.", "“Mecher” está errado; o correto é “mexer”.", "“Enxente” está errado; o correto é “enchente”.", "“Faicha” está errado; o correto é “faixa”."]}, {"topic": "Mal/mau; há/a", "level": "Intermediário", "passage": "Um servidor registrou o estado do veículo e o tempo decorrido desde a inspeção.", "ask": "Assinale a redação integralmente correta.", "options": ["O veículo apresentava mal estado de conservação há três dias.", "O veículo estava em mau estado de conservação havia três dias.", "O veículo estava em mau estado de conservação a três dias.", "O veículo estava em mal estado de conservação a três dias.", "O veículo estava em mau estado de conservação à três dias."], "answer": "B", "why": ["“Estado” pede o adjetivo “mau”, oposto de “bom”.", "Correta: “mau estado” e “havia três dias” (tempo decorrido).", "Para tempo decorrido, use “há” ou “havia”, não a preposição “a”.", "“Mal estado” e “a três dias” estão incorretos.", "Não há crase antes de “três dias”; use “há” ou “havia”."]}, {"topic": "Parônimos", "level": "Difícil", "passage": "Considere o significado das palavras parecidas.", "ask": "Em qual alternativa a palavra destacada foi empregada INCORRETAMENTE?", "options": ["O setor precisou retificar a planilha após identificar um erro.", "O motorista manteve discrição ao lidar com informações pessoais.", "O fiscal ratificou a decisão que já havia sido tomada.", "O relatório descreveu o tráfego intenso no acesso à cidade.", "A chefia pediu a descrição da ordem, isto é, sua execução imediata."], "answer": "E", "why": ["Retificar significa corrigir; o uso é adequado.", "Discrição significa reserva; o uso é adequado.", "Ratificar significa confirmar; o uso é adequado.", "Tráfego é circulação de veículos; o uso é adequado.", "“Descrição” é ato de descrever; para execução de ordem, cabe “cumprimento”."]}, {"topic": "Porquês em quatro frases", "level": "Difícil", "passage": "I. Não sei por que o ônibus saiu mais cedo.\nII. A viagem foi cancelada porque a ponte estava interditada.\nIII. Os passageiros desconheciam o porquê do atraso.\nIV. O fiscal não explicou porquê a vistoria foi suspensa.", "ask": "Quais frases estão corretamente escritas quanto aos porquês?", "options": ["Apenas I e II.", "Apenas II e IV.", "Apenas I, II e III.", "Apenas I, III e IV.", "Todas as quatro."], "answer": "C", "why": ["I e II estão corretas, mas III também está: “o porquê” é substantivo.", "IV está incorreta; antes de “a vistoria foi suspensa”, cabe “por que”.", "Correta: I (indireta), II (causa) e III (substantivo); IV deveria ser “por que”.", "IV está errada e II foi omitida.", "IV está errada: “não explicou por que a vistoria foi suspensa”."]}, {"topic": "Hífen", "level": "Intermediário", "passage": "Considere as regras ortográficas de prefixação.", "ask": "Qual alternativa contém apenas formas corretas?", "options": ["Auto-escola, microondas, ex-diretor.", "Autoescola, microondas, ex diretor.", "Auto-escola, micro-ondas, ex diretor.", "Autoescola, micro-ondas, ex-diretor.", "Autoescola, micro-ondas, exdiretor."], "answer": "D", "why": ["Escreve-se “autoescola” e “micro-ondas”.", "“Micro-ondas” e “ex-diretor” exigem hífen.", "“Autoescola” não leva hífen; “ex-diretor” leva.", "Correta: vogais diferentes em autoescola; vogais iguais em micro-ondas; ex- com hífen.", "“Ex-diretor” exige hífen."]}, {"topic": "Onde/aonde", "level": "Intermediário", "passage": "O setor de transporte está atualizando os registros de viagens.", "ask": "Assinale a alternativa em que o uso de onde/aonde está adequado.", "options": ["Onde você pretende ir depois da vistoria?", "Aonde fica estacionado o veículo oficial?", "De aonde veio o documento entregue hoje?", "Aonde está guardada a chave do veículo?", "Aonde o motorista pretende ir após concluir o serviço?"], "answer": "E", "why": ["Com “ir” indicando destino introduzido por A, a forma esperada é “aonde”.", "“Ficar” indica localização: “onde fica”.", "Para origem, use “de onde”.", "“Estar” indica localização: “onde está”.", "Correta: “ir a algum lugar” pede “aonde”."]}, {"topic": "Revisão integrada", "level": "Difícil", "passage": "Leia atentamente cada frase: o erro pode estar no porquê, no significado de uma palavra ou na grafia.", "ask": "Assinale a única alternativa inteiramente correta.", "options": ["O servidor não sabia por que a viagem atrasou, mas registrou o motivo com discrição.", "O servidor não sabia porque a viagem atrasou, mas registrou o motivo com discrição.", "O servidor não sabia por que a viagem atrasou, mas registrou o motivo com descrição.", "O servidor não sabia por quê a viagem atrasou, mas registrou o motivo com discrição.", "O servidor não sabia por que a viagem atrasou, mas registrou o motivo com discreção."], "answer": "A", "why": ["Correta: “por que” introduz pergunta indireta; “discrição” significa reserva.", "“Não sabia por que” exige duas palavras.", "“Descrição” é relato ou ato de descrever; a ideia aqui é reserva: “discrição”.", "Antes de “a viagem atrasou”, não cabe “por quê” com acento.", "“Discreção” está grafada incorretamente; use “discrição”."]}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({version:VERSION,mode:'chapter',chapter:0,q:0,answers:Array(10).fill(null),confirmed:Array(10).fill(false),finished:false,attempts:[],legacyAttempts:[]});
let state=blank();
try{const prev=JSON.parse(localStorage.getItem(KEY)||'null');if(prev&&prev.version===VERSION){state={...blank(),...prev};if(!Array.isArray(state.answers)||state.answers.length!==10)state.answers=Array(10).fill(null);if(!Array.isArray(state.confirmed)||state.confirmed.length!==10)state.confirmed=Array(10).fill(false)}else if(prev){if(!localStorage.getItem(KEY+'-arquivo-anterior'))localStorage.setItem(KEY+'-arquivo-anterior',JSON.stringify(prev));state.legacyAttempts=(Array.isArray(prev.attempts)?prev.attempts:[]).map(a=>({date:a.date,score:a.score,total:a.total}));if(!state.legacyAttempts.length&&prev.finished)state.legacyAttempts.push({date:null,score:null,total:10});}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function setMode(mode){state.mode=mode;save();render();window.scrollTo(0,0)}
function setChapter(i){state.chapter=Math.max(0,Math.min(chapters.length-1,i));setMode('chapter')}
function setQuestion(i){state.q=Math.max(0,Math.min(questions.length-1,i));setMode('quiz')}
function nav(){const arr=[...chapters.map((c,i)=>({label:c.title,mode:'chapter',i})),{label:'Exercícios',mode:'quiz',i:0},{label:'Resultados',mode:'results',i:0}];$('nav').innerHTML=arr.map((n,i)=>`<button type="button" class="nav ${state.mode===n.mode&&(n.mode!=='chapter'||n.i===state.chapter)?'active':''}" data-nav="${i}" ${n.mode==='results'&&!state.finished?'disabled':''}><span class="n">${String(i+1).padStart(2,'0')}</span>${esc(n.label)}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{let n=arr[+b.dataset.nav];if(n.mode==='chapter')setChapter(n.i);else if(n.mode==='quiz')setQuestion(state.q);else if(state.finished)setMode('results')});let pct=state.finished?100:state.mode==='chapter'?Math.round((state.chapter+1)/(chapters.length+2)*80):Math.round(80+state.confirmed.filter(Boolean).length/10*20);$('bar').style.width=pct+'%';$('pct').textContent=pct+'%';}
function actions(back,next,nextLabel){return `<div class="actions"><button type="button" class="btn secondary" id="back">← Voltar</button><button type="button" class="btn" id="next">${nextLabel||'Continuar →'}</button></div>`}
function renderChapter(){let c=chapters[state.chapter];$('content').innerHTML=`<div class="eyebrow">Português · Aula 03 · Capítulo ${state.chapter+1} de ${chapters.length}</div><h1>${esc(c.title)}</h1>${c.body}${actions()}`;$('back').onclick=()=>state.chapter?setChapter(state.chapter-1):location.assign('index.html#portugues');$('next').textContent=state.chapter===chapters.length-1?'Ir aos exercícios →':'Próximo capítulo →';$('next').onclick=()=>state.chapter===chapters.length-1?setQuestion(0):setChapter(state.chapter+1)}
function renderQuiz(){let i=state.q,q=questions[i],chosen=state.answers[i],locked=state.confirmed[i];$('content').innerHTML=`<div class="eyebrow">Avaliação · Ortografia e emprego dos porquês</div><div class="qcount">Questão ${i+1} de ${questions.length} · ${esc(q.level)} · ${esc(q.topic)}</div><div class="quiznav">${questions.map((_,j)=>`<button type="button" data-q="${j}" class="${j===i?'active':''} ${state.confirmed[j]?'done':''}" aria-label="Ir à questão ${j+1}">${j+1}</button>`).join('')}</div><div class="passage">${esc(q.passage)}</div><p class="qtitle">${esc(q.ask)}</p><div class="choices">${q.options.map((o,j)=>{let l='ABCDE'[j];return `<button type="button" data-opt="${l}" class="choice ${locked&&l===q.answer?'correct':locked&&chosen===l?'wrong':chosen===l?'selected':''}" ${locked?'disabled':''}><span class="letter">${l})</span><span>${esc(o)}</span></button>`}).join('')}</div>${locked?`<div class="feedback ${chosen===q.answer?'':'bad'}"><strong>${chosen===q.answer?'Resposta correta.':'Resposta incorreta.'} Gabarito: ${q.answer}.</strong><p><b>Entenda as alternativas:</b></p><ul>${q.why.map((reason,j)=>`<li><b>${'ABCDE'[j]})</b> ${esc(reason)}${chosen==='ABCDE'[j]&&chosen!==q.answer?' <b>← sua escolha</b>':''}</li>`).join('')}</ul></div>`:''}<p class="small">A correção desta aula aparece após confirmar cada resposta. O Simuladão, separadamente, só mostra o gabarito no final.</p><div class="actions"><button class="btn secondary" id="back">← ${i?'Questão anterior':'Voltar ao conteúdo'}</button><button class="btn" id="next" ${chosen===null?'disabled':''}>${locked?(i===9?'Finalizar avaliação':'Próxima questão →'):'Confirmar resposta'}</button></div>`;
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>setQuestion(+b.dataset.q));document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(state.confirmed[i])return;state.answers[i]=b.dataset.opt;save();render()});$('back').onclick=()=>i?setQuestion(i-1):setChapter(chapters.length-1);$('next').onclick=()=>{if(state.answers[i]===null)return;if(!state.confirmed[i]){state.confirmed[i]=true;save();render();return}if(i<questions.length-1){setQuestion(i+1);return}if(state.confirmed.every(Boolean)){state.finished=true;state.attempts.push({date:new Date().toISOString(),score:questions.filter((q,j)=>q.answer===state.answers[j]).length,total:questions.length,answers:[...state.answers]});setMode('results')}else{let next=state.confirmed.findIndex(x=>!x);setQuestion(next)}}}
function renderResults(){if(!state.finished){setQuestion(0);return}let score=questions.filter((q,i)=>q.answer===state.answers[i]).length;$('content').innerHTML=`<div class="eyebrow">Avaliação concluída</div><h1>Resultado da Aula 03</h1><div class="score">${score}/${questions.length}</div><p>Acertos nesta tentativa. A nota não representa previsão de aprovação no concurso.</p><h2>Correção por questão</h2>${questions.map((q,i)=>`<div class="history"><b>Questão ${i+1} — ${state.answers[i]===q.answer?'Acerto':'Erro'}</b><p class="small">Sua resposta: ${state.answers[i]||'não respondida'} · Correta: ${q.answer}</p><p>${esc(q.why['ABCDE'.indexOf(q.answer)])}</p></div>`).join('')}<h2>Histórico de tentativas</h2>${state.attempts.map((a,i)=>`<details class="history"><summary>Tentativa ${i+1} — ${a.score}/${a.total} · ${a.date?new Date(a.date).toLocaleString('pt-BR'):''}</summary>${a.answers.map((v,j)=>`<p>Questão ${j+1}: ${v} · correta ${questions[j].answer} — ${v===questions[j].answer?'acerto':'erro'}</p>`).join('')}</details>`).join('')}${state.legacyAttempts.length?`<div class="history"><b>Histórico da versão anterior</b><p class="small">${state.legacyAttempts.length} tentativa(s) anterior(es) preservada(s). Como as questões foram substituídas, o gabarito antigo não foi aplicado às novas questões.</p>${state.legacyAttempts.map(a=>`<p>${a.score===null?'Avaliação anterior':`${a.score}/${a.total}`} ${a.date?'· '+new Date(a.date).toLocaleString('pt-BR'):''}</p>`).join('')}</div>`:''}<div class="actions"><button class="btn secondary" id="back">Rever conteúdo</button><button class="btn" id="next">Nova tentativa</button></div>`;$('back').onclick=()=>setChapter(0);$('next').onclick=()=>{state.answers=Array(10).fill(null);state.confirmed=Array(10).fill(false);state.q=0;state.finished=false;setQuestion(0)}}
function render(){nav();if(state.mode==='chapter')renderChapter();else if(state.mode==='quiz')renderQuiz();else renderResults()}
$('reset').onclick=()=>{if(confirm('Reiniciar apenas a tentativa em andamento? O histórico de tentativas será mantido.')){state.answers=Array(10).fill(null);state.confirmed=Array(10).fill(false);state.q=0;state.finished=false;setChapter(0)}};
save();render();
</script></body></html>
