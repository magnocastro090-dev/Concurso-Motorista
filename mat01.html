order:2px solid #20864e;background:#e3f6ea}.option.wrong{border:2px solid #d04444;background:#ffe8e8}.option:disabled{cursor:default;opacity:1}.difficulty{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px}.difficulty:before{content:"";width:11px;height:11px;border-radius:50%;background:#248b5d}.difficulty.Intermediária:before{background:#e1a42c}.difficulty.Difícil:before{background:#dc4444}.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.feedback{background:#edf8f0;border:1px solid #a6d5b7;border-radius:12px;padding:14px;margin:14px 0}.feedback.bad{background:#fff0f0;border-color:#e5aaaa}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#eef5f2;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}.stat small{color:#607a78}.history{border:1px solid #dbe7e1;padding:14px;border-radius:12px;margin:10px 0}.history summary{cursor:pointer;font-weight:700}.history p{margin:7px 0}.diagram{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0}.diagram span{background:#e2f2eb;border:2px solid #70b5a5;border-radius:12px;padding:14px;text-align:center;font-weight:700}.diagram b{color:#087f78}.diagram small{font-weight:400}.speed,.signs,.tires{display:flex;justify-content:space-around;gap:12px;flex-wrap:wrap;margin:20px 0}.speed span{background:#f5f5f5;border:5px solid #d02f36;border-radius:50%;width:94px;height:94px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:30px;font-weight:900;line-height:1}.speed small{font-size:9px;text-align:center;line-height:1.2;margin-top:5px}.stop{background:#c92f3b;color:white;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);width:110px;height:110px;display:grid;place-items:center;font-weight:900;border:6px solid white}.limit{border:9px solid #c92f3b;border-radius:50%;width:110px;height:110px;display:grid;place-items:center;font-size:38px;font-weight:900}.traffic{border-radius:15px;background:#252c2f;padding:10px;display:flex;flex-direction:column;gap:7px}.traffic i{width:24px;height:24px;border-radius:50%;background:#dd3a3a}.traffic i:nth-child(2){background:#f2b93c}.traffic i:nth-child(3){background:#32ad64}.tires>div{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}.tire{width:110px;height:50px;border:9px solid #30383b;border-radius:12px;background:linear-gradient(90deg,#666 0 28%,#db8c43 28% 72%,#666 72%)}.tire.edges{background:linear-gradient(90deg,#db8c43 0 28%,#666 28% 72%,#db8c43 72%)}.bar{background:#e3e8e6;border-radius:8px;height:28px;overflow:hidden}.bar span{display:block;height:100%;background:#087f78}.notice{font-size:13px;color:#536f70;border-left:3px solid #087f78;padding-left:12px}@media(max-width:600px){.stats{grid-template-columns:1fr}.card{padding:20px}.speed span{width:75px;height:75px;font-size:22px}}</style><style id="study-guides-css">#study-guide-launch{position:fixed;right:18px;bottom:18px;z-index:900;background:#145b57;color:#fff;border:0;border-radius:99px;padding:13px 18px;box-shadow:0 6px 22px #1238;cursor:pointer;font:600 14px system-ui}#study-guide-shade{position:fixed;inset:0;background:#091d24aa;z-index:999;display:none;align-items:center;justify-content:center;padding:14px}#study-guide-shade.open{display:flex}#study-guide-dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;color:#14343b;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0015;font:15px/1.55 system-ui}#study-guide-dialog h2{margin:0;font-size:24px}#study-guide-dialog .ghead{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:16px}#study-guide-dialog .gclose{border:0;border-radius:10px;background:#eaf0ed;padding:9px 13px;cursor:pointer}#study-guide-dialog details{border:1px solid #dce6e0;border-radius:12px;margin:10px 0;overflow:hidden}#study-guide-dialog summary{padding:14px;cursor:pointer;font-weight:750;background:#f4f8f5}#study-guide-dialog .gbody{padding:14px}#study-guide-dialog .gterms{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}#study-guide-dialog .gterms span{background:#e8f4ee;padding:5px 9px;border-radius:7px;font-size:13px}#study-guide-dialog .gexample{background:#f1f5f7;border-left:4px solid #2c827b;padding:10px 12px;border-radius:6px}#study-guide-dialog .gtip{color:#5c4d23;background:#fff7e2;padding:10px 12px;border-radius:8px;margin-top:9px}#study-guide-dialog .gsub{color:#657b7d;font-size:13px;margin-top:4px}@media(max-width:600px){#study-guide-launch{right:12px;bottom:12px;padding:11px 14px}#study-guide-dialog{padding:15px}}</style><style id="math-teaching-style">.math-frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;margin:0 .14em;font-variant-numeric:tabular-nums;font-size:1.08em}.math-frac .math-top{padding:0 .2em .12em;border-bottom:1.7px solid currentColor;min-width:1.2em;text-align:center}.math-frac .math-bottom{padding:.12em .2em 0;text-align:center}.math-step{background:#f2f7ff;border:1px solid #dbe8fa;border-radius:13px;padding:16px;margin:14px 0;color:#1e293b}.math-step p{margin:10px 0}.math-calc{font:600 1.1rem/1.4 ui-monospace,monospace;white-space:pre;overflow-x:auto}.math-step .math-frac{font-size:1.3em}.math-hint{font-size:.86rem;color:#475569;margin:8px 0}</style><style id="math-worked-css">.worked{font-size:16px;line-height:1.75}.worked h3{font-size:17px;line-height:1.4;margin:20px 0 7px;color:#115b59}.worked p{margin:8px 0 14px}.mathfrac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;min-width:1.25em;margin:0 .13em;font-variant-numeric:tabular-nums}.mathfrac>span:first-child{border-bottom:1.7px solid currentColor;padding:0 .2em .14em}.mathfrac>span:last-child{padding:.14em .2em 0}.selected-explanation{background:#fff7df;padding:12px;border-radius:10px;border-left:4px solid #b58321}.feedback{overflow-wrap:anywhere}.worked .mathfrac{font-size:1.12em}</style></head><body><header><div><strong>ROTA DA APROVAÇÃO</strong><small>Raciocínio Lógico e Matemático · Aula 01</small></div><a href="index.html">← Disciplinas</a></header><main><div class="progress"><span id="meter"></span></div><section class="card" id="app"></section></main><script>const DATA={"subject": "Raciocínio Lógico e Matemático", "title": "Números inteiros, decimais e frações", "sections": [["Comece pelos números", "<p>Números inteiros incluem negativos, zero e positivos. Números racionais podem ser escritos como frações ou decimais exatos/periódicos.</p><div class=\"example\">Temperatura −3 °C; saldo de +R$ 25; metade = 1/2 = 0,5.</div><div class=\"example\"><b>Como estudar este tópico</b><p>Leia a explicação de <b>comece pelos números</b> e identifique qual regra, definição ou relação matemática está sendo utilizada. Em seguida, elabore um exemplo próprio e explique por que ele se enquadra nessa regra. Se o exercício apresentar um caso diferente, compare as condições do enunciado antes de responder.</p></div><div class=\"callout\"><b>Autoverificação:</b> Você consegue justificar a solução sem consultar o gabarito? Se não, retome a explicação e procure um segundo exemplo do mesmo assunto.</div>"], ["Operações e sinais", "<p>Na adição, observe os sinais: −7 + 12 = 5. Na multiplicação, sinais iguais produzem resultado positivo e diferentes, negativo.</p><div class=\"example\">(−4) × 3 = −12; (−4) × (−3) = 12.</div><div class=\"example\"><b>Como estudar este tópico</b><p>Leia a explicação de <b>operações e sinais</b> e identifique qual regra, definição ou relação matemática está sendo utilizada. Em seguida, elabore um exemplo próprio e explique por que ele se enquadra nessa regra. Se o exercício apresentar um caso diferente, compare as condições do enunciado antes de responder.</p></div><div class=\"callout\"><b>Autoverificação:</b> Você consegue justificar a solução sem consultar o gabarito? Se não, retome a explicação e procure um segundo exemplo do mesmo assunto.</div>"], ["Frações na prática", "<p>Para somar frações com denominadores diferentes, use um denominador comum. Para multiplicar, multiplique numeradores e denominadores.</p><div class=\"example\">1/2 + 1/4 = 2/4 + 1/4 = 3/4. Já 2/3 × 3/4 = 6/12 = 1/2.</div><div class=\"example\"><b>Como estudar este tópico</b><p>Leia a explicação de <b>frações na prática</b> e identifique qual regra, definição ou relação matemática está sendo utilizada. Em seguida, elabore um exemplo próprio e explique por que ele se enquadra nessa regra. Se o exercício apresentar um caso diferente, compare as condições do enunciado antes de responder.</p></div><div class=\"callout\"><b>Autoverificação:</b> Você consegue justificar a solução sem consultar o gabarito? Se não, retome a explicação e procure um segundo exemplo do mesmo assunto.</div>"], ["Decimais e problemas", "<p>Alinhe as casas decimais na soma e subtração. Converta unidades quando necessário.</p><div class=\"example\">R$ 12,50 + R$ 7,75 = R$ 20,25. Um percurso de 2,5 km mais 750 m totaliza 3,25 km.</div><div class=\"example\"><b>Como estudar este tópico</b><p>Leia a explicação de <b>decimais e problemas</b> e identifique qual regra, definição ou relação matemática está sendo utilizada. Em seguida, elabore um exemplo próprio e explique por que ele se enquadra nessa regra. Se o exercício apresentar um caso diferente, compare as condições do enunciado antes de responder.</p></div><div class=\"callout\"><b>Autoverificação:</b> Você consegue justificar a solução sem consultar o gabarito? Se não, retome a explicação e procure um segundo exemplo do mesmo assunto.</div>"], ["Frações: veja cada etapa", "<p><b>Numerador</b> é o número de cima; <b>denominador</b> é o número de baixo. Em 3/4, dividimos o todo em quatro partes iguais e consideramos três.</p><div class=\"math-step\"><b>1 · Adição: denominadores diferentes</b><p>1/2 + 1/4</p><p>O denominador comum é 4. Multiplique o numerador e o denominador de 1/2 por 2.</p><p>2/4 + 1/4 = 3/4</p><p><b>Regra:</b> com denominadores iguais, somam-se os numeradores e mantém-se o denominador.</p></div><div class=\"math-step\"><b>2 · Multiplicação</b><p>2/3 × 3/4</p><p>Multiplique os números de cima: 2 × 3 = 6. Multiplique os de baixo: 3 × 4 = 12.</p><p>6/12 = 1/2</p><p><b>Simplificação:</b> divida o numerador e o denominador pelo mesmo número (6).</p></div><div class=\"math-step\"><b>3 · Subtração</b><p>3/4 − 1/2 = 3/4 − 2/4 = 1/4</p><p>Primeiro iguale os denominadores; depois subtraia os numeradores.</p></div><div class=\"math-step\"><b>4 · Divisão</b><p>1/2 ÷ 3/4 = 1/2 × 4/3 = 4/6 = 2/3</p><p>Conserve a primeira fração e multiplique pelo inverso da segunda.</p></div>"], ["Decimais: alinhamento e divisão", "<p>Na adição e subtração, escreva vírgula embaixo de vírgula. Acrescente zeros à direita quando necessário.</p><div class=\"math-step\"><b>Exemplo</b><pre class=\"math-calc\">  12,50\n+  7,75\n-------\n  20,25</pre></div><p>Na multiplicação, multiplique como inteiros e depois conte as casas decimais. Na divisão, podemos multiplicar dividendo e divisor pela mesma potência de 10 para retirar a vírgula do divisor.</p><div class=\"math-step\">1,2 × 0,5 = 0,60 = 0,6<br>3,6 ÷ 0,3 = 36 ÷ 3 = 12</div><div class=\"example\"><b>Como estudar este tópico</b><p>Leia a explicação de <b>decimais: alinhamento e divisão</b> e identifique qual regra, definição ou relação matemática está sendo utilizada. Em seguida, elabore um exemplo próprio e explique por que ele se enquadra nessa regra. Se o exercício apresentar um caso diferente, compare as condições do enunciado antes de responder.</p></div><div class=\"callout\"><b>Autoverificação:</b> Você consegue justificar a solução sem consultar o gabarito? Se não, retome a explicação e procure um segundo exemplo do mesmo assunto.</div>"]], "questions": [["Qual é o resultado de −8 + 13?", ["−21", "−5", "5", "21", "8"], 2, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>−8 é uma dívida de 8 unidades; +13 é um acréscimo de 13.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>Como 13 é maior que 8, calcule 13 − 8 = 5. O resultado é positivo.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não some 8 e 13: os sinais são diferentes.</p></div>", "Fácil"], ["Quanto é 0,5 + 0,25?", ["0,30", "0,75", "0,55", "0,70", "0,25"], 1, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Escreva 0,5 como 0,50: acrescentar zero à direita não muda o valor.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>0,50 + 0,25 = 0,75. Some centésimos com centésimos.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não confunda 0,5 com 0,05.</p></div>", "Fácil"], ["Qual fração equivale a 0,25?", ["1/2", "1/3", "1/4", "2/5", "3/4"], 2, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>0,25 significa vinte e cinco centésimos.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>0,25 = <span class=\"mathfrac\" aria-label=\"25 sobre 100\"><span>25</span><span>100</span></span>. Divida numerador e denominador por 25: <span class=\"mathfrac\" aria-label=\"25 sobre 100\"><span>25</span><span>100</span></span> = <span class=\"mathfrac\" aria-label=\"1 sobre 4\"><span>1</span><span>4</span></span>.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>A fração <span class=\"mathfrac\" aria-label=\"1 sobre 4\"><span>1</span><span>4</span></span> significa uma de quatro partes iguais.</p></div>", "Fácil"], ["Um veículo percorreu 18,5 km pela manhã e 12,75 km à tarde. Qual a distância total?", ["30,25 km", "31,25 km", "31,75 km", "32,25 km", "30,75 km"], 1, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>As duas distâncias devem estar na mesma unidade: quilômetros.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>18,50 + 12,75 = 31,25 km. Some as casas decimais alinhadas.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>18,5 km equivale a 18,50 km.</p></div>", "Intermediária"], ["Quanto é 3/4 − 1/2?", ["1/2", "1/4", "2/4", "3/8", "1/8"], 1, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Não podemos subtrair diretamente quartos e meios, porque são partes de tamanhos diferentes. Usamos quartos para ambas as frações.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p><span class=\"mathfrac\" aria-label=\"1 sobre 2\"><span>1</span><span>2</span></span> = (1×2)/(2×2) = <span class=\"mathfrac\" aria-label=\"2 sobre 4\"><span>2</span><span>4</span></span>. Então <span class=\"mathfrac\" aria-label=\"3 sobre 4\"><span>3</span><span>4</span></span> − <span class=\"mathfrac\" aria-label=\"2 sobre 4\"><span>2</span><span>4</span></span> = (3−2)/4 = <span class=\"mathfrac\" aria-label=\"1 sobre 4\"><span>1</span><span>4</span></span>.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p><span class=\"mathfrac\" aria-label=\"2 sobre 4\"><span>2</span><span>4</span></span> é o valor retirado; <span class=\"mathfrac\" aria-label=\"1 sobre 4\"><span>1</span><span>4</span></span> é o que resta.</p></div>", "Intermediária"], ["Qual o resultado de (−6) × (−4) ÷ 3?", ["−8", "−24", "6", "8", "24"], 3, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Multiplicação e divisão têm a mesma prioridade: faça da esquerda para a direita.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>(−6) × (−4) = +24, porque negativo vezes negativo é positivo. Depois 24 ÷ 3 = 8.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não mantenha o sinal negativo após multiplicar dois números negativos.</p></div>", "Intermediária"], ["De 40 litros de combustível, foram usados 3/8. Quantos litros restaram?", ["15", "20", "25", "30", "35"], 2, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p><span class=\"mathfrac\" aria-label=\"3 sobre 8\"><span>3</span><span>8</span></span> representa três das oito partes iguais do tanque de 40 litros.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>40 ÷ 8 = 5 litros por parte; 3 × 5 = 15 litros usados; 40 − 15 = 25 litros restantes.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>A pergunta é quanto RESTOU, não quanto foi consumido.</p></div>", "Intermediária"], ["Uma peça mede 2,4 m. Foram cortados 3 pedaços de 0,65 m. Quanto sobrou?", ["0,35 m", "0,45 m", "0,55 m", "0,65 m", "0,75 m"], 1, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>São três cortes de 0,65 m cada um.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>3 × 0,65 = 1,95 m retirados. Depois 2,40 − 1,95 = 0,45 m.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não subtraia 0,65 apenas uma vez: foram três pedaços.</p></div>", "Difícil"], ["Uma conta de R$ 120 é dividida: Ana paga 1/3 e Bruno paga 1/4. Quanto falta?", ["R$ 40", "R$ 45", "R$ 50", "R$ 55", "R$ 60"], 2, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Ana paga <span class=\"mathfrac\" aria-label=\"1 sobre 3\"><span>1</span><span>3</span></span> do total e Bruno paga <span class=\"mathfrac\" aria-label=\"1 sobre 4\"><span>1</span><span>4</span></span> do mesmo total.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>Ana: 120 ÷ 3 = R$ 40. Bruno: 120 ÷ 4 = R$ 30. Pagaram R$ 70; falta 120 − 70 = R$ 50.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>O restante não é <span class=\"mathfrac\" aria-label=\"1 sobre 3\"><span>1</span><span>3</span></span> nem <span class=\"mathfrac\" aria-label=\"1 sobre 4\"><span>1</span><span>4</span></span>: é o que sobra depois das duas parcelas.</p></div>", "Difícil"], ["O saldo era −R$ 45. Entraram R$ 120 e saíram R$ 38,50. Qual o saldo final?", ["R$ 36,50", "R$ 37,50", "R$ 38,50", "R$ 46,50", "−R$ 36,50"], 0, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Saldo negativo é dívida; entrada aumenta o saldo; saída diminui.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>−45 + 120 = 75. Depois 75 − 38,50 = 36,50. Saldo final: R$ 36,50.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não esqueça o saldo inicial negativo.</p></div>", "Difícil"]], "id": "mat01", "number": "01", "review": []};const KEY='rota-furb-'+DATA.id+'-v1';const all=[...(DATA.review||[]),...DATA.questions];const labels=['A','B','C','D','E'];let s=load();function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.attempts))return o}catch(e){}return {page:0,q:0,answers:Array(all.length).fill(null),confirmed:Array(all.length).fill(false),attempts:[],finished:false}}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function esc(t){return String(t).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function explanation(q,i,answer){const chosen=answer===undefined?s.answers[i]:answer;const correct=q[2];const wrong=chosen!==correct;const label=chosen===null?'Nenhuma alternativa':labels[chosen]+') '+q[1][chosen];const special=(DATA.id==='mat01'&&i===4&&chosen===2)?'Você escolheu 2/4, que é a fração equivalente a 1/2, ou seja, a quantidade que precisa ser RETIRADA de 3/4. A pergunta pede o que RESTA: 3 quartos menos 2 quartos deixa 1 quarto.':' ';const msg=wrong?'<b>Você marcou '+esc(label)+'.</b> Essa alternativa não corresponde ao resultado pedido. '+special+' Compare o valor escolhido com as etapas do cálculo acima para localizar a diferença. A resposta correta é <b>'+labels[correct]+') '+esc(q[1][correct])+'</b>.':'Você marcou a alternativa correta. Confira o raciocínio abaixo para verificar se chegou ao resultado pelo procedimento adequado.';return q[3].replace('<p class="selected-explanation"></p>','<p class="selected-explanation">'+msg+'</p>')}function badge(d){return '<span class="difficulty '+esc(d)+'">'+esc(d)+'</span>'}function go(n){s.page=n;save();render();scrollTo(0,0)}function finish(){if(!s.finished){s.attempts.push({date:new Date().toISOString(),answers:[...s.answers],score:DATA.questions.reduce((v,q,i)=>v+(s.answers[i+(DATA.review||[]).length]===q[2]),0),reviewScore:(DATA.review||[]).reduce((v,q,i)=>v+(s.answers[i]===q[2]),0)});s.finished=true;}go(DATA.sections.length+2)}function retry(){s.answers=Array(all.length).fill(null);s.confirmed=Array(all.length).fill(false);s.q=0;s.finished=false;go(DATA.sections.length+1)}function render(){const el=document.getElementById('app');let p=s.page;document.getElementById('meter').style.width=(Math.min(p,DATA.sections.length+2)/(DATA.sections.length+2)*100)+'%';if(p===0){el.innerHTML='<div class="eyebrow">'+esc(DATA.subject)+' · Aula '+esc(DATA.number)+'</div><h1>'+esc(DATA.title)+'</h1><p class="muted">Aula em telas sequenciais, com explicações, exemplos e avaliação interativa.</p><div class="callout"><b>O que você vai estudar:</b> '+DATA.sections.map(x=>esc(x[0])).join(' · ')+'</div><p class="notice">Material autoral para estudo, não oficial da FURB. A dificuldade é estimativa pedagógica.</p><div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="go(1)">Começar aula →</button></div>';}else if(p<=DATA.sections.length){let a=DATA.sections[p-1];el.innerHTML='<div class="eyebrow">Conteúdo '+p+' de '+DATA.sections.length+'</div><h1>'+esc(a[0])+'</h1>'+a[1]+'<div class="actions"><button class="btn secondary" onclick="go('+(p-1)+')">← Voltar</button><button class="btn" onclick="go('+(p+1)+')">'+(p===DATA.sections.length?'Ir para avaliação':'Próxima tela')+' →</button></div>';}else if(p===DATA.sections.length+1){let i=s.q,q=all[i],isReview=i<(DATA.review||[]).length,confirmed=s.confirmed[i];let options=q[1].map((o,j)=>'<button class="option '+(confirmed&&j===q[2]?'correct':confirmed&&j===s.answers[i]?'wrong':!confirmed&&j===s.answers[i]?'selected':'')+'" '+(confirmed?'disabled':'')+' onclick="choose('+j+')"><b>'+labels[j]+')</b> '+esc(o)+(confirmed&&j===q[2]?' ✓':confirmed&&j===s.answers[i]?' ✕':'')+'</button>').join('');el.innerHTML='<div class="qhead"><div><b>Questão '+(i+1)+' de '+all.length+'</b><div class="muted">'+(isReview?'Revisão da aula anterior':'Conteúdo da aula atual')+'</div></div>'+badge(q[4])+'</div><h2>'+esc(q[0])+'</h2>'+options+(confirmed?'<div class="feedback '+(s.answers[i]===q[2]?'':'bad')+'"><b>'+(s.answers[i]===q[2]?'Resposta correta!':'Resposta incorreta.')+'</b>'+explanation(q,i)+'</div>':'<p class="muted">Selecione uma alternativa e confirme para conferir a explicação.</p>')+'<div class="actions"><button class="btn secondary" onclick="previous()">← Voltar</button><button class="btn" '+(s.answers[i]===null?'disabled':'')+' onclick="advance()">'+(!confirmed?'Confirmar resposta':i===all.length-1?'Finalizar avaliação':'Próxima questão →')+'</button></div>';}else{const last=s.attempts[s.attempts.length-1],first=s.attempts[0],best=Math.max(...s.attempts.map(a=>a.score),0);const current=last||{score:0,reviewScore:0};let diffs=['Fácil','Intermediária','Difícil'].map(d=>{let ix=DATA.questions.map((q,i)=>[q,i]).filter(x=>x[0][4]===d);let ok=ix.filter(x=>current.answers[x[1]+(DATA.review||[]).length]===x[0][2]).length;return '<div class="stat">'+badge(d)+'<b>'+ok+'/'+ix.length+'</b><small>acertos</small></div>'}).join('');let hist=s.attempts.map((a,i)=>'<details class="history"><summary>'+ (i+1)+'ª tentativa · '+new Date(a.date).toLocaleString('pt-BR')+' · '+a.score+'/10</summary><p>Revisão: '+a.reviewScore+'/'+(DATA.review||[]).length+'</p>'+all.map((q,j)=>'<p><b>'+(j+1)+'. '+esc(q[0])+'</b><br>'+badge(q[4])+' · Sua resposta: '+(a.answers[j]===null?'Sem resposta':labels[a.answers[j]])+' · Correta: '+labels[q[2]]+'<br>'+explanation(q,j,a.answers[j])+'</p>').join('')+'</details>').join('');el.innerHTML='<div class="eyebrow">Avaliação concluída</div><h1>Seu desempenho</h1><div class="stats"><div class="stat"><small>Primeira nota</small><b>'+first.score+'/10</b></div><div class="stat"><small>Melhor nota</small><b>'+best+'/10</b></div><div class="stat"><small>Última nota</small><b>'+current.score+'/10</b></div></div><h2>Acertos por dificuldade</h2><div class="stats">'+diffs+'</div><p><b>Revisão da aula anterior:</b> '+current.reviewScore+'/'+(DATA.review||[]).length+' (fora da nota principal).</p><h2>Histórico de tentativas</h2>'+hist+'<div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="retry()">Refazer prova (sem apagar histórico)</button></div>';} }function choose(j){if(!s.confirmed[s.q]){s.answers[s.q]=j;save();render()}}function previous(){if(s.q===0){go(DATA.sections.length)}else{s.q--;save();render()}}function advance(){if(s.answers[s.q]===null)return;if(!s.confirmed[s.q]){s.confirmed[s.q]=true;save();render();return}if(s.q===all.length-1){finish()}else{s.q++;save();render()}}render();</script><script id="study-guides-js">(function(){const GUIDE=["Números e operações", [["Inteiros", "Incluem números negativos, zero e positivos.", ["… −3, −2, −1, 0, 1, 2 …"], "A temperatura passou de −2 °C para 3 °C: aumentou 5 °C.", "Ao subtrair um negativo, some o oposto: 3 − (−2) = 5."], ["Frações", "Representam partes de um todo ou uma divisão.", ["numerador", "denominador"], "3/4 de 20 = 20 × 3 ÷ 4 = 15.", "Para somar frações com denominadores diferentes, use denominador comum."], ["Decimais", "Representam quantidades com parte fracionária.", ["0,5 = 1/2", "0,25 = 1/4"], "2,5 + 1,75 = 4,25.", "Alinhe as vírgulas ao somar ou subtrair."], ["Ordem das operações", "Parênteses, potências, multiplicações/divisões e adições/subtrações.", ["( )", "potências", "× e ÷", "+ e −"], "2 + 3 × 4 = 14, não 20.", "Multiplicação e divisão têm mesma prioridade e são feitas da esquerda para a direita."], ["Problemas", "Transforme o enunciado em operações.", ["dados", "pergunta", "operação", "verificação"], "Se 4 viagens transportam 12 caixas cada, são 4 × 12 = 48 caixas.", "Verifique se a unidade e o resultado fazem sentido."]]];function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const btn=document.createElement('button');btn.id='study-guide-launch';btn.type='button';btn.textContent='📖 Regras e exemplos';btn.setAttribute('aria-haspopup','dialog');const shade=document.createElement('div');shade.id='study-guide-shade';shade.innerHTML='<div id="study-guide-dialog" role="dialog" aria-modal="true" aria-label="Regras e exemplos"><div class="ghead"><div><h2>Regras e exemplos</h2><div class="gsub">'+e(GUIDE[0])+' · Consulta rápida para revisar a qualquer momento</div></div><button class="gclose" type="button">Fechar ✕</button></div>'+GUIDE[1].map((g,i)=>'<details '+(i===0?'open':'')+'><summary>'+e(g[0])+'</summary><div class="gbody"><p>'+e(g[1])+'</p><b>Termos e regras</b><div class="gterms">'+g[2].map(x=>'<span>'+e(x)+'</span>').join('')+'</div><b>Exemplo</b><div class="gexample">'+e(g[3])+'</div><div class="gtip"><b>Atenção:</b> '+e(g[4])+'</div></div></details>').join('')+'</div>';document.body.append(btn,shade);function close(){shade.classList.remove('open');btn.focus()}btn.addEventListener('click',()=>{shade.classList.add('open');shade.querySelector('.gclose').focus()});shade.querySelector('.gclose').addEventListener('click',close);shade.addEventListener('click',ev=>{if(ev.target===shade)close()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&shade.classList.contains('open'))close()});})();</script><script id="math-fraction-renderer">(function(){const re=/(\d+)\s*\/\s*(\d+)/g;function transform(root){if(!root)return;const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.parentElement||n.parentElement.closest('script,style,textarea,code,pre,.math-frac'))return NodeFilter.FILTER_REJECT;return /\d+\s*\/\s*\d+/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);nodes.forEach(n=>{const s=n.nodeValue;re.lastIndex=0;const frag=document.createDocumentFragment();let last=0,m;while((m=re.exec(s))){if(m.index>last)frag.appendChild(document.createTextNode(s.slice(last,m.index)));const f=document.createElement('span');f.className='math-frac';f.setAttribute('role','math');f.setAttribute('aria-label',m[1]+' sobre '+m[2]);const a=document.createElement('span');a.className='math-top';a.textContent=m[1];const b=document.createElement('span');b.className='math-bottom';b.textContent=m[2];f.append(a,b);frag.appendChild(f);last=re.lastIndex}if(last){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));n.replaceWith(frag)}})}let busy=false;const obs=new MutationObserver(()=>{if(busy)return;busy=true;obs.disconnect();transform(document.body);obs.observe(document.body,{subtree:true,childList:true});busy=false});transform(document.body);obs.observe(document.body,{subtree:true,childList:true})})();</script></body></html>
