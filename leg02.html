00}.traffic{border-radius:15px;background:#252c2f;padding:10px;display:flex;flex-direction:column;gap:7px}.traffic i{width:24px;height:24px;border-radius:50%;background:#dd3a3a}.traffic i:nth-child(2){background:#f2b93c}.traffic i:nth-child(3){background:#32ad64}.tires>div{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}.tire{width:110px;height:50px;border:9px solid #30383b;border-radius:12px;background:linear-gradient(90deg,#666 0 28%,#db8c43 28% 72%,#666 72%)}.tire.edges{background:linear-gradient(90deg,#db8c43 0 28%,#666 28% 72%,#db8c43 72%)}.bar{background:#e3e8e6;border-radius:8px;height:28px;overflow:hidden}.bar span{display:block;height:100%;background:#087f78}.notice{font-size:13px;color:#536f70;border-left:3px solid #087f78;padding-left:12px}@media(max-width:600px){.stats{grid-template-columns:1fr}.card{padding:20px}.speed span{width:75px;height:75px;font-size:22px}}</style><style id="study-guides-css">#study-guide-launch{position:fixed;right:18px;bottom:18px;z-index:900;background:#145b57;color:#fff;border:0;border-radius:99px;padding:13px 18px;box-shadow:0 6px 22px #1238;cursor:pointer;font:600 14px system-ui}#study-guide-shade{position:fixed;inset:0;background:#091d24aa;z-index:999;display:none;align-items:center;justify-content:center;padding:14px}#study-guide-shade.open{display:flex}#study-guide-dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;color:#14343b;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0015;font:15px/1.55 system-ui}#study-guide-dialog h2{margin:0;font-size:24px}#study-guide-dialog .ghead{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:16px}#study-guide-dialog .gclose{border:0;border-radius:10px;background:#eaf0ed;padding:9px 13px;cursor:pointer}#study-guide-dialog details{border:1px solid #dce6e0;border-radius:12px;margin:10px 0;overflow:hidden}#study-guide-dialog summary{padding:14px;cursor:pointer;font-weight:750;background:#f4f8f5}#study-guide-dialog .gbody{padding:14px}#study-guide-dialog .gterms{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}#study-guide-dialog .gterms span{background:#e8f4ee;padding:5px 9px;border-radius:7px;font-size:13px}#study-guide-dialog .gexample{background:#f1f5f7;border-left:4px solid #2c827b;padding:10px 12px;border-radius:6px}#study-guide-dialog .gtip{color:#5c4d23;background:#fff7e2;padding:10px 12px;border-radius:8px;margin-top:9px}#study-guide-dialog .gsub{color:#657b7d;font-size:13px;margin-top:4px}@media(max-width:600px){#study-guide-launch{right:12px;bottom:12px;padding:11px 14px}#study-guide-dialog{padding:15px}}</style></head><body><header><div><strong>ROTA DA APROVAÇÃO</strong><small>Legislação Municipal · Aula 02</small></div><a href="index.html">← Disciplinas</a></header><main><div class="progress"><span id="meter"></span></div><section class="card" id="app"></section></main><script>const DATA={"subject": "Legislação Municipal", "title": "Estatuto dos servidores e Regimento da Câmara", "sections": [["Duas normas, finalidades diferentes", "<div class=\"diagram horizontal\"><span>LC 8/2003<br><small>Estatuto dos servidores<\/small><\/span><span>Resolução 05/1992<br><small>Regimento Interno<\/small><\/span><\/div><p>O edital cobra a Lei Complementar nº 8/2003, com alterações, e o Regimento Interno da Câmara (Resolução nº 05/1992), com alterações.<\/p>"], ["Ingresso e cargo público", "<p>Em regra, a investidura em cargo público depende de aprovação prévia em concurso público, ressalvadas as exceções constitucionais (art. 37, II, CF). Cargo, emprego e função não são sinônimos.<\/p>"], ["Direitos, deveres e responsabilidades", "<p>O Estatuto trata de ingresso, direitos, vantagens, deveres, proibições e responsabilidades. Atenção: para identificar direitos, licenças, prazos e sanções específicos, será necessária a redação atualizada da LC 8/2003.<\/p><div class=\"example\">Exemplo de estudo: separar o que é <b>direito<\/b>, o que é <b>dever<\/b> e o que é <b>conduta proibida<\/b>, conferindo cada item na lei.<\/div>"], ["Organização da Câmara", "<p>O Regimento Interno disciplina o funcionamento da Câmara, incluindo suas estruturas e procedimentos. Os nomes dos órgãos internos, competências, sessões e regras de votação devem ser estudados na versão atualizada do Regimento.<\/p><div class=\"callout\">Esta é uma aula introdutória de conceitos e identificação de fontes. Não atribui prazos, sanções ou quóruns específicos sem conferência da norma municipal vigente.<\/div>"]], "questions": [["Qual norma indicada no edital trata do Estatuto dos Servidores Municipais?", ["LC nº 8/2003", "Resolução nº 05/1992", "CTB", "Código Comercial", "Lei de outro município"], 0, "O edital identifica expressamente a LC 8/2003 e suas alterações.", "Fácil"], ["Qual norma indicada no edital corresponde ao Regimento Interno da Câmara?", ["LC nº 8/2003", "Resolução nº 05/1992", "Código de Trânsito", "Lei Orgânica estadual", "CLT apenas"], 1, "O Regimento Interno citado é a Resolução 05/1992 e alterações.", "Fácil"], ["Em regra, a investidura em cargo público exige:", ["Indicação de amigo", "Aprovação em concurso público", "Compra de título", "Apenas entrevista informal", "Escolha por sorteio"], 1, "Constituição Federal, art. 37, II, ressalvadas as exceções.", "Fácil"], ["Para consultar direitos e deveres estatutários específicos, deve-se priorizar:", ["Manual de mecânica", "LC 8/2003 atualizada", "CTB", "Receita culinária", "Regimento de outro estado"], 1, "O Estatuto é a fonte própria para esse tema.", "Intermediária"], ["Para saber como a Câmara organiza suas sessões, a fonte principal indicada no edital é:", ["Regimento Interno atualizado", "Manual de pneus", "Código Penal exclusivamente", "Estatuto de empresa privada", "Tabela de combustível"], 0, "O Regimento trata do funcionamento da Câmara.", "Intermediária"], ["A expressão “e suas alterações”, no edital, indica que o candidato deve:", ["Ler somente a versão original", "Ignorar mudanças posteriores", "Considerar as modificações normativas vigentes", "Estudar normas revogadas apenas", "Escolher qualquer versão"], 2, "As alterações posteriores podem modificar o texto aplicável.", "Intermediária"], ["Uma regra sobre penalidade disciplinar de servidor municipal deve ser verificada prioritariamente:", ["No Estatuto dos servidores vigente", "Em um mapa de trânsito", "Em notícia sem fonte", "No regimento de escola", "Em lei de trânsito estrangeira"], 0, "O Estatuto disciplina responsabilidades e penalidades do regime aplicável.", "Intermediária"], ["Qual afirmação é mais segura sobre o Regimento Interno?", ["Substitui a Constituição", "Disciplina a organização e os procedimentos internos da Câmara dentro da lei", "Define o CTB", "Regula qualquer município brasileiro", "Dispensa atualizações"], 1, "O Regimento disciplina a organização e funcionamento interno, subordinado às normas superiores.", "Difícil"], ["Ao encontrar duas versões diferentes de um artigo da LC 8/2003, o procedimento correto é:", ["Escolher a mais curta", "Usar a mais antiga sem verificar", "Conferir texto consolidado e alterações oficiais", "Ignorar o artigo", "Copiar resumo informal"], 2, "A redação vigente deve ser confirmada nas fontes oficiais.", "Difícil"], ["Sobre o ingresso no serviço público, qual alternativa é juridicamente mais adequada?", ["Concurso é sempre dispensável", "Concurso é a regra para cargo ou emprego público, ressalvadas exceções constitucionais", "Só há concurso para motorista", "Nomeação política vale para qualquer cargo efetivo", "Entrevista substitui automaticamente o concurso"], 1, "Art. 37, II, CF, prevê concurso como regra e exceções constitucionais.", "Difícil"]], "id": "leg02", "number": "02", "review": [["Qual órgão exerce o Legislativo municipal?", ["Prefeitura", "Câmara Municipal", "Tribunal de Justiça", "Secretaria de Estado", "Senado"], 1, "O Legislativo municipal é exercido pela Câmara.", "Fácil"], ["O Município pode legislar sobre assuntos de interesse local?", ["Não", "Somente com autorização judicial", "Sim, conforme Constituição", "Somente sobre direito penal", "Somente sobre direito internacional"], 2, "Constituição, art. 30, I.", "Intermediária"]]};const KEY='rota-furb-'+DATA.id+'-v1';const all=[...(DATA.review||[]),...DATA.questions];const labels=['A','B','C','D','E'];let s=load();function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.attempts))return o}catch(e){}return {page:0,q:0,answers:Array(all.length).fill(null),confirmed:Array(all.length).fill(false),attempts:[],finished:false}}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function esc(t){return String(t).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function badge(d){return '<span class="difficulty '+esc(d)+'">'+esc(d)+'</span>'}function go(n){s.page=n;save();render();scrollTo(0,0)}function finish(){if(!s.finished){s.attempts.push({date:new Date().toISOString(),answers:[...s.answers],score:DATA.questions.reduce((v,q,i)=>v+(s.answers[i+(DATA.review||[]).length]===q[2]),0),reviewScore:(DATA.review||[]).reduce((v,q,i)=>v+(s.answers[i]===q[2]),0)});s.finished=true;}go(DATA.sections.length+2)}function retry(){s.answers=Array(all.length).fill(null);s.confirmed=Array(all.length).fill(false);s.q=0;s.finished=false;go(DATA.sections.length+1)}function render(){const el=document.getElementById('app');let p=s.page;document.getElementById('meter').style.width=(Math.min(p,DATA.sections.length+2)/(DATA.sections.length+2)*100)+'%';if(p===0){el.innerHTML='<div class="eyebrow">'+esc(DATA.subject)+' · Aula '+esc(DATA.number)+'</div><h1>'+esc(DATA.title)+'</h1><p class="muted">Aula em telas sequenciais, com explicações, exemplos e avaliação interativa.</p><div class="callout"><b>O que você vai estudar:</b> '+DATA.sections.map(x=>esc(x[0])).join(' · ')+'</div><p class="notice">Material autoral para estudo, não oficial da FURB. A dificuldade é estimativa pedagógica.</p><div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="go(1)">Começar aula →</button></div>';}else if(p<=DATA.sections.length){let a=DATA.sections[p-1];el.innerHTML='<div class="eyebrow">Conteúdo '+p+' de '+DATA.sections.length+'</div><h1>'+esc(a[0])+'</h1>'+a[1]+'<div class="actions"><button class="btn secondary" onclick="go('+(p-1)+')">← Voltar</button><button class="btn" onclick="go('+(p+1)+')">'+(p===DATA.sections.length?'Ir para avaliação':'Próxima tela')+' →</button></div>';}else if(p===DATA.sections.length+1){let i=s.q,q=all[i],isReview=i<(DATA.review||[]).length,confirmed=s.confirmed[i];let options=q[1].map((o,j)=>'<button class="option '+(confirmed&&j===q[2]?'correct':confirmed&&j===s.answers[i]?'wrong':!confirmed&&j===s.answers[i]?'selected':'')+'" '+(confirmed?'disabled':'')+' onclick="choose('+j+')"><b>'+labels[j]+')</b> '+esc(o)+(confirmed&&j===q[2]?' ✓':confirmed&&j===s.answers[i]?' ✕':'')+'</button>').join('');el.innerHTML='<div class="qhead"><div><b>Questão '+(i+1)+' de '+all.length+'</b><div class="muted">'+(isReview?'Revisão da aula anterior':'Conteúdo da aula atual')+'</div></div>'+badge(q[4])+'</div><h2>'+esc(q[0])+'</h2>'+options+(confirmed?'<div class="feedback '+(s.answers[i]===q[2]?'':'bad')+'"><b>'+(s.answers[i]===q[2]?'Resposta correta!':'Resposta incorreta.')+'</b>'+esc(q[3])+'</div>':'<p class="muted">Selecione uma alternativa e confirme para conferir a explicação.</p>')+'<div class="actions"><button class="btn secondary" onclick="previous()">← Voltar</button><button class="btn" '+(s.answers[i]===null?'disabled':'')+' onclick="advance()">'+(!confirmed?'Confirmar resposta':i===all.length-1?'Finalizar avaliação':'Próxima questão →')+'</button></div>';}else{const last=s.attempts[s.attempts.length-1],first=s.attempts[0],best=Math.max(...s.attempts.map(a=>a.score),0);const current=last||{score:0,reviewScore:0};let diffs=['Fácil','Intermediária','Difícil'].map(d=>{let ix=DATA.questions.map((q,i)=>[q,i]).filter(x=>x[0][4]===d);let ok=ix.filter(x=>current.answers[x[1]+(DATA.review||[]).length]===x[0][2]).length;return '<div class="stat">'+badge(d)+'<b>'+ok+'/'+ix.length+'</b><small>acertos</small></div>'}).join('');let hist=s.attempts.map((a,i)=>'<details class="history"><summary>'+ (i+1)+'ª tentativa · '+new Date(a.date).toLocaleString('pt-BR')+' · '+a.score+'/10</summary><p>Revisão: '+a.reviewScore+'/'+(DATA.review||[]).length+'</p>'+all.map((q,j)=>'<p><b>'+(j+1)+'. '+esc(q[0])+'</b><br>'+badge(q[4])+' · Sua resposta: '+(a.answers[j]===null?'Sem resposta':labels[a.answers[j]])+' · Correta: '+labels[q[2]]+'<br>'+esc(q[3])+'</p>').join('')+'</details>').join('');el.innerHTML='<div class="eyebrow">Avaliação concluída</div><h1>Seu desempenho</h1><div class="stats"><div class="stat"><small>Primeira nota</small><b>'+first.score+'/10</b></div><div class="stat"><small>Melhor nota</small><b>'+best+'/10</b></div><div class="stat"><small>Última nota</small><b>'+current.score+'/10</b></div></div><h2>Acertos por dificuldade</h2><div class="stats">'+diffs+'</div><p><b>Revisão da aula anterior:</b> '+current.reviewScore+'/'+(DATA.review||[]).length+' (fora da nota principal).</p><h2>Histórico de tentativas</h2>'+hist+'<div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="retry()">Refazer prova (sem apagar histórico)</button></div>';} }function choose(j){if(!s.confirmed[s.q]){s.answers[s.q]=j;save();render()}}function previous(){if(s.q===0){go(DATA.sections.length)}else{s.q--;save();render()}}function advance(){if(s.answers[s.q]===null)return;if(!s.confirmed[s.q]){s.confirmed[s.q]=true;save();render();return}if(s.q===all.length-1){finish()}else{s.q++;save();render()}}render();</script><script id="study-guides-js">(function(){const GUIDE=["Servidores e Câmara", [["Estatuto dos servidores", "Reúne normas sobre a relação funcional dos servidores municipais.", ["direitos", "deveres", "responsabilidades"], "Uma questão pode pedir a distinção entre dever funcional e direito do servidor.", "Os artigos e prazos devem ser estudados na LC municipal 8/2003 atualizada."], ["Deveres funcionais", "São condutas exigidas no exercício do cargo.", ["assiduidade", "zelo", "cumprimento de normas"], "Conservar equipamentos públicos é exemplo de conduta de zelo.", "Confira a lista literal de deveres no estatuto vigente."], ["Responsabilidade", "Condutas irregulares podem ter consequências previstas em lei.", ["infração", "procedimento", "defesa"], "Uma apuração funcional deve observar o procedimento legal aplicável.", "Não presuma penalidades ou prazos sem consultar a lei."], ["Regimento Interno", "Organiza o funcionamento e os procedimentos internos da Câmara.", ["sessões", "Mesa", "comissões", "tramitação"], "Uma proposição pode passar por etapas regimentais antes de votação.", "Use a Resolução municipal 05/1992 e alterações para regras específicas."], ["Hierarquia e fonte", "Diferencie Lei Orgânica, estatuto e regimento.", ["organização municipal", "regime funcional", "funcionamento da Câmara"], "Questão sobre servidor: consulte estatuto; sobre sessão: consulte regimento.", "Sempre confira a versão vigente e o artigo indicado."]]];function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const btn=document.createElement('button');btn.id='study-guide-launch';btn.type='button';btn.textContent='📖 Regras e exemplos';btn.setAttribute('aria-haspopup','dialog');const shade=document.createElement('div');shade.id='study-guide-shade';shade.innerHTML='<div id="study-guide-dialog" role="dialog" aria-modal="true" aria-label="Regras e exemplos"><div class="ghead"><div><h2>Regras e exemplos</h2><div class="gsub">'+e(GUIDE[0])+' · Consulta rápida para revisar a qualquer momento</div></div><button class="gclose" type="button">Fechar ✕</button></div>'+GUIDE[1].map((g,i)=>'<details '+(i===0?'open':'')+'><summary>'+e(g[0])+'</summary><div class="gbody"><p>'+e(g[1])+'</p><b>Termos e regras</b><div class="gterms">'+g[2].map(x=>'<span>'+e(x)+'</span>').join('')+'</div><b>Exemplo</b><div class="gexample">'+e(g[3])+'</div><div class="gtip"><b>Atenção:</b> '+e(g[4])+'</div></div></details>').join('')+'</div>';document.body.append(btn,shade);function close(){shade.classList.remove('open');btn.focus()}btn.addEventListener('click',()=>{shade.classList.add('open');shade.querySelector('.gclose').focus()});shade.querySelector('.gclose').addEventListener('click',close);shade.addEventListener('click',ev=>{if(ev.target===shade)close()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&shade.classList.contains('open'))close()});})();</script></body></html>
