id #20864e;background:#e3f6ea}.option.wrong{border:2px solid #d04444;background:#ffe8e8}.option:disabled{cursor:default;opacity:1}.difficulty{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px}.difficulty:before{content:"";width:11px;height:11px;border-radius:50%;background:#248b5d}.difficulty.Intermediária:before{background:#e1a42c}.difficulty.Difícil:before{background:#dc4444}.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.feedback{background:#edf8f0;border:1px solid #a6d5b7;border-radius:12px;padding:14px;margin:14px 0}.feedback.bad{background:#fff0f0;border-color:#e5aaaa}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#eef5f2;border-radius:12px;padding:12px}.stat b{display:block;font-size:22px}.stat small{color:#607a78}.history{border:1px solid #dbe7e1;padding:14px;border-radius:12px;margin:10px 0}.history summary{cursor:pointer;font-weight:700}.history p{margin:7px 0}.diagram{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0}.diagram span{background:#e2f2eb;border:2px solid #70b5a5;border-radius:12px;padding:14px;text-align:center;font-weight:700}.diagram b{color:#087f78}.diagram small{font-weight:400}.speed,.signs,.tires{display:flex;justify-content:space-around;gap:12px;flex-wrap:wrap;margin:20px 0}.speed span{background:#f5f5f5;border:5px solid #d02f36;border-radius:50%;width:94px;height:94px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:30px;font-weight:900;line-height:1}.speed small{font-size:9px;text-align:center;line-height:1.2;margin-top:5px}.stop{background:#c92f3b;color:white;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);width:110px;height:110px;display:grid;place-items:center;font-weight:900;border:6px solid white}.limit{border:9px solid #c92f3b;border-radius:50%;width:110px;height:110px;display:grid;place-items:center;font-size:38px;font-weight:900}.traffic{border-radius:15px;background:#252c2f;padding:10px;display:flex;flex-direction:column;gap:7px}.traffic i{width:24px;height:24px;border-radius:50%;background:#dd3a3a}.traffic i:nth-child(2){background:#f2b93c}.traffic i:nth-child(3){background:#32ad64}.tires>div{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}.tire{width:110px;height:50px;border:9px solid #30383b;border-radius:12px;background:linear-gradient(90deg,#666 0 28%,#db8c43 28% 72%,#666 72%)}.tire.edges{background:linear-gradient(90deg,#db8c43 0 28%,#666 28% 72%,#db8c43 72%)}.bar{background:#e3e8e6;border-radius:8px;height:28px;overflow:hidden}.bar span{display:block;height:100%;background:#087f78}.notice{font-size:13px;color:#536f70;border-left:3px solid #087f78;padding-left:12px}@media(max-width:600px){.stats{grid-template-columns:1fr}.card{padding:20px}.speed span{width:75px;height:75px;font-size:22px}}</style><style id="study-guides-css">#study-guide-launch{position:fixed;right:18px;bottom:18px;z-index:900;background:#145b57;color:#fff;border:0;border-radius:99px;padding:13px 18px;box-shadow:0 6px 22px #1238;cursor:pointer;font:600 14px system-ui}#study-guide-shade{position:fixed;inset:0;background:#091d24aa;z-index:999;display:none;align-items:center;justify-content:center;padding:14px}#study-guide-shade.open{display:flex}#study-guide-dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;color:#14343b;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0015;font:15px/1.55 system-ui}#study-guide-dialog h2{margin:0;font-size:24px}#study-guide-dialog .ghead{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:16px}#study-guide-dialog .gclose{border:0;border-radius:10px;background:#eaf0ed;padding:9px 13px;cursor:pointer}#study-guide-dialog details{border:1px solid #dce6e0;border-radius:12px;margin:10px 0;overflow:hidden}#study-guide-dialog summary{padding:14px;cursor:pointer;font-weight:750;background:#f4f8f5}#study-guide-dialog .gbody{padding:14px}#study-guide-dialog .gterms{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}#study-guide-dialog .gterms span{background:#e8f4ee;padding:5px 9px;border-radius:7px;font-size:13px}#study-guide-dialog .gexample{background:#f1f5f7;border-left:4px solid #2c827b;padding:10px 12px;border-radius:6px}#study-guide-dialog .gtip{color:#5c4d23;background:#fff7e2;padding:10px 12px;border-radius:8px;margin-top:9px}#study-guide-dialog .gsub{color:#657b7d;font-size:13px;margin-top:4px}@media(max-width:600px){#study-guide-launch{right:12px;bottom:12px;padding:11px 14px}#study-guide-dialog{padding:15px}}</style><style id="official-material-css">.official-section{max-width:960px;margin:18px auto 70px;padding:0 16px}.official-panel{background:#fff;border:1px solid #dbe7e1;border-radius:18px;padding:22px;box-shadow:0 6px 22px #123410}.official-panel h2{margin:0 0 6px}.official-item{margin:15px 0;border:1px solid #dbe7e1;border-radius:12px;padding:15px}.official-quote{white-space:pre-wrap;background:#f2f7f5;border-left:4px solid #147e74;padding:13px;margin:10px 0}.official-meta{font-size:13px;color:#546e70}.official-warning{background:#fff4d9;padding:12px;border-radius:9px;font-size:14px}.official-panel a{font-weight:700}.official-panel summary{cursor:pointer;font-weight:700}</style><style id="math-worked-css">.worked{font-size:16px;line-height:1.75}.worked h3{font-size:17px;line-height:1.4;margin:20px 0 7px;color:#115b59}.worked p{margin:8px 0 14px}.mathfrac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;min-width:1.25em;margin:0 .13em;font-variant-numeric:tabular-nums}.mathfrac>span:first-child{border-bottom:1.7px solid currentColor;padding:0 .2em .14em}.mathfrac>span:last-child{padding:.14em .2em 0}.selected-explanation{background:#fff7df;padding:12px;border-radius:10px;border-left:4px solid #b58321}.feedback{overflow-wrap:anywhere}.worked .mathfrac{font-size:1.12em}</style></head><body><header><div><strong>ROTA DA APROVAÇÃO</strong><small>Conhecimentos Específicos · Aula 02</small></div><a href="index.html">← Disciplinas</a></header><main><div class="progress"><span id="meter"></span></div><section class="card" id="app"></section></main><script>const DATA={"subject":"Raciocínio Lógico e Matemático","title":"Proposições, relações e inferências","sections":[["Proposição","<p>É uma frase declarativa que pode ser julgada verdadeira ou falsa. Perguntas e ordens não são proposições.</p><div class=\"callout\"><b>Exemplo explicado:</b> “Todo ônibus é veículo” é proposição.</div>"],["Negação","<p>Negar “todos” significa afirmar que existe ao menos uma exceção.</p><div class=\"callout\"><b>Exemplo explicado:</b> Negação de “Todos chegaram” = “Pelo menos um não chegou”.</div>"],["Conjunção e disjunção","<p>“E” exige ambas as afirmações verdadeiras; “ou” inclusivo exige ao menos uma verdadeira.</p><div class=\"callout\"><b>Exemplo explicado:</b> “Tem CNH e está habilitado” exige as duas condições.</div>"],["Inferência","<p>Uma conclusão válida deve decorrer das premissas, sem acrescentar informação.</p><div class=\"callout\"><b>Exemplo explicado:</b> Todos os veículos A têm inspeção; este é A; logo, tem inspeção.</div>"]],"questions":[["Qual é uma proposição?",["O veículo está estacionado.","Estacione o veículo!","Sempre verdadeira","Sempre falsa"],0,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Proposição é uma frase declarativa à qual se pode atribuir verdadeiro ou falso.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>“O veículo está estacionado” pode ser verdadeiro ou falso, conforme a situação.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Ordens não são classificadas como proposições nesse sentido.</p></div>","Fácil"],["Qual frase não é proposição?",["O carro é azul.","Que horas são?","Sempre verdadeira","Sempre falsa"],1,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Perguntas solicitam informações e não recebem valor lógico verdadeiro ou falso.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>“Que horas são?” é pergunta; “O carro é azul” é declaração verificável.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não confunda frase gramatical com proposição lógica.</p></div>","Fácil"],["Negação de “Todos passaram” é:",["Pelo menos um não passou.","Ninguém passou.","Sempre verdadeira","Sempre falsa"],0,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Negar “todos” não significa afirmar que ninguém passou.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>Basta existir uma exceção: “Pelo menos um não passou”.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>“Ninguém passou” é mais forte do que a negação necessária.</p></div>","Fácil"],["“A e B” é verdadeira quando:",["apenas A é verdadeira","A e B são verdadeiras","Sempre verdadeira","Sempre falsa"],1,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>A expressão A E B exige que as duas proposições sejam verdadeiras.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>V e V = V; V e F = F; F e V = F; F e F = F.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Uma só proposição verdadeira não basta.</p></div>","Intermediária"],["“A ou B” inclusivo é verdadeira quando:",["ao menos uma é verdadeira","ambas são falsas","Sempre verdadeira","Sempre falsa"],0,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>No OU inclusivo, basta que pelo menos uma das proposições seja verdadeira.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>V ou F = V; F ou V = V; V ou V = V; F ou F = F.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>OU inclusivo permite que ambas sejam verdadeiras.</p></div>","Intermediária"],["Todos os caminhões são veículos. X é caminhão. Então:",["X não é veículo.","X é veículo.","Sempre verdadeira","Sempre falsa"],1,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Premissa 1: todos os caminhões são veículos. Premissa 2: X é caminhão.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>Se X pertence ao grupo dos caminhões e todo caminhão é veículo, então X é veículo.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não acrescente exceções que não constam das premissas.</p></div>","Intermediária"],["Negação de “Existe um atraso” é:",["Não existe atraso algum.","Todos os atrasos são longos.","Sempre verdadeira","Sempre falsa"],0,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Negar que existe ao menos um atraso significa afirmar ausência total de atrasos.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>“Existe um atraso” → negação: “Não existe atraso algum”.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não se pode concluir algo sobre a duração dos atrasos.</p></div>","Intermediária"],["Se A é falso e B é verdadeiro, A e B é:",["verdadeiro","falso","Sempre verdadeira","Sempre falsa"],1,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>A conjunção só é verdadeira quando ambas as partes são verdadeiras.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>A = falso; B = verdadeiro; falso E verdadeiro = falso.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Uma parte falsa torna toda a conjunção falsa.</p></div>","Difícil"],["Se A é falso e B é verdadeiro, A ou B é:",["verdadeiro","falso","Sempre verdadeira","Sempre falsa"],0,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>O OU inclusivo é verdadeiro quando pelo menos uma parte é verdadeira.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>A = falso; B = verdadeiro; falso OU verdadeiro = verdadeiro.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Somente falso OU falso resulta falso.</p></div>","Difícil"],["Inferência válida deve:",["depender de suposições extras","seguir as premissas","Sempre verdadeira","Sempre falsa"],1,"<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Uma conclusão válida precisa decorrer logicamente das premissas fornecidas.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>Se “todos os A são B” e “x é A”, então “x é B” decorre das premissas.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não use fatos externos não informados para sustentar a conclusão.</p></div>","Difícil"]],"id":"mat07","number":"07","review":[]};const KEY='rota-furb-'+DATA.id+'-v1';const all=[...(DATA.review||[]),...DATA.questions];const labels=['A','B','C','D','E'];let s=load();function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.attempts))return o}catch(e){}return {page:0,q:0,answers:Array(all.length).fill(null),confirmed:Array(all.length).fill(false),attempts:[],finished:false}}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function esc(t){return String(t).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function explanation(q,i,answer){const chosen=answer===undefined?s.answers[i]:answer;const correct=q[2];const wrong=chosen!==correct;const label=chosen===null?'Nenhuma alternativa':labels[chosen]+') '+q[1][chosen];const msg=wrong?'<b>Você marcou '+esc(label)+'.</b> Essa alternativa não corresponde ao resultado pedido. Compare o valor escolhido com as etapas do cálculo acima e observe se você marcou uma etapa intermediária, confundiu a operação ou deixou de converter as unidades. A resposta correta é <b>'+labels[correct]+') '+esc(q[1][correct])+'</b>.':'Você marcou a alternativa correta. Confira o raciocínio abaixo para verificar se chegou ao resultado pelo procedimento adequado.';return q[3].replace('<p class="selected-explanation"></p>','<p class="selected-explanation">'+msg+'</p>')}function badge(d){return '<span class="difficulty '+esc(d)+'">'+esc(d)+'</span>'}function go(n){s.page=n;save();render();scrollTo(0,0)}function finish(){if(!s.finished){s.attempts.push({date:new Date().toISOString(),answers:[...s.answers],score:DATA.questions.reduce((v,q,i)=>v+(s.answers[i+(DATA.review||[]).length]===q[2]),0),reviewScore:(DATA.review||[]).reduce((v,q,i)=>v+(s.answers[i]===q[2]),0)});s.finished=true;}go(DATA.sections.length+2)}function retry(){s.answers=Array(all.length).fill(null);s.confirmed=Array(all.length).fill(false);s.q=0;s.finished=false;go(DATA.sections.length+1)}function render(){const el=document.getElementById('app');let p=s.page;document.getElementById('meter').style.width=(Math.min(p,DATA.sections.length+2)/(DATA.sections.length+2)*100)+'%';if(p===0){el.innerHTML='<div class="eyebrow">'+esc(DATA.subject)+' · Aula '+esc(DATA.number)+'</div><h1>'+esc(DATA.title)+'</h1><p class="muted">Aula em telas sequenciais, com explicações, exemplos e avaliação interativa.</p><div class="callout"><b>O que você vai estudar:</b> '+DATA.sections.map(x=>esc(x[0])).join(' · ')+'</div><p class="notice">Material autoral para estudo, não oficial da FURB. A dificuldade é estimativa pedagógica.</p><div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="go(1)">Começar aula →</button></div>';}else if(p<=DATA.sections.length){let a=DATA.sections[p-1];el.innerHTML='<div class="eyebrow">Conteúdo '+p+' de '+DATA.sections.length+'</div><h1>'+esc(a[0])+'</h1>'+a[1]+'<div class="actions"><button class="btn secondary" onclick="go('+(p-1)+')">← Voltar</button><button class="btn" onclick="go('+(p+1)+')">'+(p===DATA.sections.length?'Ir para avaliação':'Próxima tela')+' →</button></div>';}else if(p===DATA.sections.length+1){let i=s.q,q=all[i],isReview=i<(DATA.review||[]).length,confirmed=s.confirmed[i];let options=q[1].map((o,j)=>'<button class="option '+(confirmed&&j===q[2]?'correct':confirmed&&j===s.answers[i]?'wrong':!confirmed&&j===s.answers[i]?'selected':'')+'" '+(confirmed?'disabled':'')+' onclick="choose('+j+')"><b>'+labels[j]+')</b> '+esc(o)+(confirmed&&j===q[2]?' ✓':confirmed&&j===s.answers[i]?' ✕':'')+'</button>').join('');el.innerHTML='<div class="qhead"><div><b>Questão '+(i+1)+' de '+all.length+'</b><div class="muted">'+(isReview?'Revisão da aula anterior':'Conteúdo da aula atual')+'</div></div>'+badge(q[4])+'</div><h2>'+esc(q[0])+'</h2>'+options+(confirmed?'<div class="feedback '+(s.answers[i]===q[2]?'':'bad')+'"><b>'+(s.answers[i]===q[2]?'Resposta correta!':'Resposta incorreta.')+'</b>'+explanation(q,i)+'</div>':'<p class="muted">Selecione uma alternativa e confirme para conferir a explicação.</p>')+'<div class="actions"><button class="btn secondary" onclick="previous()">← Voltar</button><button class="btn" '+(s.answers[i]===null?'disabled':'')+' onclick="advance()">'+(!confirmed?'Confirmar resposta':i===all.length-1?'Finalizar avaliação':'Próxima questão →')+'</button></div>';}else{const last=s.attempts[s.attempts.length-1],first=s.attempts[0],best=Math.max(...s.attempts.map(a=>a.score),0);const current=last||{score:0,reviewScore:0};let diffs=['Fácil','Intermediária','Difícil'].map(d=>{let ix=DATA.questions.map((q,i)=>[q,i]).filter(x=>x[0][4]===d);let ok=ix.filter(x=>current.answers[x[1]+(DATA.review||[]).length]===x[0][2]).length;return '<div class="stat">'+badge(d)+'<b>'+ok+'/'+ix.length+'</b><small>acertos</small></div>'}).join('');let hist=s.attempt
