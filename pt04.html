size:18px;color:#3e5960}.passage{background:#f4f8f5;border-left:4px solid #288f7d;border-radius:10px;padding:18px 21px;margin:23px 0;font-size:17px}.worked{background:#fafaf7;border:1px solid #dfe8e1;border-radius:12px;padding:18px 20px;margin:23px 0}.worked p{margin:8px 0}.paper table{width:100%;border-collapse:collapse;margin:22px 0;font-size:14px;line-height:1.5}.paper th{background:#e7f1eb;text-align:left}.paper td,.paper th{padding:12px;border:1px solid #d9e5df;vertical-align:top}.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:30px}.btn{border:0;background:var(--green);color:white;padding:12px 19px;border-radius:11px;font-weight:750}.btn.secondary{background:#e7f0ec;color:#0e5b54}.btn:disabled{opacity:.4;cursor:not-allowed}.qcount{font-size:13px;color:var(--muted);font-weight:700}.qtitle{font-size:19px;font-weight:700;line-height:1.55}.choices{display:grid;gap:10px;margin:22px 0}.choice{width:100%;display:flex;gap:12px;text-align:left;border:1px solid #d5e4dc;border-radius:11px;background:#fff;padding:14px;color:var(--ink);line-height:1.5}.choice.selected{background:#e8f4ee;border:2px solid var(--green);padding:13px}.choice.correct{background:#e6f6e9;border:2px solid var(--good);padding:13px}.choice.wrong{background:#fff0ed;border:2px solid var(--bad);padding:13px}.choice:disabled{cursor:default;opacity:1}.letter{font-weight:800;min-width:22px;color:var(--green)}.feedback{padding:19px;border-radius:13px;background:#f0f8f2;border:1px solid #b8dac4;margin:20px 0}.feedback.bad{background:#fff5f3;border-color:#e7c5c1}.feedback ul{margin:10px 0;padding-left:20px}.feedback li{margin:7px 0}.tag{display:inline-block;font-size:12px;padding:4px 10px;border:1px solid #b5d5c9;border-radius:30px;color:#276e62;margin-right:6px}.score{font-size:55px;font-weight:850;color:var(--green)}.history{border:1px solid var(--line);border-radius:13px;padding:17px;margin:12px 0}.history summary{cursor:pointer;font-weight:700}.small{font-size:13px;co </style></head><body><header><div><b>ROTA DA APROVAÇÃO</b><small>FURB · Motorista · Câmara de São Francisco do Sul</small></div><a href="index.html#portugues">← Painel de estudos</a></header><div class="layout"><aside class="sidebar"><h2>Capítulos desta aula</h2><nav id="nav" aria-label="Capítulos e avaliação"></nav><div class="progress"><div id="bar"></div></div><p>Progresso nesta aula: <span id="pct">0%</span></p><button type="button" class="nav" id="reset">Reiniciar tentativa (sem apagar histórico)</button></aside><main class="paper" id="content" aria-live="polite"></main></div><footer>Conteúdo autoral de Pontuação, alinhado ao tópico previsto no Anexo III do Edital 001/2026. Não é material oficial da FURB. Os dados são salvos neste navegador.</footer><script>
const KEY='rota-furb-pt-aula4-v4',VERSION=3;
const chapters=[{"title": "Pontuação: sentido, sintaxe e leitura", "body": "<p class=\"lead\">Pontuar não é simplesmente colocar vírgulas onde fazemos pausas para respirar. Os sinais organizam as relações entre palavras e orações, orientam a leitura e podem alterar o sentido de uma frase.</p><div class=\"worked\"><b>Compare</b><p>“Não, espere.”: o falante pede que alguém espere. “Não espere.”: o falante proíbe a espera. A vírgula muda a mensagem.</p><p>“Os motoristas, que estavam cansados, descansaram.”: a oração entre vírgulas apresenta uma informação sobre todos os motoristas mencionados. “Os motoristas que estavam cansados descansaram.”: sem vírgulas, o trecho restringe o grupo aos cansados.</p></div><h3>O que a prova pode avaliar?</h3><p>Além de identificar sinais, é necessário reconhecer sujeito e predicado, complementos verbais, adjuntos adverbiais, vocativo, aposto e orações coordenadas e subordinadas. A pontuação depende dessas funções.</p><table><tr><th>Sinal</th><th>Uso frequente</th><th>Atenção</th></tr><tr><td>Ponto final</td><td>Encerra uma declaração.</td><td>Não indica necessariamente fim de parágrafo.</td></tr><tr><td>Vírgula</td><td>Separa termos e orações em construções específicas.</td><td>Não separa automaticamente tudo que é longo.</td></tr><tr><td>Dois-pontos</td><td>Introduzem explicação, enumeração ou fala.</td><td>O trecho seguinte deve se relacionar ao anterior.</td></tr><tr><td>Ponto e vírgula</td><td>Separa unidades coordenadas extensas.</td><td>É mais forte que a vírgula e menos conclusivo que o ponto.</td></tr></table>"}, {"title": "Vírgula: quando NÃO usar", "body": "<p>Uma regra central é não separar por vírgula elementos que mantêm relação sintática direta na ordem habitual: <b>sujeito e verbo</b>, <b>verbo e complemento</b>, <b>nome e complemento nominal</b>.</p><div class=\"worked\"><b>Observe os erros</b><p><s>Os candidatos, aguardaram a convocação.</s> → <b>Os candidatos aguardaram a convocação.</b> O sujeito “os candidatos” não deve ser isolado do verbo “aguardaram”.</p><p><s>O fiscal verificou, os documentos.</s> → <b>O fiscal verificou os documentos.</b> O objeto direto “os documentos” completa o verbo.</p><p><s>A necessidade, de manutenção, foi registrada.</s> → <b>A necessidade de manutenção foi registrada.</b> “De manutenção” completa o sentido de “necessidade”.</p></div><h3>E se houver um termo intercalado?</h3><p>“Os candidatos, <b>após a divulgação do edital</b>, iniciaram a revisão.” Aqui as vírgulas delimitam um adjunto adverbial intercalado; não se está separando sujeito e verbo sem motivo. Retire o trecho intercalado e a estrutura básica permanece: “Os candidatos iniciaram a revisão”.</p><p>Uma vírgula pode surgir entre o sujeito e o verbo quando fecha uma expressão intercalada. A análise deve considerar a estrutura inteira, e não apenas as palavras vizinhas ao sinal.</p>"}, {"title": "Enumerações, vocativo e aposto", "body": "<h3>Enumeração</h3><p>Termos de mesma função sintática podem ser separados por vírgulas: “O motorista conferiu <b>pneus, freios, luzes e documentos</b>.” Em enumerações simples, normalmente não se coloca vírgula antes do “e” final. Há casos específicos em que essa vírgula é possível, como para destacar sujeitos distintos ou evitar ambiguidade; não transforme a observação em proibição absoluta.</p><h3>Vocativo</h3><p>É o termo usado para chamar ou interpelar alguém. Fica isolado por vírgula: “<b>Senhores candidatos,</b> mantenham a atenção.”; “Aguardem, <b>senhores candidatos</b>, a orientação.”</p><h3>Aposto explicativo</h3><p>Acrescenta identificação ou explicação a um termo: “O CTB, <b>Código de Trânsito Brasileiro</b>, estabelece regras de circulação.” O trecho entre vírgulas explica a sigla. Um aposto também pode ser isolado por travessões ou parênteses, conforme o efeito de leitura.</p><div class=\"worked\"><b>Não confunda</b><p>“Motorista, confira os pneus.” → <b>motorista</b> é vocativo: a pessoa está sendo chamada.</p><p>“Carlos, motorista da prefeitura, conferiu os pneus.” → <b>motorista da prefeitura</b> é aposto explicativo: identifica Carlos.</p></div>"}, {"title": "Adjuntos adverbiais deslocados e intercalados", "body": "<p>Adjuntos adverbiais acrescentam circunstâncias de tempo, lugar, modo, causa e outras. Quando aparecem deslocados da posição habitual, a vírgula pode organizar a leitura, especialmente quando são extensos.</p><div class=\"worked\"><p>Ordem direta: “A equipe realizou a vistoria <b>na manhã de segunda-feira</b>.”</p><p>Deslocamento: “<b>Na manhã de segunda-feira,</b> a equipe realizou a vistoria.”</p><p>Intercalação: “A equipe, <b>na manhã de segunda-feira,</b> realizou a vistoria.”</p></div><p>Adjuntos adverbiais curtos deslocados frequentemente admitem vírgula facultativa, conforme o contexto: “Hoje(,) haverá reunião”. Em prova, evite tratar toda vírgula de adjunto curto como obrigatória ou proibida sem examinar o enunciado e a norma aplicável.</p><h3>Expressões intercaladas</h3><p>“O veículo, <b>segundo o relatório</b>, precisava de reparos.” A expressão indica a fonte da informação e é isolada por vírgulas. O mesmo raciocínio vale para “aliás”, “por exemplo”, “isto é” e outras expressões explicativas, conforme a construção.</p>"}, {"title": "Orações coordenadas e conectivos", "body": "<p>Orações coordenadas podem ser independentes sintaticamente e relacionadas pelo sentido. A pontuação ajuda a marcar essa relação.</p><table><tr><th>Relação</th><th>Exemplo</th><th>Leitura</th></tr><tr><td>Adversidade</td><td>“O ônibus estava pronto, <b>mas</b> a viagem foi adiada.”</td><td>“Mas” introduz contraste; a vírgula antes dele é usual.</td></tr><tr><td>Conclusão</td><td>“Havia risco na pista; <b>portanto</b>, o trajeto foi alterado.”</td><td>O ponto e vírgula separa orações; a vírgula destaca o conectivo deslocado.</td></tr><tr><td>Explicação</td><td>“Reduza a velocidade, <b>pois</b> a pista está molhada.”</td><td>“Pois” introduz a justificativa da orientação.</td></tr><tr><td>Adição</td><td>“O motorista conferiu os freios <b>e</b> verificou os pneus.”</td><td>Com o mesmo sujeito e sequência simples, não se exige vírgula antes de “e”.</td></tr></table><h3>O “e” nem sempre impede a vírgula</h3><p>“O fiscal encerrou a vistoria, e os motoristas retornaram aos veículos.” Há sujeitos diferentes; a vírgula pode ser empregada para separar as orações. Também pode ocorrer vírgula antes de “e” com efeito de ênfase ou em construções mais complexas.</p><div class=\"worked\"><b>Erro comum</b><p>“O ônibus estava pronto mas, a viagem foi adiada.” A vírgula foi deslocada indevidamente. O usual é: “O ônibus estava pronto, mas a viagem foi adiada.”</p></div>"}, {"title": "Orações subordinadas: explicação e restrição", "body": "<p>Uma oração adjetiva caracteriza um substantivo anterior. A presença ou ausência de vírgulas pode mudar o alcance da informação.</p><div class=\"worked\"><b>Restritiva — sem vírgulas</b><p>“Os veículos <b>que apresentavam defeitos</b> foram retirados de circulação.” Apenas os veículos com defeitos foram retirados. A oração delimita quais veículos.</p><b>Explicativa — entre vírgulas</b><p>“Os veículos, <b>que apresentavam defeitos</b>, foram retirados de circulação.” A construção apresenta a característica como informação adicional sobre os veículos já identificados; nesse contexto, entende-se que todos os veículos mencionados tinham defeitos.</p></div><h3>Orações adverbiais antecipadas</h3><p>“<b>Quando a chuva começou,</b> os motoristas reduziram a velocidade.” A oração temporal aparece antes da principal e é separada por vírgula.</p><p>“Os motoristas reduziram a velocidade <b>quando a chuva começou</b>.” Na ordem principal + subordinada, a vírgula normalmente é dispensada nessa construção.</p><p>“<b>Embora estivesse atrasado,</b> o motorista respeitou o limite.” A oração concessiva antecipada é isolada por vírgula.</p><h3>Oração substantiva como complemento</h3><p>“O fiscal informou <b>que a vistoria terminaria às 16 horas</b>.” Não se coloca vírgula entre “informou” e a oração que completa seu sentido.</p>"}, {"title": "Dois-pontos, ponto e vírgula, travessão e parênteses", "body": "<h3>Dois-pontos</h3><p>Introduzem algo anunciado: “A inspeção verificou três itens: <b>pneus, iluminação e freios</b>.” Também podem introduzir esclarecimento: “A decisão foi prudente: havia risco de aquaplanagem.”</p><h3>Ponto e vírgula</h3><p>Ajuda a separar partes extensas, sobretudo quando já contêm vírgulas: “Na primeira etapa, conferiram-se os documentos; na segunda, foram examinados os veículos.”</p><h3>Travessão</h3><p>Pode introduzir fala ou destacar informação intercalada: “A vistoria — <b>prevista para as oito horas</b> — começou pontualmente.” O trecho entre travessões funciona como explicação adicional.</p><h3>Parênteses</h3><p>Inserem informação acessória: “O condutor apresentou a CNH (Carteira Nacional de Habilitação)”. Não se deve inserir parênteses de modo a romper a estrutura obrigatória da frase.</p><div class=\"worked\"><b>Escolha consciente</b><p>“A revisão incluiu: pneus, freios e luzes.” A enumeração está correta quanto à ideia, mas em redação formal é preferível uma construção com termo anunciador: “A revisão incluiu os seguintes itens: pneus, freios e luzes.” Ou, sem dois-pontos: “A revisão incluiu pneus, freios e luzes.”</p></div>"}, {"title": "Questões de concurso: método de análise e revisão", "body": "<p>Em exercícios de pontuação, primeiro identifique a estrutura da frase. A pergunta central não é “onde eu faria uma pausa?”, mas “qual função esse trecho desempenha?”.</p><h3>Exemplo resolvido 1 — erro de vírgula</h3><div class=\"worked\"><p>“Os candidatos, entregaram os documentos ao fiscal.”</p><p><b>Passo 1:</b> identifique o verbo: <i>entregaram</i>. <b>Passo 2:</b> pergunte quem entregou: <i>os candidatos</i> (sujeito). <b>Passo 3:</b> a vírgula separa sujeito e verbo sem intercalação? Sim. <b>Correção:</b> “Os candidatos entregaram os documentos ao fiscal.”</p></div><h3>Exemplo resolvido 2 — sentido</h3><div class=\"worked\"><p>“Os servidores que estavam de plantão receberam a orientação.” A oração restringe quais servidores.</p><p>“Os servidores, que estavam de plantão, receberam a orientação.” A oração é explicativa; a informação sobre o plantão vale para o grupo de servidores mencionado.</p><p><b>Conclusão:</b> inserir vírgulas não é sempre uma mudança apenas de estilo: pode alterar a interpretação.</p></div><h3>Exemplo resolvido 3 — enumeração e intercalação</h3><div class=\"worked\"><p>“Na vistoria, o técnico conferiu os pneus, as luzes e os freios.”</p><p>“Na vistoria” é circunstância antecipada, separada por vírgula. “Pneus, luzes e freios” é enumeração de objetos do verbo “conferiu”. Não há vírgula entre “conferiu” e “os pneus”.</p></div><p>Nos exercícios a seguir, algumas alternativas apresentam mais de uma vírgula. Analise cada sinal e o sentido completo antes de responder.</p>"}];
const questions=[{"topic": "Sujeito e predicado", "level": "Intermediário", "passage": "I. Os servidores, conferiram os documentos.\nII. Na segunda-feira, os servidores conferiram os documentos.\nIII. Os servidores, após a reunião, conferiram os documentos.\nIV. Os servidores conferiram, os documentos.", "ask": "Assinale a alternativa que identifica corretamente as frases com pontuação adequada.", "options": ["Apenas I e II.", "Apenas II e III.", "Apenas I, II e III.", "Apenas III e IV.", "Todas."], "answer": "B", "why": ["I separa sujeito e verbo sem intercalação.", "Correta: II apresenta adjunto adverbial antecipado e III isola expressão intercalada.", "I está errada por separar sujeito e verbo.", "IV separa verbo e objeto direto; II também está correta.", "I e IV estão incorretas."]}, {"topic": "Vocativo e aposto", "level": "Intermediário", "passage": "Considere o uso das vírgulas nas comunicações administrativas.", "ask": "Qual alternativa apresenta pontuação INADEQUADA?", "options": ["Senhores candidatos, aguardem a chamada.", "O fiscal, responsável pela vistoria, chegou cedo.", "Carlos, confira a documentação antes de sair.", "O motorista, entregou o relatório à chefia.", "A vistoria, prevista para hoje, foi adiada."], "answer": "D", "why": ["O vocativo está corretamente separado.", "O aposto explicativo está corretamente isolado.", "O vocativo está separado por vírgula.", "Correta: a vírgula separa indevidamente o sujeito “o motorista” do verbo “entregou”.", "O trecho explicativo intercalado está corretamente isolado."]}, {"topic": "Oração adjetiva", "level": "Difícil", "passage": "I. Os veículos que estavam sem manutenção foram recolhidos.\nII. Os veículos, que estavam sem manutenção, foram recolhidos.", "ask": "Qual interpretação é compatível com a pontuação?", "options": ["Em I, todos os veículos citados estavam sem manutenção.", "Em II, somente parte dos veículos citados foi recolhida.", "As vírgulas em II não produzem mudança de sentido.", "Em I, a oração é explicativa; em II, restritiva.", "Em I, a oração delimita o grupo; em II, acrescenta uma explicação sobre o grupo já identificado."], "answer": "E", "why": ["I restringe o grupo aos veículos sem manutenção.", "II apresenta informação explicativa sobre o grupo mencionado.", "A pontuação pode alterar o alcance da informação.", "A classificação foi invertida.", "Correta: I é restritiva e II é explicativa."]}, {"topic": "Enumeração", "level": "Intermediário", "passage": "Uma equipe registrou os itens examinados antes da viagem.", "ask": "Assinale a frase com pontuação adequada, sem separação indevida entre verbo e complemento.", "options": ["A equipe conferiu pneus, luzes, freios e documentos.", "A equipe conferiu, pneus, luzes, freios e documentos.", "A equipe, conferiu pneus, luzes, freios e documentos.", "A equipe conferiu pneus luzes, freios e documentos.", "A equipe conferiu pneus, luzes, freios, e, documentos."], "answer": "A", "why": ["Correta: os objetos estão em enumeração, sem separar o verbo do primeiro objeto.", "A vírgula após “conferiu” separa verbo e complemento.", "A vírgula separa sujeito e verbo.", "Falta a separação entre “pneus” e “luzes”.", "A vírgula após “e” quebra a ligação com o último item."]}, {"topic": "Conectivos", "level": "Difícil", "passage": "O ônibus estava pronto. A viagem foi adiada devido à interdição da estrada.", "ask": "Qual reescrita preserva a oposição entre as ideias e apresenta pontuação adequada?", "options": ["O ônibus estava pronto mas, a viagem foi adiada.", "O ônibus estava pronto, mas a viagem foi adiada.", "O ônibus estava pronto, portanto a viagem foi adiada.", "O ônibus estava pronto, porque a viagem foi adiada.", "O ônibus estava pronto; e mas a viagem foi adiada."], "answer": "B", "why": ["A vírgula foi colocada depois de “mas”, quando deveria antecedê-lo.", "Correta: “mas” estabelece contraste, com vírgula antes do conectivo.", "“Portanto” indica conclusão, não contraste.", "“Porque” introduz causa ou explicação, não oposição.", "A combinação “e mas” é inadequada nessa estrutura."]}, {"topic": "Orações subordinadas", "level": "Difícil", "passage": "Considere as orações temporais e concessivas.", "ask": "Assinale a alternativa em que a vírgula está empregada de maneira INCORRETA.", "options": ["Quando a chuva começou, a equipe reduziu a velocidade.", "Embora estivesse atrasado, o motorista respeitou o limite.", "O fiscal informou, que a vistoria terminaria às 16 horas.", "Se houver interdição, o trajeto será alterado.", "Após a vistoria, os veículos retornaram à garagem."], "answer": "C", "why": ["A oração temporal antecipada está corretamente separada.", "A oração concessiva antecipada está corretamente separada.", "Correta: não se separa “informou” da oração que funciona como seu complemento.", "A oração condicional antecipada está corretamente separada.", "O adjunto adverbial antecipado está adequadamente separado."]}, {"topic": "Dois-pontos e ponto e vírgula", "level": "Intermediário", "passage": "Leia as construções e observe a relação entre as partes.", "ask": "Qual alternativa usa os dois-pontos para introduzir uma enumeração anunciada?", "options": ["A vistoria terminou: e os motoristas saíram.", "Os documentos: foram entregues ao fiscal.", "A equipe: conferiu os pneus antes da viagem.", "A inspeção avaliou três itens: pneus, freios e iluminação.", "Os veículos estavam: em condições de uso."], "answer": "D", "why": ["Os dois-pontos não devem ser inseridos antes de “e” nessa estrutura.", "O sinal separa indevidamente sujeito e predicado.", "O sinal separa indevidamente sujeito e verbo.", "Correta: “três itens” anuncia a enumeração.", "O sinal interrompe o predicado sem função justificável."]}, {"topic": "Adjunto intercalado", "level": "Intermediário", "passage": "O relatório registrou uma informação fornecida pela equipe de manutenção.", "ask": "Qual alternativa isola corretamente a expressão intercalada “segundo a equipe de manutenção”?", "options": ["O veículo, segundo a equipe de manutenção precisava de reparos.", "O veículo segundo, a equipe de manutenção, precisava de reparos.", "O veículo segundo a equipe de manutenção, precisava de reparos.", "O veículo, segundo a equipe, de manutenção precisava de reparos.", "O veículo, segundo a equipe de manutenção, precisava de reparos."], "answer": "E", "why": ["Falta a vírgula que fecha a intercalação.", "A expressão foi dividida internamente em lugar inadequado.", "Falta a vírgula de abertura da intercalação.", "A expressão foi dividida indevidamente.", "Correta: as duas vírgulas delimitam a expressão que indica a fonte da informação."]}, {"topic": "Pontuação e sentido", "level": "Difícil", "passage": "Compare: “Não, espere.” e “Não espere.”", "ask": "Assinale a análise correta.", "options": ["Na primeira, pede-se que a pessoa espere; na segunda, orienta-se que não espere.", "As duas frases transmitem a mesma ordem.", "Na primeira, proíbe-se a espera; na segunda, solicita-se a espera.", "A vírgula na primeira frase separa sujeito e verbo.", "A ausência de vírgula na segunda torna a frase gramaticalmente incorreta."], "answer": "A", "why": ["Correta: a vírgula altera o valor da negativa e, portanto, o sentido.", "As ordens são diferentes.", "Os sentidos foram invertidos.", "Não há sujeito expresso separado do verbo nessa construção.", "“Não espere” é uma ordem negativa gramaticalmente correta."]}, {"topic": "Revisão integrada", "level": "Difícil", "passage": "I. O motorista, após a inspeção, iniciou a viagem.\nII. O motorista, iniciou a viagem após a inspeção.\nIII. Os pneus, os freios e as luzes foram verificados.\nIV. O fiscal informou, que o veículo estava liberado.", "ask": "Quais frases apresentam pontuação adequada?", "options": ["Apenas I e II.", "Apenas I e III.", "Apenas II e IV.", "Apenas I, III e IV.", "Todas."], "answer": "B", "why": ["II separa sujeito e verbo sem termo intercalado.", "Correta: I isola a expressão intercalada e III separa os itens de um sujeito composto.", "II e IV estão incorretas.", "IV separa “informou” de seu complemento.", "II e IV estão incorretas."]}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({version:VERSION,mode:'chapter',chapter:0,q:0,answers:Array(10).fill(null),confirmed:Array(10).fill(false),finished:false,attempts:[],legacyAttempts:[]});
let state=blank();
try{const prev=JSON.parse(localStorage.getItem(KEY)||'null');if(prev&&prev.version===VERSION){state={...blank(),...prev};if(!Array.isArray(state.answers)||state.answers.length!==10)state.answers=Array(10).fill(null);if(!Array.isArray(state.confirmed)||state.confirmed.length!==10)state.confirmed=Array(10).fill(false)}else if(prev){if(!localStorage.getItem(KEY+'-arquivo-anterior'))localStorage.setItem(KEY+'-arquivo-anterior',JSON.stringify(prev));state.legacyAttempts=(Array.isArray(prev.attempts)?prev.attempts:[]).map(a=>({date:a.date,score:a.score,total:a.total}));if(!state.legacyAttempts.length&&prev.finished)state.legacyAttempts.push({date:null,score:null,total:10});}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function setMode(mode){state.mode=mode;save();render();window.scrollTo(0,0)}
function setChapter(i){state.chapter=Math.max(0,Math.min(chapters.length-1,i));setMode('chapter')}
function setQuestion(i){state.q=Math.max(0,Math.min(questions.length-1,i));setMode('quiz')}
function nav(){const arr=[...chapters.map((c,i)=>({label:c.title,mode:'chapter',i})),{label:'Exercícios',mode:'quiz',i:0},{label:'Resultados',mode:'results',i:0}];$('nav').innerHTML=arr.map((n,i)=>`<button type="button" class="nav ${state.mode===n.mode&&(n.mode!=='chapter'||n.i===state.chapter)?'active':''}" data-nav="${i}" ${n.mode==='results'&&!state.finished?'disabled':''}><span class="n">${String(i+1).padStart(2,'0')}</span>${esc(n.label)}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{let n=arr[+b.dataset.nav];if(n.mode==='chapter')setChapter(n.i);else if(n.mode==='quiz')setQuestion(state.q);else if(state.finished)setMode('results')});let pct=state.finished?100:state.mode==='chapter'?Math.round((state.chapter+1)/(chapters.length+2)*80):Math.round(80+state.confirmed.filter(Boolean).length/10*20);$('bar').style.width=pct+'%';$('pct').textContent=pct+'%';}
function actions(back,next,nextLabel){return `<div class="actions"><button type="button" class="btn secondary" id="back">← Voltar</button><button type="button" class="btn" id="next">${nextLabel||'Continuar →'}</button></div>`}
function renderChapter(){let c=chapters[state.chapter];$('content').innerHTML=`<div class="eyebrow">Português · Aula 04 · Capítulo ${state.chapter+1} de ${chapters.length}</div><h1>${esc(c.title)}</h1>${c.body}${actions()}`;$('back').onclick=()=>state.chapter?setChapter(state.chapter-1):location.assign('index.html#portugues');$('next').textContent=state.chapter===chapters.length-1?'Ir aos exercícios →':'Próximo capítulo →';$('next').onclick=()=>state.chapter===chapters.length-1?setQuestion(0):setChapter(state.chapter+1)}
function renderQuiz(){let i=state.q,q=questions[i],chosen=state.answers[i],locked=state.confirmed[i];$('content').innerHTML=`<div class="eyebrow">Avaliação · Pontuação</div><div class="qcount">Questão ${i+1} de ${questions.length} · ${esc(q.level)} · ${esc(q.topic)}</div><div class="quiznav">${questions.map((_,j)=>`<button type="button" data-q="${j}" class="${j===i?'active':''} ${state.confirmed[j]?'done':''}" aria-label="Ir à questão ${j+1}">${j+1}</button>`).join('')}</div><div class="passage">${esc(q.passage)}</div><p class="qtitle">${esc(q.ask)}</p><div class="choices">${q.options.map((o,j)=>{let l='ABCDE'[j];return `<button type="button" data-opt="${l}" class="choice ${locked&&l===q.answer?'correct':locked&&chosen===l?'wrong':chosen===l?'selected':''}" ${locked?'disabled':''}><span class="letter">${l})</span><span>${esc(o)}</span></button>`}).join('')}</div>${locked?`<div class="feedback ${chosen===q.answer?'':'bad'}"><strong>${chosen===q.answer?'Resposta correta.':'Resposta incorreta.'} Gabarito: ${q.answer}.</strong><p><b>Entenda as alternativas:</b></p><ul>${q.why.map((reason,j)=>`<li><b>${'ABCDE'[j]})</b> ${esc(reason)}${chosen==='ABCDE'[j]&&chosen!==q.answer?' <b>← sua escolha</b>':''}</li>`).join('')}</ul></div>`:''}<p class="small">A correção desta aula aparece após confirmar cada resposta. O Simuladão, separadamente, só mostra o gabarito no final.</p><div class="actions"><button class="btn secondary" id="back">← ${i?'Questão anterior':'Voltar ao conteúdo'}</button><button class="btn" id="next" ${chosen===null?'disabled':''}>${locked?(i===9?'Finalizar avaliação':'Próxima questão →'):'Confirmar resposta'}</button></div>`;
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>setQuestion(+b.dataset.q));document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(state.confirmed[i])return;state.answers[i]=b.dataset.opt;save();render()});$('back').onclick=()=>i?setQuestion(i-1):setChapter(chapters.length-1);$('next').onclick=()=>{if(state.answers[i]===null)return;if(!state.confirmed[i]){state.confirmed[i]=true;save();render();return}if(i<questions.length-1){setQuestion(i+1);return}if(state.confirmed.every(Boolean)){state.finished=true;state.attempts.push({date:new Date().toISOString(),score:questions.filter((q,j)=>q.answer===state.answers[j]).length,total:questions.length,answers:[...state.answers]});setMode('results')}else{let next=state.confirmed.findIndex(x=>!x);setQuestion(next)}}}
function renderResults(){if(!state.finished){setQuestion(0);return}let score=questions.filter((q,i)=>q.answer===state.answers[i]).length;$('content').innerHTML=`<div class="eyebrow">Avaliação concluída</div><h1>Resultado da Aula 04</h1><div class="score">${score}/${questions.length}</div><p>Acertos nesta tentativa. A nota não representa previsão de aprovação no concurso.</p><h2>Correção por questão</h2>${questions.map((q,i)=>`<div class="history"><b>Questão ${i+1} — ${state.answers[i]===q.answer?'Acerto':'Erro'}</b><p class="small">Sua resposta: ${state.answers[i]||'não respondida'} · Correta: ${q.answer}</p><p>${esc(q.why['ABCDE'.indexOf(q.answer)])}</p></div>`).join('')}<h2>Histórico de tentativas</h2>${state.attempts.map((a,i)=>`<details class="history"><summary>Tentativa ${i+1} — ${a.score}/${a.total} · ${a.date?new Date(a.date).toLocaleString('pt-BR'):''}</summary>${a.answers.map((v,j)=>`<p>Questão ${j+1}: ${v} · correta ${questions[j].answer} — ${v===questions[j].answer?'acerto':'erro'}</p>`).join('')}</details>`).join('')}${state.legacyAttempts.length?`<div class="history"><b>Histórico da versão anterior</b><p class="small">${state.legacyAttempts.length} tentativa(s) anterior(es) preservada(s). Como as questões foram substituídas, o gabarito antigo não foi aplicado às novas questões.</p>${state.legacyAttempts.map(a=>`<p>${a.score===null?'Avaliação anterior':`${a.score}/${a.total}`} ${a.date?'· '+new Date(a.date).toLocaleString('pt-BR'):''}</p>`).join('')}</div>`:''}<div class="actions"><button class="btn secondary" id="back">Rever conteúdo</button><button class="btn" id="next">Nova tentativa</button></div>`;$('back').onclick=()=>setChapter(0);$('next').onclick=()=>{state.answers=Array(10).fill(null);state.confirmed=Array(10).fill(false);state.q=0;state.finished=false;setQuestion(0)}}
function render(){nav();if(state.mode==='chapter')renderChapter();else if(state.mode==='quiz')renderQuiz();else renderResults()}
$('reset').onclick=()=>{if(confirm('Reiniciar apenas a tentativa em andamento? O histórico de tentativas será mantido.')){state.answers=Array(10).fill(null);state.confirmed=Array(10).fill(false);state.q=0;state.finished=false;setChapter(0)}};
save();render();
</script></body></html>
