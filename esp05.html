fic{border-radius:15px;background:#252c2f;padding:10px;display:flex;flex-direction:column;gap:7px}.traffic i{width:24px;height:24px;border-radius:50%;background:#dd3a3a}.traffic i:nth-child(2){background:#f2b93c}.traffic i:nth-child(3){background:#32ad64}.tires>div{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}.tire{width:110px;height:50px;border:9px solid #30383b;border-radius:12px;background:linear-gradient(90deg,#666 0 28%,#db8c43 28% 72%,#666 72%)}.tire.edges{background:linear-gradient(90deg,#db8c43 0 28%,#666 28% 72%,#db8c43 72%)}.bar{background:#e3e8e6;border-radius:8px;height:28px;overflow:hidden}.bar span{display:block;height:100%;background:#087f78}.notice{font-size:13px;color:#536f70;border-left:3px solid #087f78;padding-left:12px}@media(max-width:600px){.stats{grid-template-columns:1fr}.card{padding:20px}.speed span{width:75px;height:75px;font-size:22px}}</style><style id="study-guides-css">#study-guide-launch{position:fixed;right:18px;bottom:18px;z-index:900;background:#145b57;color:#fff;border:0;border-radius:99px;padding:13px 18px;box-shadow:0 6px 22px #1238;cursor:pointer;font:600 14px system-ui}#study-guide-shade{position:fixed;inset:0;background:#091d24aa;z-index:999;display:none;align-items:center;justify-content:center;padding:14px}#study-guide-shade.open{display:flex}#study-guide-dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;color:#14343b;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0015;font:15px/1.55 system-ui}#study-guide-dialog h2{margin:0;font-size:24px}#study-guide-dialog .ghead{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:16px}#study-guide-dialog .gclose{border:0;border-radius:10px;background:#eaf0ed;padding:9px 13px;cursor:pointer}#study-guide-dialog details{border:1px solid #dce6e0;border-radius:12px;margin:10px 0;overflow:hidden}#study-guide-dialog summary{padding:14px;cursor:pointer;font-weight:750;background:#f4f8f5}#study-guide-dialog .gbody{padding:14px}#study-guide-dialog .gterms{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}#study-guide-dialog .gterms span{background:#e8f4ee;padding:5px 9px;border-radius:7px;font-size:13px}#study-guide-dialog .gexample{background:#f1f5f7;border-left:4px solid #2c827b;padding:10px 12px;border-radius:6px}#study-guide-dialog .gtip{color:#5c4d23;background:#fff7e2;padding:10px 12px;border-radius:8px;margin-top:9px}#study-guide-dialog .gsub{color:#657b7d;font-size:13px;margin-top:4px}@media(max-width:600px){#study-guide-launch{right:12px;bottom:12px;padding:11px 14px}#study-guide-dialog{padding:15px}}</style><style id="official-material-css">.official-section{max-width:960px;margin:18px auto 70px;padding:0 16px}.official-panel{background:#fff;border:1px solid #dbe7e1;border-radius:18px;padding:22px;box-shadow:0 6px 22px #123410}.official-panel h2{margin:0 0 6px}.official-item{margin:15px 0;border:1px solid #dbe7e1;border-radius:12px;padding:15px}.official-quote{white-space:pre-wrap;background:#f2f7f5;border-left:4px solid #147e74;padding:13px;margin:10px 0}.official-meta{font-size:13px;color:#546e70}.official-warning{background:#fff4d9;padding:12px;border-radius:9px;font-size:14px}.official-panel a{font-weight:700}.official-panel summary{cursor:pointer;font-weight:700}</style></head><body><header><div><strong>ROTA DA APROVAÇÃO</strong><small>Conhecimentos Específicos · Aula 02</small></div><a href="index.html">← Disciplinas</a></header><main><div class="progress"><span id="meter"></span></div><section class="card" id="app"></section></main><script>const DATA={"subject": "Conhecimentos Específicos", "title": "Condução de veículos oficiais e rotinas de serviço", "sections": [["1. Dever funcional do motorista oficial", "<p>O veículo público é destinado ao serviço autorizado, e seu uso deve observar finalidade pública, legalidade, cuidado com patrimônio e orientações institucionais. O motorista deve cumprir escalas e itinerários autorizados sem desrespeitar normas de trânsito.</p><div class=\"example\"><b>Situação prática</b><p>Uma ordem para dirigir acima do limite de velocidade não afasta a obrigação de respeitar a legislação.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Ordem de serviço não equivale a imunidade contra infrações.</div><p><b>Correspondência com o programa:</b> Edital: condução de veículos oficiais e ética.</p>"], ["2. Planejamento de deslocamentos", "<p>Confirme destino, passageiros, horários, percurso, previsão de combustível, trânsito e condições meteorológicas. Considere margens de tempo para evitar pressa. Quando houver alteração de rota ou destino, siga o procedimento institucional de comunicação e registro.</p><div class=\"example\"><b>Situação prática</b><p>Uma via foi interditada: escolha rota segura, informe o setor responsável e registre o percurso efetivamente realizado.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Planejamento não é apenas selecionar o caminho mais curto.</div><p><b>Correspondência com o programa:</b> Edital: escalas, rotinas operacionais e percurso.</p>"], ["3. Diário de bordo e controle de quilometragem", "<p>O registro deve permitir identificar veículo, condutor, data, horário de saída e chegada, hodômetro inicial e final, destino, passageiros quando exigido, abastecimentos e ocorrências. A distância percorrida é hodômetro final menos hodômetro inicial. Registros devem ser verdadeiros, legíveis e coerentes.</p><div class=\"example\"><b>Situação prática</b><p>Saída com 28.430 km e retorno com 28.498 km: percurso de 68 km. Se o registro indica 86 km, há divergência a verificar.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Não confunda quilômetros rodados com valor total do hodômetro.</div><p><b>Correspondência com o programa:</b> Edital: controle de quilometragem, horários, passageiros e destino.</p>"], ["4. Combustível, lubrificantes e consumo", "<p>Registre data, quilometragem, quantidade abastecida, tipo de combustível e comprovante conforme regra local. Consumo médio em km/L é distância percorrida dividida por litros utilizados no período comparável. Compare valores apenas com abastecimentos e condições consistentes; trânsito, carga e relevo afetam consumo.</p><div class=\"example\"><b>Situação prática</b><p>Foram percorridos 360 km com 30 L consumidos: 360 ÷ 30 = 12 km/L. Isso não prova irregularidade sem histórico comparável.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Maior km/L significa melhor rendimento; maior L/100 km significa maior consumo.</div><p><b>Correspondência com o programa:</b> Edital: abastecimento, combustível e lubrificantes.</p>"], ["5. Controle de manutenção e relatórios", "<p>Diferencie manutenção preventiva, programada por prazo ou quilometragem, de corretiva, feita após falha. Registre sintomas objetivos, data, quilometragem e providências, sem inventar diagnóstico. Serviços devem seguir manual do fabricante e procedimentos do órgão.</p><div class=\"example\"><b>Situação prática</b><p>Relatório útil: “Luz de temperatura acendeu após 12 km; veículo estacionado em segurança; setor informado”. Evite escrever “motor queimado” sem avaliação.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Não apagar sinais de falha nem improvisar reparo incompatível com sua capacitação.</div><p><b>Correspondência com o programa:</b> Edital: relatórios e conservação dos veículos.</p>"], ["6. Avarias, acidentes e irregularidades", "<p>Proteja a vida, pare em local seguro quando possível, sinalize, acione atendimento e siga procedimentos de comunicação e registro. Em acidente com vítima, não mova a pessoa sem necessidade imediata de afastar risco maior. Preserve informações para relatório, sem comprometer socorro.</p><div class=\"example\"><b>Situação prática</b><p>Após colisão, verifique riscos do local e chame emergência; o preenchimento do relatório vem depois da proteção das pessoas.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Não priorize preservação do patrimônio sobre atendimento a vítimas.</div><p><b>Correspondência com o programa:</b> CTB e edital: procedimentos em avarias e acidentes.</p>"], ["7. Relações humanas e ética no serviço público", "<p>Trate usuários e colegas com respeito, discrição, imparcialidade e comunicação clara. Informações pessoais de passageiros devem ser protegidas. Diante de conflito, mantenha postura profissional e utilize canais institucionais.</p><div class=\"example\"><b>Situação prática</b><p>Se um passageiro exige manobra perigosa, explique a impossibilidade de forma respeitosa e ofereça alternativa segura.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Ser cordial não significa concordar com conduta ilegal ou insegura.</div><p><b>Correspondência com o programa:</b> Edital: relações humanas e ética profissional.</p>"]], "questions": [["Uso de veículo oficial deve observar:", ["finalidade do serviço", "preferência pessoal", "Ambas as alternativas", "Nenhuma das alternativas"], 0, "Veículo público atende atividade autorizada.", "Fácil"], ["Antes de sair, é importante conferir:", ["apenas limpeza externa", "documentação e segurança", "Ambas as alternativas", "Nenhuma das alternativas"], 1, "Conferência prévia previne irregularidades.", "Fácil"], ["Saída 100 km, retorno 145 km: percurso?", ["45 km", "245 km", "Ambas as alternativas", "Nenhuma das alternativas"], 0, "145 − 100 = 45.", "Fácil"], ["Saída 12.450 km, retorno 12.482 km: percurso?", ["42 km", "32 km", "Ambas as alternativas", "Nenhuma das alternativas"], 1, "12.482 − 12.450 = 32.", "Intermediária"], ["O registro de uso pode incluir:", ["destino e horários", "somente a cor do carro", "Ambas as alternativas", "Nenhuma das alternativas"], 0, "O controle registra a utilização.", "Intermediária"], ["Ao notar avaria de segurança, deve-se:", ["ignorar até a próxima semana", "comunicar e evitar uso inseguro", "Ambas as alternativas", "Nenhuma das alternativas"], 1, "Segurança e comunicação são prioritárias.", "Intermediária"], ["Um destino diferente do autorizado exige:", ["orientação/autorização conforme normas", "decisão sem registro", "Ambas as alternativas", "Nenhuma das alternativas"], 0, "A rotina pública exige finalidade e controle.", "Intermediária"], ["O controle de combustível permite:", ["substituir manutenção", "acompanhar consumo", "Ambas as alternativas", "Nenhuma das alternativas"], 1, "Consumo é dado de gestão, não reparo.", "Difícil"], ["O registro de ocorrências deve ser:", ["fiel aos fatos", "alterado para evitar explicações", "Ambas as alternativas", "Nenhuma das alternativas"], 0, "Registro deve ser confiável.", "Difícil"], ["O condutor deve cumprir:", ["apenas preferências próprias", "escalas e orientações de serviço", "Ambas as alternativas", "Nenhuma das alternativas"], 1, "Rotinas institucionais orientam o trabalho.", "Difícil"]], "id": "esp05", "number": "05", "review": []};const KEY='rota-furb-'+DATA.id+'-v1';const all=[...(DATA.review||[]),...DATA.questions];const labels=['A','B','C','D','E'];let s=load();function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.attempts))return o}catch(e){}return {page:0,q:0,answers:Array(all.length).fill(null),confirmed:Array(all.length).fill(false),attempts:[],finished:false}}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function esc(t){return String(t).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function badge(d){return '<span class="difficulty '+esc(d)+'">'+esc(d)+'</span>'}function go(n){s.page=n;save();render();scrollTo(0,0)}function finish(){if(!s.finished){s.attempts.push({date:new Date().toISOString(),answers:[...s.answers],score:DATA.questions.reduce((v,q,i)=>v+(s.answers[i+(DATA.review||[]).length]===q[2]),0),reviewScore:(DATA.review||[]).reduce((v,q,i)=>v+(s.answers[i]===q[2]),0)});s.finished=true;}go(DATA.sections.length+2)}function retry(){s.answers=Array(all.length).fill(null);s.confirmed=Array(all.length).fill(false);s.q=0;s.finished=false;go(DATA.sections.length+1)}function render(){const el=document.getElementById('app');let p=s.page;document.getElementById('meter').style.width=(Math.min(p,DATA.sections.length+2)/(DATA.sections.length+2)*100)+'%';if(p===0){el.innerHTML='<div class="eyebrow">'+esc(DATA.subject)+' · Aula '+esc(DATA.number)+'</div><h1>'+esc(DATA.title)+'</h1><p class="muted">Aula em telas sequenciais, com explicações, exemplos e avaliação interativa.</p><div class="callout"><b>O que você vai estudar:</b> '+DATA.sections.map(x=>esc(x[0])).join(' · ')+'</div><p class="notice">Material autoral para estudo, não oficial da FURB. A dificuldade é estimativa pedagógica.</p><div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="go(1)">Começar aula →</button></div>';}else if(p<=DATA.sections.length){let a=DATA.sections[p-1];el.innerHTML='<div class="eyebrow">Conteúdo '+p+' de '+DATA.sections.length+'</div><h1>'+esc(a[0])+'</h1>'+a[1]+'<div class="actions"><button class="btn secondary" onclick="go('+(p-1)+')">← Voltar</button><button class="btn" onclick="go('+(p+1)+')">'+(p===DATA.sections.length?'Ir para avaliação':'Próxima tela')+' →</button></div>';}else if(p===DATA.sections.length+1){let i=s.q,q=all[i],isReview=i<(DATA.review||[]).length,confirmed=s.confirmed[i];let options=q[1].map((o,j)=>'<button class="option '+(confirmed&&j===q[2]?'correct':confirmed&&j===s.answers[i]?'wrong':!confirmed&&j===s.answers[i]?'selected':'')+'" '+(confirmed?'disabled':'')+' onclick="choose('+j+')"><b>'+labels[j]+')</b> '+esc(o)+(confirmed&&j===q[2]?' ✓':confirmed&&j===s.answers[i]?' ✕':'')+'</button>').join('');el.innerHTML='<div class="qhead"><div><b>Questão '+(i+1)+' de '+all.length+'</b><div class="muted">'+(isReview?'Revisão da aula anterior':'Conteúdo da aula atual')+'</div></div>'+badge(q[4])+'</div><h2>'+esc(q[0])+'</h2>'+options+(confirmed?'<div class="feedback '+(s.answers[i]===q[2]?'':'bad')+'"><b>'+(s.answers[i]===q[2]?'Resposta correta!':'Resposta incorreta.')+'</b>'+esc(q[3])+'</div>':'<p class="muted">Selecione uma alternativa e confirme para conferir a explicação.</p>')+'<div class="actions"><button class="btn secondary" onclick="previous()">← Voltar</button><button class="btn" '+(s.answers[i]===null?'disabled':'')+' onclick="advance()">'+(!confirmed?'Confirmar resposta':i===all.length-1?'Finalizar avaliação':'Próxima questão →')+'</button></div>';}else{const last=s.attempts[s.attempts.length-1],first=s.attempts[0],best=Math.max(...s.attempts.map(a=>a.score),0);const current=last||{score:0,reviewScore:0};let diffs=['Fácil','Intermediária','Difícil'].map(d=>{let ix=DATA.questions.map((q,i)=>[q,i]).filter(x=>x[0][4]===d);let ok=ix.filter(x=>current.answers[x[1]+(DATA.review||[]).length]===x[0][2]).length;return '<div class="stat">'+badge(d)+'<b>'+ok+'/'+ix.length+'</b><small>acertos</small></div>'}).join('');let hist=s.attempts.map((a,i)=>'<details class="history"><summary>'+ (i+1)+'ª tentativa · '+new Date(a.date).toLocaleString('pt-BR')+' · '+a.score+'/10</summary><p>Revisão: '+a.reviewScore+'/'+(DATA.review||[]).length+'</p>'+all.map((q,j)=>'<p><b>'+(j+1)+'. '+esc(q[0])+'</b><br>'+badge(q[4])+' · Sua resposta: '+(a.answers[j]===null?'Sem resposta':labels[a.answers[j]])+' · Correta: '+labels[q[2]]+'<br>'+esc(q[3])+'</p>').join('')+'</details>').join('');el.innerHTML='<div class="eyebrow">Avaliação concluída</div><h1>Seu desempenho</h1><div class="stats"><div class="stat"><small>Primeira nota</small><b>'+first.score+'/10</b></div><div class="stat"><small>Melhor nota</small><b>'+best+'/10</b></div><div class="stat"><small>Última nota</small><b>'+current.score+'/10</b></div></div><h2>Acertos por dificuldade</h2><div class="stats">'+diffs+'</div><p><b>Revisão da aula anterior:</b> '+current.reviewScore+'/'+(DATA.review||[]).length+' (fora da nota principal).</p><h2>Histórico de tentativas</h2>'+hist+'<div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="retry()">Refazer prova (sem apagar histórico)</button></div>';} }function choose(j){if(!s.confirmed[s.q]){s.answers[s.q]=j;save();render()}}function previous(){if(s.q===0){go(DATA.sections.length)}else{s.q--;save();render()}}function advance(){if(s.answers[s.q]===null)return;if(!s.confirmed[s.q]){s.confirmed[s.q]=true;save();render();return}if(s.q===all.length-1){finish()}else{s.q++;save();render()}}render();</script><script id="study-guides-js">(function(){const GUIDE=["Condução de veículos oficiais e rotinas de serviço", [["Finalidade pública", "Veículo oficial deve ser utilizado conforme autorização e finalidade do serviço público, observadas as normas do órgão.", ["Finalidade pública"], "Antes de sair, confirme a missão e o destino autorizado.", "Observe a regra e confira o exemplo antes de responder."], ["Preparação da viagem", "Conferir documentação, condições do veículo, percurso, horários e passageiros, conforme a rotina institucional.", ["Preparação da viagem"], "Uma vistoria inicial reduz risco de falhas.", "Observe a regra e confira o exemplo antes de responder."], ["Registro de utilização", "Anotar quilometragem inicial/final, destino, horários, abastecimento, passageiros e ocorrências quando exigidos pelo controle.", ["Registro de utilização"], "Saída 12.450 km e retorno 12.482 km: percurso de 32 km.", "Observe a regra e confira o exemplo antes de responder."], ["Ocorrências", "Comunicar avarias, acidentes e irregularidades ao responsável, preservando a segurança e os registros.", ["Ocorrências"], "Ao identificar vazamento, interrompa uso inseguro e comunique.", "Observe a regra e confira o exemplo antes de responder."]]];function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const btn=document.createElement('button');btn.id='study-guide-launch';btn.type='button';btn.textContent='📖 Regras e exemplos';btn.setAttribute('aria-haspopup','dialog');const shade=document.createElement('div');shade.id='study-guide-shade';shade.innerHTML='<div id="study-guide-dialog" role="dialog" aria-modal="true" aria-label="Regras e exemplos"><div class="ghead"><div><h2>Regras e exemplos</h2><div class="gsub">'+e(GUIDE[0])+' · Consulta rápida para revisar a qualquer momento</div></div><button class="gclose" type="button">Fechar ✕</button></div>'+GUIDE[1].map((g,i)=>'<details '+(i===0?'open':'')+'><summary>'+e(g[0])+'</summary><div class="gbody"><p>'+e(g[1])+'</p><b>Termos e regras</b><div class="gterms">'+g[2].map(x=>'<span>'+e(x)+'</span>').join('')+'</div><b>Exemplo</b><div class="gexample">'+e(g[3])+'</div><div class="gtip"><b>Atenção:</b> '+e(g[4])+'</div></div></details>').join('')+'</div>';document.body.append(btn,shade);function close(){shade.classList.remove('open');btn.focus()}btn.addEventListener('click',()=>{shade.classList.add('open');shade.querySelector('.gclose').focus()});shade.querySelector('.gclose').addEventListener('click',close);shade.addEventListener('click',ev=>{if(ev.target===shade)close()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&shade.classList.contains('open'))close()});})();</script></body></html>
