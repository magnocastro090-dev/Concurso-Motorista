ght:900}.traffic{border-radius:15px;background:#252c2f;padding:10px;display:flex;flex-direction:column;gap:7px}.traffic i{width:24px;height:24px;border-radius:50%;background:#dd3a3a}.traffic i:nth-child(2){background:#f2b93c}.traffic i:nth-child(3){background:#32ad64}.tires>div{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}.tire{width:110px;height:50px;border:9px solid #30383b;border-radius:12px;background:linear-gradient(90deg,#666 0 28%,#db8c43 28% 72%,#666 72%)}.tire.edges{background:linear-gradient(90deg,#db8c43 0 28%,#666 28% 72%,#db8c43 72%)}.bar{background:#e3e8e6;border-radius:8px;height:28px;overflow:hidden}.bar span{display:block;height:100%;background:#087f78}.notice{font-size:13px;color:#536f70;border-left:3px solid #087f78;padding-left:12px}@media(max-width:600px){.stats{grid-template-columns:1fr}.card{padding:20px}.speed span{width:75px;height:75px;font-size:22px}}</style><style id="study-guides-css">#study-guide-launch{position:fixed;right:18px;bottom:18px;z-index:900;background:#145b57;color:#fff;border:0;border-radius:99px;padding:13px 18px;box-shadow:0 6px 22px #1238;cursor:pointer;font:600 14px system-ui}#study-guide-shade{position:fixed;inset:0;background:#091d24aa;z-index:999;display:none;align-items:center;justify-content:center;padding:14px}#study-guide-shade.open{display:flex}#study-guide-dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;color:#14343b;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0015;font:15px/1.55 system-ui}#study-guide-dialog h2{margin:0;font-size:24px}#study-guide-dialog .ghead{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:16px}#study-guide-dialog .gclose{border:0;border-radius:10px;background:#eaf0ed;padding:9px 13px;cursor:pointer}#study-guide-dialog details{border:1px solid #dce6e0;border-radius:12px;margin:10px 0;overflow:hidden}#study-guide-dialog summary{padding:14px;cursor:pointer;font-weight:750;background:#f4f8f5}#study-guide-dialog .gbody{padding:14px}#study-guide-dialog .gterms{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}#study-guide-dialog .gterms span{background:#e8f4ee;padding:5px 9px;border-radius:7px;font-size:13px}#study-guide-dialog .gexample{background:#f1f5f7;border-left:4px solid #2c827b;padding:10px 12px;border-radius:6px}#study-guide-dialog .gtip{color:#5c4d23;background:#fff7e2;padding:10px 12px;border-radius:8px;margin-top:9px}#study-guide-dialog .gsub{color:#657b7d;font-size:13px;margin-top:4px}@media(max-width:600px){#study-guide-launch{right:12px;bottom:12px;padding:11px 14px}#study-guide-dialog{padding:15px}}</style></head><body><header><div><strong>ROTA DA APROVAÇÃO</strong><small>Conhecimentos Específicos · Aula 02</small></div><a href="index.html">← Disciplinas</a></header><main><div class="progress"><span id="meter"></span></div><section class="card" id="app"></section></main><script>const DATA={"subject": "Conhecimentos Específicos", "title": "Direção defensiva e inspeção preventiva", "sections": [["Direção defensiva", "<p>Antecipar riscos é mais seguro que reagir no último instante. Considere visibilidade, chuva, distância de segurança, velocidade e condições do veículo.<\/p><div class=\"diagram horizontal\"><span>Observar<\/span><b>→<\/b><span>Prever<\/span><b>→<\/b><span>Agir com segurança<\/span><\/div>"], ["Pneus e calibragem", "<div class=\"tires\"><div><span class=\"tire\"><\/span><small>Desgaste central:<br>pressão excessiva<\/small><\/div><div><span class=\"tire edges\"><\/span><small>Desgaste nas bordas:<br>pressão insuficiente<\/small><\/div><\/div><p>Calibre conforme o manual do veículo e as condições de uso. A pressão inadequada pode prejudicar a aderência e o desgaste.<\/p>"], ["Verificações antes da saída", "<div class=\"diagram horizontal\"><span>Óleo<\/span><span>Pneus<\/span><span>Freios<\/span><span>Luzes<\/span><span>Arrefecimento<\/span><\/div><p>Verifique também documentos, combustível, possíveis vazamentos, espelhos e equipamentos obrigatórios. Se houver falha relevante de segurança, comunique e não coloque o veículo em circulação sem solução.<\/p>"], ["Ocorrências e veículo oficial", "<p>Registre quilometragem, percurso, horários, passageiros quando exigido, abastecimento e ocorrências conforme os procedimentos do órgão. Em pane, sinalize com segurança e solicite apoio apropriado.<\/p><div class=\"callout\">Primeiros socorros: proteja o local, acione os serviços de emergência e evite movimentar vítimas sem necessidade imediata ou orientação especializada.<\/div>"]], "questions": [["Qual atitude caracteriza direção defensiva?", ["Antecipar riscos", "Dirigir colado no veículo da frente", "Ignorar chuva", "Acelerar em cruzamentos", "Usar celular ao volante"], 0, "Direção defensiva busca prevenir acidentes por antecipação.", "Fácil"], ["Desgaste acentuado no centro da banda de rodagem pode indicar:", ["Pressão excessiva", "Pressão insuficiente", "Falta de combustível", "Farol queimado", "Bateria fraca"], 0, "Calibragem excessiva tende a concentrar desgaste no centro.", "Fácil"], ["Antes de sair, é adequado verificar:", ["Apenas a cor da carroceria", "Pneus, luzes e freios", "Somente rádio", "Apenas bancos", "Somente o relógio"], 1, "Inspeção preventiva inclui itens de segurança.", "Fácil"], ["Sob chuva intensa, a conduta mais segura é:", ["Aumentar velocidade", "Reduzir velocidade e ampliar distância", "Frear bruscamente sempre", "Desligar faróis", "Usar celular para avisar"], 1, "Chuva reduz visibilidade e aderência, exigindo adaptação.", "Intermediária"], ["Desgaste nas duas bordas da banda de rodagem pode indicar:", ["Pressão insuficiente", "Pressão excessiva", "Excesso de óleo", "Farol desregulado", "Tanque vazio"], 0, "Pneus com baixa pressão tendem a desgastar mais nas bordas.", "Intermediária"], ["Ao identificar vazamento importante no sistema de freios antes da saída, o motorista deve:", ["Seguir com cuidado", "Comunicar e impedir uso até avaliação", "Acelerar para testar", "Completar combustível", "Ignorar se o trajeto for curto"], 1, "Falhas de freio comprometem a segurança e exigem providências.", "Intermediária"], ["O registro de utilização do veículo oficial deve incluir, conforme rotinas do órgão:", ["Somente a cor do veículo", "Percurso, quilometragem e horários", "Somente nome do fabricante", "Apenas rádio sintonizado", "Somente temperatura externa"], 1, "O edital inclui percurso, quilometragem, horários e ocorrências.", "Intermediária"], ["Ao se aproximar de trecho alagado de profundidade desconhecida, a atitude defensiva é:", ["Acelerar para atravessar", "Evitar a travessia e buscar alternativa segura", "Seguir o veículo da frente sem avaliar", "Desligar os freios", "Usar o acostamento sempre"], 1, "Água pode ocultar riscos, causar perda de controle e danos mecânicos.", "Difícil"], ["Após acidente com vítima, qual conduta inicial é mais adequada para quem não tem treinamento de resgate?", ["Movimentar imediatamente a vítima", "Sinalizar/proteger o local e acionar emergência", "Oferecer água à vítima inconsciente", "Retirar capacete sem necessidade", "Abandonar o local sem comunicar"], 1, "Priorize segurança do local e socorro especializado; movimentação indevida pode agravar lesões.", "Difícil"], ["Em veículo oficial, uma irregularidade mecânica detectada durante o serviço deve ser:", ["Omitida se o veículo ainda anda", "Registrada e comunicada conforme rotina, adotando medidas de segurança", "Informada apenas no fim do ano", "Resolvida sempre pelo motorista sem capacitação", "Ignorada em percursos curtos"], 1, "Segurança, registro e comunicação de ocorrências integram a atuação profissional.", "Difícil"]], "id": "esp02", "number": "02", "review": [["Sem placa, qual limite de velocidade em via arterial urbana?", ["30", "40", "60", "80", "90"], 2, "CTB, art. 61: 60 km/h.", "Fácil"], ["O que significa a placa PARE?", ["Estacionar", "Parada obrigatória", "Velocidade livre", "Proibido pedestres", "Preferência irrestrita"], 1, "Placa R-1: parada obrigatória.", "Intermediária"]]};const KEY='rota-furb-'+DATA.id+'-v1';const all=[...(DATA.review||[]),...DATA.questions];const labels=['A','B','C','D','E'];let s=load();function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.attempts))return o}catch(e){}return {page:0,q:0,answers:Array(all.length).fill(null),confirmed:Array(all.length).fill(false),attempts:[],finished:false}}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function esc(t){return String(t).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function badge(d){return '<span class="difficulty '+esc(d)+'">'+esc(d)+'</span>'}function go(n){s.page=n;save();render();scrollTo(0,0)}function finish(){if(!s.finished){s.attempts.push({date:new Date().toISOString(),answers:[...s.answers],score:DATA.questions.reduce((v,q,i)=>v+(s.answers[i+(DATA.review||[]).length]===q[2]),0),reviewScore:(DATA.review||[]).reduce((v,q,i)=>v+(s.answers[i]===q[2]),0)});s.finished=true;}go(DATA.sections.length+2)}function retry(){s.answers=Array(all.length).fill(null);s.confirmed=Array(all.length).fill(false);s.q=0;s.finished=false;go(DATA.sections.length+1)}function render(){const el=document.getElementById('app');let p=s.page;document.getElementById('meter').style.width=(Math.min(p,DATA.sections.length+2)/(DATA.sections.length+2)*100)+'%';if(p===0){el.innerHTML='<div class="eyebrow">'+esc(DATA.subject)+' · Aula '+esc(DATA.number)+'</div><h1>'+esc(DATA.title)+'</h1><p class="muted">Aula em telas sequenciais, com explicações, exemplos e avaliação interativa.</p><div class="callout"><b>O que você vai estudar:</b> '+DATA.sections.map(x=>esc(x[0])).join(' · ')+'</div><p class="notice">Material autoral para estudo, não oficial da FURB. A dificuldade é estimativa pedagógica.</p><div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="go(1)">Começar aula →</button></div>';}else if(p<=DATA.sections.length){let a=DATA.sections[p-1];el.innerHTML='<div class="eyebrow">Conteúdo '+p+' de '+DATA.sections.length+'</div><h1>'+esc(a[0])+'</h1>'+a[1]+'<div class="actions"><button class="btn secondary" onclick="go('+(p-1)+')">← Voltar</button><button class="btn" onclick="go('+(p+1)+')">'+(p===DATA.sections.length?'Ir para avaliação':'Próxima tela')+' →</button></div>';}else if(p===DATA.sections.length+1){let i=s.q,q=all[i],isReview=i<(DATA.review||[]).length,confirmed=s.confirmed[i];let options=q[1].map((o,j)=>'<button class="option '+(confirmed&&j===q[2]?'correct':confirmed&&j===s.answers[i]?'wrong':!confirmed&&j===s.answers[i]?'selected':'')+'" '+(confirmed?'disabled':'')+' onclick="choose('+j+')"><b>'+labels[j]+')</b> '+esc(o)+(confirmed&&j===q[2]?' ✓':confirmed&&j===s.answers[i]?' ✕':'')+'</button>').join('');el.innerHTML='<div class="qhead"><div><b>Questão '+(i+1)+' de '+all.length+'</b><div class="muted">'+(isReview?'Revisão da aula anterior':'Conteúdo da aula atual')+'</div></div>'+badge(q[4])+'</div><h2>'+esc(q[0])+'</h2>'+options+(confirmed?'<div class="feedback '+(s.answers[i]===q[2]?'':'bad')+'"><b>'+(s.answers[i]===q[2]?'Resposta correta!':'Resposta incorreta.')+'</b>'+esc(q[3])+'</div>':'<p class="muted">Selecione uma alternativa e confirme para conferir a explicação.</p>')+'<div class="actions"><button class="btn secondary" onclick="previous()">← Voltar</button><button class="btn" '+(s.answers[i]===null?'disabled':'')+' onclick="advance()">'+(!confirmed?'Confirmar resposta':i===all.length-1?'Finalizar avaliação':'Próxima questão →')+'</button></div>';}else{const last=s.attempts[s.attempts.length-1],first=s.attempts[0],best=Math.max(...s.attempts.map(a=>a.score),0);const current=last||{score:0,reviewScore:0};let diffs=['Fácil','Intermediária','Difícil'].map(d=>{let ix=DATA.questions.map((q,i)=>[q,i]).filter(x=>x[0][4]===d);let ok=ix.filter(x=>current.answers[x[1]+(DATA.review||[]).length]===x[0][2]).length;return '<div class="stat">'+badge(d)+'<b>'+ok+'/'+ix.length+'</b><small>acertos</small></div>'}).join('');let hist=s.attempts.map((a,i)=>'<details class="history"><summary>'+ (i+1)+'ª tentativa · '+new Date(a.date).toLocaleString('pt-BR')+' · '+a.score+'/10</summary><p>Revisão: '+a.reviewScore+'/'+(DATA.review||[]).length+'</p>'+all.map((q,j)=>'<p><b>'+(j+1)+'. '+esc(q[0])+'</b><br>'+badge(q[4])+' · Sua resposta: '+(a.answers[j]===null?'Sem resposta':labels[a.answers[j]])+' · Correta: '+labels[q[2]]+'<br>'+esc(q[3])+'</p>').join('')+'</details>').join('');el.innerHTML='<div class="eyebrow">Avaliação concluída</div><h1>Seu desempenho</h1><div class="stats"><div class="stat"><small>Primeira nota</small><b>'+first.score+'/10</b></div><div class="stat"><small>Melhor nota</small><b>'+best+'/10</b></div><div class="stat"><small>Última nota</small><b>'+current.score+'/10</b></div></div><h2>Acertos por dificuldade</h2><div class="stats">'+diffs+'</div><p><b>Revisão da aula anterior:</b> '+current.reviewScore+'/'+(DATA.review||[]).length+' (fora da nota principal).</p><h2>Histórico de tentativas</h2>'+hist+'<div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="retry()">Refazer prova (sem apagar histórico)</button></div>';} }function choose(j){if(!s.confirmed[s.q]){s.answers[s.q]=j;save();render()}}function previous(){if(s.q===0){go(DATA.sections.length)}else{s.q--;save();render()}}function advance(){if(s.answers[s.q]===null)return;if(!s.confirmed[s.q]){s.confirmed[s.q]=true;save();render();return}if(s.q===all.length-1){finish()}else{s.q++;save();render()}}render();</script><script id="study-guides-js">(function(){const GUIDE=["Direção defensiva e inspeção", [["Direção defensiva", "Antecipar riscos e agir para evitar acidentes.", ["observação", "previsão", "decisão", "ação"], "Ao perceber pedestre próximo à faixa, reduza e prepare-se para parar.", "Antecipação é mais segura que reação tardia."], ["Pneus", "Calibragem, desgaste e estado geral afetam aderência.", ["pressão correta", "sulcos", "danos"], "Desgaste acentuado no centro da banda pode indicar excesso de pressão.", "Use a pressão recomendada pelo fabricante e verifique pneus frios quando indicado."], ["Freios", "Exigem inspeção e atenção a sinais anormais.", ["ruídos", "pedal", "vazamentos"], "Pedal com comportamento anormal exige avaliação antes de seguir viagem.", "Não improvise reparos em sistemas de segurança."], ["Luzes e sinalização", "Faróis, lanternas, setas e luzes de freio precisam funcionar.", ["farol", "seta", "freio", "lanterna"], "Antes de sair, verifique se a luz de freio acende.", "Inspeção visual é parte da rotina preventiva."], ["Chuva e baixa visibilidade", "Reduza velocidade e aumente distância.", ["aderência", "visibilidade", "aquaplanagem"], "Em pista molhada, evite manobras bruscas.", "A conduta deve se ajustar às condições reais da via."]]];function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const btn=document.createElement('button');btn.id='study-guide-launch';btn.type='button';btn.textContent='📖 Regras e exemplos';btn.setAttribute('aria-haspopup','dialog');const shade=document.createElement('div');shade.id='study-guide-shade';shade.innerHTML='<div id="study-guide-dialog" role="dialog" aria-modal="true" aria-label="Regras e exemplos"><div class="ghead"><div><h2>Regras e exemplos</h2><div class="gsub">'+e(GUIDE[0])+' · Consulta rápida para revisar a qualquer momento</div></div><button class="gclose" type="button">Fechar ✕</button></div>'+GUIDE[1].map((g,i)=>'<details '+(i===0?'open':'')+'><summary>'+e(g[0])+'</summary><div class="gbody"><p>'+e(g[1])+'</p><b>Termos e regras</b><div class="gterms">'+g[2].map(x=>'<span>'+e(x)+'</span>').join('')+'</div><b>Exemplo</b><div class="gexample">'+e(g[3])+'</div><div class="gtip"><b>Atenção:</b> '+e(g[4])+'</div></div></details>').join('')+'</div>';document.body.append(btn,shade);function close(){shade.classList.remove('open');btn.focus()}btn.addEventListener('click',()=>{shade.classList.add('open');shade.querySelector('.gclose').focus()});shade.querySelector('.gclose').addEventListener('click',close);shade.addEventListener('click',ev=>{if(ev.target===shade)close()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&shade.classList.contains('open'))close()});})();</script></body></html>
