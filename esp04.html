fic{border-radius:15px;background:#252c2f;padding:10px;display:flex;flex-direction:column;gap:7px}.traffic i{width:24px;height:24px;border-radius:50%;background:#dd3a3a}.traffic i:nth-child(2){background:#f2b93c}.traffic i:nth-child(3){background:#32ad64}.tires>div{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}.tire{width:110px;height:50px;border:9px solid #30383b;border-radius:12px;background:linear-gradient(90deg,#666 0 28%,#db8c43 28% 72%,#666 72%)}.tire.edges{background:linear-gradient(90deg,#db8c43 0 28%,#666 28% 72%,#db8c43 72%)}.bar{background:#e3e8e6;border-radius:8px;height:28px;overflow:hidden}.bar span{display:block;height:100%;background:#087f78}.notice{font-size:13px;color:#536f70;border-left:3px solid #087f78;padding-left:12px}@media(max-width:600px){.stats{grid-template-columns:1fr}.card{padding:20px}.speed span{width:75px;height:75px;font-size:22px}}</style><style id="study-guides-css">#study-guide-launch{position:fixed;right:18px;bottom:18px;z-index:900;background:#145b57;color:#fff;border:0;border-radius:99px;padding:13px 18px;box-shadow:0 6px 22px #1238;cursor:pointer;font:600 14px system-ui}#study-guide-shade{position:fixed;inset:0;background:#091d24aa;z-index:999;display:none;align-items:center;justify-content:center;padding:14px}#study-guide-shade.open{display:flex}#study-guide-dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;color:#14343b;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0015;font:15px/1.55 system-ui}#study-guide-dialog h2{margin:0;font-size:24px}#study-guide-dialog .ghead{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:16px}#study-guide-dialog .gclose{border:0;border-radius:10px;background:#eaf0ed;padding:9px 13px;cursor:pointer}#study-guide-dialog details{border:1px solid #dce6e0;border-radius:12px;margin:10px 0;overflow:hidden}#study-guide-dialog summary{padding:14px;cursor:pointer;font-weight:750;background:#f4f8f5}#study- rque em local seguro e atenção especial a pessoas com mobilidade reduzida. O uso de cinto pelo passageiro do banco traseiro também é obrigatório, ressalvadas as exceções regulamentares.</p><div class=\"example\"><b>Situação prática</b><p>Um passageiro solicita saída em local proibido e perigoso: procure um ponto permitido e seguro, explicando o motivo.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Não confunda conveniência do passageiro com autorização para descumprir regra de trânsito.</div><p><b>Correspondência com o programa:</b> CTB, arts. 65 e 167; regras de parada e estacionamento.</p>"], ["2. Embarque, desembarque e bagagens", "<p>Antes de abrir portas, observe ciclistas, motociclistas e veículos que passam ao lado. Evite desembarque para o lado de fluxo intenso quando houver alternativa segura. Bagagens e objetos não devem obstruir a visão, os comandos ou as saídas; cargas soltas podem ser projetadas em uma frenagem.</p><div class=\"example\"><b>Situação prática</b><p>Uma pasta pesada está sobre o banco traseiro sem fixação. Em uma frenagem brusca ela pode atingir o ocupante: acondicione-a adequadamente antes de sair.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Não é suficiente estar dentro do veículo: o material precisa estar distribuído e seguro.</div><p><b>Correspondência com o programa:</b> CTB, normas gerais de circulação e transporte.</p>"], ["3. Transporte de materiais e equipamentos", "<p>Confira tipo de carga, dimensões, peso, fixação e compatibilidade com o veículo. Materiais frágeis devem receber proteção; líquidos e equipamentos que possam vazar exigem embalagem apropriada. Não exceda a capacidade prevista pelo fabricante e não comprometa estabilidade, direção ou frenagem.</p><div class=\"example\"><b>Situação prática</b><p>Um equipamento pesado colocado apenas em um lado do compartimento pode prejudicar o equilíbrio em curvas. Redistribua e fixe a carga.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Carga pequena em volume pode ser pesada; volume e massa são grandezas distintas.</div><p><b>Correspondência com o programa:</b> CTB, arts. 99, 100 e regras aplicáveis ao transporte de carga.</p>"], ["4. Distribuição de peso e comportamento do veículo", "<p>O centro de gravidade e a distribuição de carga influenciam estabilidade e frenagem. Peso excessivo aumenta a distância necessária para parar e pode sobrecarregar pneus, suspensão e freios. Curvas, descidas e chuva exigem redução preventiva de velocidade.</p><div class=\"example\"><b>Situação prática</b><p>Com o veículo carregado, antecipe a frenagem antes da curva; não espere chegar à curva para frear bruscamente.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> O limite de velocidade da placa não significa que seja seguro mantê-lo com qualquer carga ou clima.</div><p><b>Correspondência com o programa:</b> CTB, art. 28 e regras de segurança.</p>"], ["5. Checklist de viagem com passageiros", "<p>Faça inspeção externa, confira pneus, luzes, espelhos, combustível, documentação, destino, rota e condições de embarque. Registre saída e quilometragem conforme rotina institucional. Ao chegar, confira desembarque, pertences e eventuais ocorrências.</p><div class=\"example\"><b>Situação prática</b><p>Se a luz de freio não funciona, registre a irregularidade e comunique o responsável antes de prosseguir com o veículo inseguro.</p></div><div class=\"callout\"><b>Erro frequente em prova:</b> Checklist não é burocracia dispensável: antecipa riscos e cria rastreabilidade.</div><p><b>Correspondência com o programa:</b> Edital: inspeção diária, registro de utilização e segurança.</p>"]], "questions": [["Antes do transporte, deve-se verificar:", ["lotação e cintos", "apenas o rádio", "Nenhuma das alternativas anteriores", "Ambas as alternativas anteriores", "Não é possível determinar"], 0, "Resposta: lotação e cintos. Consulte a explicação e o exemplo apresentados na aula.", "Fácil"], ["Equipamentos soltos podem:", ["melhorar a estabilidade", "deslocar-se em frenagem", "Nenhuma das alternativas anteriores", "Ambas as alternativas anteriores", "Não é possível determinar"], 1, "Resposta: deslocar-se em frenagem. Consulte a explicação e o exemplo apresentados na aula.", "Fácil"], ["A sobrecarga pode prejudicar:", ["frenagem", "visibilidade do painel apenas", "Nenhuma das alternativas anteriores", "Ambas as alternativas anteriores", "Não é possível determinar"], 0, "Resposta: frenagem. Consulte a explicação e o exemplo apresentados na aula.", "Fácil"], ["O transporte seguro exige:", ["carga sem amarração", "fixação adequada de materiais", "Nenhuma das alternativas anteriores", "Ambas as alternativas anteriores", "Não é possível determinar"], 1, "Resposta: fixação adequada de materiais. Consulte a explicação e o exemplo apresentados na aula.", "Intermediária"], ["No veículo oficial, registra-se:", ["percurso e quilometragem", "apenas cor do carro", "Nenhuma das alternativas anteriores", "Ambas as alternativas anteriores", "Não é possível determinar"], 0, "Resposta: percurso e quilometragem. Consulte a explicação e o exemplo apresentados na aula.", "Intermediária"], ["A carga pode bloquear a visão do motorista?", ["Sim", "Não", "Nenhuma das alternativas anteriores", "Ambas as alternativas anteriores", "Não é possível determinar"], 1, "Resposta: Não. Consulte a explicação e o exemplo apresentados na aula.", "Intermediária"], ["O número de passageiros deve respeitar:", ["lotação permitida", "preferência do motorista", "Nenhuma das alternativas anteriores", "Ambas as alternativas anteriores", "Não é possível determinar"], 0, "Resposta: lotação permitida. Consulte a explicação e o exemplo apresentados na aula.", "Intermediária"], ["O acondicionamento da carga deve preservar:", ["apenas a aparência", "estabilidade do veículo", "Nenhuma das alternativas anteriores", "Ambas as alternativas anteriores", "Não é possível determinar"], 1, "Resposta: estabilidade do veículo. Consulte a explicação e o exemplo apresentados na aula.", "Difícil"], ["Ocorrências no transporte oficial devem ser:", ["registradas e comunicadas", "ignoradas", "Nenhuma das alternativas anteriores", "Ambas as alternativas anteriores", "Não é possível determinar"], 0, "Resposta: registradas e comunicadas. Consulte a explicação e o exemplo apresentados na aula.", "Difícil"], ["A distribuição de peso deve observar:", ["somente a distância da viagem", "limites do veículo", "Nenhuma das alternativas anteriores", "Ambas as alternativas anteriores", "Não é possível determinar"], 1, "Resposta: limites do veículo. Consulte a explicação e o exemplo apresentados na aula.", "Difícil"]], "id": "esp04", "number": "04", "review": [["Multa é classificada como:", ["penalidade", "medida administrativa", "Não sei", "Ambas", "Nenhuma"], 0, "Revisão: penalidade", "Fácil"], ["Remoção do veículo é:", ["medida administrativa", "penalidade", "Não sei", "Ambas", "Nenhuma"], 0, "Revisão: medida administrativa", "Fácil"]]};const KEY='rota-furb-'+DATA.id+'-v1';const all=[...(DATA.review||[]),...DATA.questions];const labels=['A','B','C','D','E'];let s=load();function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.attempts))return o}catch(e){}return {page:0,q:0,answers:Array(all.length).fill(null),confirmed:Array(all.length).fill(false),attempts:[],finished:false}}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function esc(t){return String(t).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function badge(d){return '<span class="difficulty '+esc(d)+'">'+esc(d)+'</span>'}function go(n){s.page=n;save();render();scrollTo(0,0)}function finish(){if(!s.finished){s.attempts.push({date:new Date().toISOString(),answers:[...s.answers],score:DATA.questions.reduce((v,q,i)=>v+(s.answers[i+(DATA.review||[]).length]===q[2]),0),reviewScore:(DATA.review||[]).reduce((v,q,i)=>v+(s.answers[i]===q[2]),0)});s.finished=true;}go(DATA.sections.length+2)}function retry(){s.answers=Array(all.length).fill(null);s.confirmed=Array(all.length).fill(false);s.q=0;s.finished=false;go(DATA.sections.length+1)}function render(){const el=document.getElementById('app');let p=s.page;document.getElementById('meter').style.width=(Math.min(p,DATA.sections.length+2)/(DATA.sections.length+2)*100)+'%';if(p===0){el.innerHTML='<div class="eyebrow">'+esc(DATA.subject)+' · Aula '+esc(DATA.number)+'</div><h1>'+esc(DATA.title)+'</h1><p class="muted">Aula em telas sequenciais, com explicações, exemplos e avaliação interativa.</p><div class="callout"><b>O que você vai estudar:</b> '+DATA.sections.map(x=>esc(x[0])).join(' · ')+'</div><p class="notice">Material autoral para estudo, não oficial da FURB. A dificuldade é estimativa pedagógica.</p><div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="go(1)">Começar aula →</button></div>';}else if(p<=DATA.sections.length){let a=DATA.sections[p-1];el.innerHTML='<div class="eyebrow">Conteúdo '+p+' de '+DATA.sections.length+'</div><h1>'+esc(a[0])+'</h1>'+a[1]+'<div class="actions"><button class="btn secondary" onclick="go('+(p-1)+')">← Voltar</button><button class="btn" onclick="go('+(p+1)+')">'+(p===DATA.sections.length?'Ir para avaliação':'Próxima tela')+' →</button></div>';}else if(p===DATA.sections.length+1){let i=s.q,q=all[i],isReview=i<(DATA.review||[]).length,confirmed=s.confirmed[i];let options=q[1].map((o,j)=>'<button class="option '+(confirmed&&j===q[2]?'correct':confirmed&&j===s.answers[i]?'wrong':!confirmed&&j===s.answers[i]?'selected':'')+'" '+(confirmed?'disabled':'')+' onclick="choose('+j+')"><b>'+labels[j]+')</b> '+esc(o)+(confirmed&&j===q[2]?' ✓':confirmed&&j===s.answers[i]?' ✕':'')+'</button>').join('');el.innerHTML='<div class="qhead"><div><b>Questão '+(i+1)+' de '+all.length+'</b><div class="muted">'+(isReview?'Revisão da aula anterior':'Conteúdo da aula atual')+'</div></div>'+badge(q[4])+'</div><h2>'+esc(q[0])+'</h2>'+options+(confirmed?'<div class="feedback '+(s.answers[i]===q[2]?'':'bad')+'"><b>'+(s.answers[i]===q[2]?'Resposta correta!':'Resposta incorreta.')+'</b>'+esc(q[3])+'</div>':'<p class="muted">Selecione uma alternativa e confirme para conferir a explicação.</p>')+'<div class="actions"><button class="btn secondary" onclick="previous()">← Voltar</button><button class="btn" '+(s.answers[i]===null?'disabled':'')+' onclick="advance()">'+(!confirmed?'Confirmar resposta':i===all.length-1?'Finalizar avaliação':'Próxima questão →')+'</button></div>';}else{const last=s.attempts[s.attempts.length-1],first=s.attempts[0],best=Math.max(...s.attempts.map(a=>a.score),0);const current=last||{score:0,reviewScore:0};let diffs=['Fácil','Intermediária','Difícil'].map(d=>{let ix=DATA.questions.map((q,i)=>[q,i]).filter(x=>x[0][4]===d);let ok=ix.filter(x=>current.answers[x[1]+(DATA.review||[]).length]===x[0][2]).length;return '<div class="stat">'+badge(d)+'<b>'+ok+'/'+ix.length+'</b><small>acertos</small></div>'}).join('');let hist=s.attempts.map((a,i)=>'<details class="history"><summary>'+ (i+1)+'ª tentativa · '+new Date(a.date).toLocaleString('pt-BR')+' · '+a.score+'/10</summary><p>Revisão: '+a.reviewScore+'/'+(DATA.review||[]).length+'</p>'+all.map((q,j)=>'<p><b>'+(j+1)+'. '+esc(q[0])+'</b><br>'+badge(q[4])+' · Sua resposta: '+(a.answers[j]===null?'Sem resposta':labels[a.answers[j]])+' · Correta: '+labels[q[2]]+'<br>'+esc(q[3])+'</p>').join('')+'</details>').join('');el.innerHTML='<div class="eyebrow">Avaliação concluída</div><h1>Seu desempenho</h1><div class="stats"><div class="stat"><small>Primeira nota</small><b>'+first.score+'/10</b></div><div class="stat"><small>Melhor nota</small><b>'+best+'/10</b></div><div class="stat"><small>Última nota</small><b>'+current.score+'/10</b></div></div><h2>Acertos por dificuldade</h2><div class="stats">'+diffs+'</div><p><b>Revisão da aula anterior:</b> '+current.reviewScore+'/'+(DATA.review||[]).length+' (fora da nota principal).</p>
