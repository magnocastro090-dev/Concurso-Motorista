t-weight:900}.traffic{border-radius:15px;background:#252c2f;padding:10px;display:flex;flex-direction:column;gap:7px}.traffic i{width:24px;height:24px;border-radius:50%;background:#dd3a3a}.traffic i:nth-child(2){background:#f2b93c}.traffic i:nth-child(3){background:#32ad64}.tires>div{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}.tire{width:110px;height:50px;border:9px solid #30383b;border-radius:12px;background:linear-gradient(90deg,#666 0 28%,#db8c43 28% 72%,#666 72%)}.tire.edges{background:linear-gradient(90deg,#db8c43 0 28%,#666 28% 72%,#db8c43 72%)}.bar{background:#e3e8e6;border-radius:8px;height:28px;overflow:hidden}.bar span{display:block;height:100%;background:#087f78}.notice{font-size:13px;color:#536f70;border-left:3px solid #087f78;padding-left:12px}@media(max-width:600px){.stats{grid-template-columns:1fr}.card{padding:20px}.speed span{width:75px;height:75px;font-size:22px}}</style><style id="study-guides-css">#study-guide-launch{position:fixed;right:18px;bottom:18px;z-index:900;background:#145b57;color:#fff;border:0;border-radius:99px;padding:13px 18px;box-shadow:0 6px 22px #1238;cursor:pointer;font:600 14px system-ui}#study-guide-shade{position:fixed;inset:0;background:#091d24aa;z-index:999;display:none;align-items:center;justify-content:center;padding:14px}#study-guide-shade.open{display:flex}#study-guide-dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;color:#14343b;border-radius:18px;padding:22px;box-shadow:0 20px 70px #0015;font:15px/1.55 system-ui}#study-guide-dialog h2{margin:0;font-size:24px}#study-guide-dialog .ghead{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:16px}#study-guide-dialog .gclose{border:0;border-radius:10px;background:#eaf0ed;padding:9px 13px;cursor:pointer}#study-guide-dialog details{border:1px solid #dce6e0;border-radius:12px;margin:10px 0;overflow:hidden}#study-guide-dialog summary{padding:14px;cursor:pointer;font-weight:750;background:#f4f8f5}#study-guide-dialog .gbody{padding:14px}#study-guide-dialog .gterms{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}#study-guide-dialog .gterms span{background:#e8f4ee;padding:5px 9px;border-radius:7px;font-size:13px}#study-guide-dialog .gexample{background:#f1f5f7;border-left:4px solid #2c827b;padding:10px 12px;border-radius:6px}#study-guide-dialog .gtip{color:#5c4d23;background:#fff7e2;padding:10px 12px;border-radius:8px;margin-top:9px}#study-guide-dialog .gsub{color:#657b7d;font-size:13px;margin-top:4px}@media(max-width:600px){#study-guide-launch{right:12px;bottom:12px;padding:11px 14px}#study-guide-dialog{padding:15px}}</style><style id="math-teaching-style">.math-frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;margin:0 .14em;font-variant-numeric:tabular-nums;font-size:1.08em}.math-frac .math-top{padding:0 .2em .12em;border-bottom:1.7px solid currentColor;min-width:1.2em;text-align:center}.math-frac .math-bottom{padding:.12em .2em 0;text-align:center}.math-step{background:#f2f7ff;border:1px solid #dbe8fa;border-radius:13px;padding:16px;margin:14px 0;color:#1e293b}.math-step p{margin:10px 0}.math-calc{font:600 1.1rem/1.4 ui-monospace,monospace;white-space:pre;overflow-x:auto}.math-step .math-frac{font-size:1.3em}.math-hint{font-size:.86rem;color:#475569;margin:8px 0}</style><style id="math-worked-css">.worked{font-size:16px;line-height:1.75}.worked h3{font-size:17px;line-height:1.4;margin:20px 0 7px;color:#115b59}.worked p{margin:8px 0 14px}.mathfrac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;min-width:1.25em;margin:0 .13em;font-variant-numeric:tabular-nums}.mathfrac>span:first-child{border-bottom:1.7px solid currentColor;padding:0 .2em .14em}.mathfrac>span:last-child{padding:.14em .2em 0}.selected-explanation{background:#fff7df;padding:12px;border-radius:10px;border-left:4px solid #b58321}.feedback{overflow-wrap:anywhere}.worked .mathfrac{font-size:1.12em}</style></head><body><header><div><strong>ROTA DA APROVAÇÃO</strong><small>Raciocínio Lógico e Matemático · Aula 02</small></div><a href="index.html">← Disciplinas</a></header><main><div class="progress"><span id="meter"></span></div><section class="card" id="app"></section></main><script>const DATA={"subject": "Raciocínio Lógico e Matemático", "title": "Razão, proporção, regra de três e porcentagem", "sections": [["Razão e proporção", "<p>Razão compara grandezas: 2 carros para 3 motos corresponde a 2:3. Proporção é a igualdade entre duas razões.</p><div class=\"example\">2/3 = 4/6, pois ambos representam a mesma proporção.</div><div class=\"example\"><b>Como estudar este tópico</b><p>Leia a explicação de <b>razão e proporção</b> e identifique qual regra, definição ou relação matemática está sendo utilizada. Em seguida, elabore um exemplo próprio e explique por que ele se enquadra nessa regra. Se o exercício apresentar um caso diferente, compare as condições do enunciado antes de responder.</p></div><div class=\"callout\"><b>Autoverificação:</b> Você consegue justificar a solução sem consultar o gabarito? Se não, retome a explicação e procure um segundo exemplo do mesmo assunto.</div>"], ["Regra de três simples", "<p>Se duas grandezas crescem juntas na mesma proporção, temos proporcionalidade direta. Se uma cresce e outra diminui, pode ser inversa.</p><div class=\"example\">3 litros custam R$ 18; 5 litros custam 18 × 5/3 = R$ 30.</div><div class=\"example\"><b>Como estudar este tópico</b><p>Leia a explicação de <b>regra de três simples</b> e identifique qual regra, definição ou relação matemática está sendo utilizada. Em seguida, elabore um exemplo próprio e explique por que ele se enquadra nessa regra. Se o exercício apresentar um caso diferente, compare as condições do enunciado antes de responder.</p></div><div class=\"callout\"><b>Autoverificação:</b> Você consegue justificar a solução sem consultar o gabarito? Se não, retome a explicação e procure um segundo exemplo do mesmo assunto.</div>"], ["Porcentagem visual", "<div class=\"bar\"><span style=\"width:25%\"></span></div><p>25% corresponde a 25 de cada 100, isto é, 1/4. Para calcular 15% de 200: 0,15 × 200 = 30.</p><div class=\"example\"><b>Como estudar este tópico</b><p>Leia a explicação de <b>porcentagem visual</b> e identifique qual regra, definição ou relação matemática está sendo utilizada. Em seguida, elabore um exemplo próprio e explique por que ele se enquadra nessa regra. Se o exercício apresentar um caso diferente, compare as condições do enunciado antes de responder.</p></div><div class=\"callout\"><b>Autoverificação:</b> Você consegue justificar a solução sem consultar o gabarito? Se não, retome a explicação e procure um segundo exemplo do mesmo assunto.</div>"], ["Armadilhas da prova", "<p>Desconto e aumento consecutivos não se anulam necessariamente. Um desconto de 10% seguido de aumento de 10% sobre o novo preço resulta em 99% do valor original.</p><div class=\"example\"><b>Como estudar este tópico</b><p>Leia a explicação de <b>armadilhas da prova</b> e identifique qual regra, definição ou relação matemática está sendo utilizada. Em seguida, elabore um exemplo próprio e explique por que ele se enquadra nessa regra. Se o exercício apresentar um caso diferente, compare as condições do enunciado antes de responder.</p></div><div class=\"callout\"><b>Autoverificação:</b> Você consegue justificar a solução sem consultar o gabarito? Se não, retome a explicação e procure um segundo exemplo do mesmo assunto.</div>"], ["Razões e proporções: montagem", "<p>Uma razão compara grandezas por divisão. Uma proporção é a igualdade entre duas razões.</p><div class=\"math-step\"><b>Exemplo</b><p>2/3 = 4/6</p><p>Multiplicação cruzada: 2 × 6 = 12 e 3 × 4 = 12. Como os produtos são iguais, há proporção.</p></div><p><b>Divisão em partes proporcionais:</b> para dividir R$ 150 na razão 2:3, some as partes (2 + 3 = 5), calcule 150 ÷ 5 = 30 e distribua: 2 × 30 = R$ 60; 3 × 30 = R$ 90.</p>"], ["Regra de três simples: passo a passo", "<div class=\"math-step\"><b>Direta</b><p>3 litros custam R$ 18. Quanto custam 5 litros?</p><p>3/5 = 18/x</p><p>3 × x = 5 × 18 = 90 → x = 90 ÷ 3 = R$ 30.</p></div><div class=\"math-step\"><b>Inversa</b><p>4 trabalhadores realizam um serviço em 6 dias. Com 8 trabalhadores, no mesmo ritmo, quantos dias?</p><p>4 × 6 = 8 × x → 24 = 8x → x = 3 dias.</p><p>Mais trabalhadores, menos dias, mantendo o mesmo trabalho e produtividade.</p></div><div class=\"example\"><b>Como estudar este tópico</b><p>Leia a explicação de <b>regra de três simples: passo a passo</b> e identifique qual regra, definição ou relação matemática está sendo utilizada. Em seguida, elabore um exemplo próprio e explique por que ele se enquadra nessa regra. Se o exercício apresentar um caso diferente, compare as condições do enunciado antes de responder.</p></div><div class=\"callout\"><b>Autoverificação:</b> Você consegue justificar a solução sem consultar o gabarito? Se não, retome a explicação e procure um segundo exemplo do mesmo assunto.</div>"], ["Porcentagem: o que significa", "<p>Porcentagem é uma razão de denominador 100. Por exemplo, 25% = 25/100 = 1/4.</p><div class=\"math-step\"><b>15% de 200</b><p>15/100 × 200 = 30.</p><p><b>Aumento de 20%:</b> R$ 100 + R$ 20 = R$ 120.</p><p><b>Desconto de 20% sobre R$ 120:</b> R$ 120 − R$ 24 = R$ 96. Portanto, aumento e desconto de 20% não se anulam.</p></div><div class=\"example\"><b>Como estudar este tópico</b><p>Leia a explicação de <b>porcentagem: o que significa</b> e identifique qual regra, definição ou relação matemática está sendo utilizada. Em seguida, elabore um exemplo próprio e explique por que ele se enquadra nessa regra. Se o exercício apresentar um caso diferente, compare as condições do enunciado antes de responder.</p></div><div class=\"callout\"><b>Autoverificação:</b> Você consegue justificar a solução sem consultar o gabarito? Se não, retome a explicação e procure um segundo exemplo do mesmo assunto.</div>"]], "questions": [["Quanto é 10% de 250?", ["15", "20", "25", "30", "35"], 2, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>10% significa dez de cada cem: <span class=\"mathfrac\" aria-label=\"10 sobre 100\"><span>10</span><span>100</span></span>.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>250 × <span class=\"mathfrac\" aria-label=\"10 sobre 100\"><span>10</span><span>100</span></span> = <span class=\"mathfrac\" aria-label=\"2500 sobre 100\"><span>2500</span><span>100</span></span> = 25.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>10% é um décimo do total.</p></div>", "Fácil"], ["A razão entre 2 e 5 pode ser escrita como:", ["2/5", "5/2", "2+5", "5−2", "2×5"], 0, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>A razão entre 2 e 5 é o primeiro número dividido pelo segundo.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>2:5 = <span class=\"mathfrac\" aria-label=\"2 sobre 5\"><span>2</span><span>5</span></span>. O 2 fica no numerador e o 5 no denominador.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Inverter a ordem produz <span class=\"mathfrac\" aria-label=\"5 sobre 2\"><span>5</span><span>2</span></span>, que é outra razão.</p></div>", "Fácil"], ["Se 4 cadernos custam R$ 20, quanto custam 2?", ["R$ 5", "R$ 8", "R$ 10", "R$ 12", "R$ 15"], 2, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Com o mesmo preço por caderno, o custo é proporcional à quantidade.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>20 ÷ 4 = R$ 5 por caderno. Para 2: 2 × 5 = R$ 10.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Metade dos cadernos custa metade do preço.</p></div>", "Fácil"], ["Um produto de R$ 80 recebe desconto de 15%. Qual o preço final?", ["R$ 65", "R$ 66", "R$ 68", "R$ 70", "R$ 72"], 2, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>15% de 80 é a parte retirada do preço original.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>80 × <span class=\"mathfrac\" aria-label=\"15 sobre 100\"><span>15</span><span>100</span></span> = R$ 12 de desconto. Preço final = 80 − 12 = R$ 68.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>O desconto não é o preço final.</p></div>", "Intermediária"], ["Se 6 litros permitem percorrer 72 km, quantos quilômetros são percorridos com 10 litros, no mesmo consumo?", ["100", "110", "120", "130", "140"], 2, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>O consumo por litro permanece constante, então as grandezas são diretamente proporcionais.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>72 ÷ 6 = 12 km por litro. Com 10 litros: 12 × 10 = 120 km.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Mais litros permitem percorrer mais quilômetros no mesmo consumo.</p></div>", "Intermediária"], ["Em uma turma, 12 de 30 alunos faltaram. Qual a porcentagem de faltas?", ["30%", "35%", "40%", "45%", "50%"], 2, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>O total da turma é 30; o número de faltas é 12.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p><span class=\"mathfrac\" aria-label=\"12 sobre 30\"><span>12</span><span>30</span></span> = 0,4. Multiplicando por 100: 0,4 × 100 = 40%.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>O denominador deve ser o total de alunos, não o número de presentes.</p></div>", "Intermediária"], ["Uma mistura usa 2 partes de água para 3 de outro líquido. Em 25 litros, quantos litros são de água?", ["8", "10", "12", "15", "18"], 1, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>A mistura tem 2 partes de água e 3 do outro líquido: 5 partes ao todo.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>25 ÷ 5 = 5 litros por parte. Água = 2 × 5 = 10 litros.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>A fração de água é <span class=\"mathfrac\" aria-label=\"2 sobre 5\"><span>2</span><span>5</span></span> do total, não <span class=\"mathfrac\" aria-label=\"2 sobre 3\"><span>2</span><span>3</span></span>.</p></div>", "Intermediária"], ["Após aumento de 20%, uma taxa passou a R$ 144. Qual era o valor antes do aumento?", ["R$ 115", "R$ 118", "R$ 120", "R$ 124", "R$ 125"], 2, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>O valor final é 120% do original, não 80%.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>Se o original é x: 1,20 × x = 144. Logo x = 144 ÷ 1,20 = R$ 120.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não subtraia 20% de 144: o percentual foi aplicado ao valor anterior.</p></div>", "Difícil"], ["Quatro funcionários executam um serviço em 6 dias, com igual produtividade. Em quantos dias seis funcionários fariam o mesmo serviço?", ["3", "4", "5", "8", "9"], 1, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>Mais funcionários, com igual produtividade, fazem o mesmo trabalho em menos dias.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>Trabalho total: 4 × 6 = 24 funcionário-dias. Com 6 funcionários: 24 ÷ 6 = 4 dias.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Não aplique regra de três direta quando uma grandeza aumenta e a outra diminui.</p></div>", "Difícil"], ["Um valor aumenta 25% e depois diminui 20%. Em relação ao valor inicial, o resultado é:", ["20% menor", "5% menor", "Igual", "5% maior", "20% maior"], 2, "<div class=\"worked\"><h3>1. O que precisamos identificar</h3><p>O segundo percentual incide sobre o valor já aumentado, não sobre o valor inicial.</p><h3>2. Resolução, com o motivo de cada etapa</h3><p>Use R$ 100 como exemplo: 100 × 1,25 = 125; depois 125 × 0,80 = 100. Resultado igual ao inicial.</p><h3>3. Por que a alternativa escolhida pode estar errada?</h3><p class=\"selected-explanation\"></p><h3>4. Regra para lembrar</h3><p>Aumento de 25% e redução de 20% se compensam neste caso porque as bases são diferentes.</p></div>", "Difícil"]], "id": "mat02", "number": "02", "review": [["Quanto é 1/2 + 1/4?", ["1/4", "2/4", "3/4", "1", "5/4"], 2, "<div class=\"worked\"><h3>1. O que a questão pede?</h3><p>Somar <span class=\"mathfrac\"><span>1</span><span>2</span></span> com <span class=\"mathfrac\"><span>1</span><span>4</span></span>. A primeira fração representa metade de um inteiro; a segunda representa um quarto desse mesmo inteiro.</p><h3>2. Por que igualar os denominadores?</h3><p>Metades e quartos são partes de tamanhos diferentes. Para somá-las, precisamos expressar ambas usando partes iguais. Escolhemos 4 porque ele é múltiplo de 2 e de 4.</p><h3>3. Como transformar a metade em quartos?</h3><p>Multiplicamos o numerador e o denominador por 2: <span class=\"mathfrac\"><span>1</span><span>2</span></span> = <span class=\"mathfrac\"><span>1 × 2</span><span>2 × 2</span></span> = <span class=\"mathfrac\"><span>2</span><span>4</span></span>. Multiplicar em cima e embaixo pelo mesmo número não muda o valor da fração, pois equivale a multiplicar por 1.</p><h3>4. Como realizar a soma?</h3><p>Agora as duas frações estão em quartos: <span class=\"mathfrac\"><span>2</span><span>4</span></span> + <span class=\"mathfrac\"><span>1</span><span>4</span></span> = <span class=\"mathfrac\"><span>2 + 1</span><span>4</span></span> = <strong><span class=\"mathfrac\"><span>3</span><span>4</span></span></strong>. Somamos apenas os numeradores, porque o inteiro continua dividido em quatro partes iguais.</p><h3>5. Por que a alternativa escolhida não é o resultado?</h3><p>A resposta correta é <strong>3/4</strong>. Se você escolheu 2/4, parou na conversão da metade e esqueceu de acrescentar 1/4. Se escolheu 1/4, considerou apenas a segunda parcela. Se escolheu 1 ou 5/4, somou quantidades que não correspondem à operação apresentada.</p><p class=\"selected-explanation\"></p><h3>Regra para memorizar</h3><p>Na adição de frações com denominadores diferentes: encontre um denominador comum, transforme as frações sem mudar seu valor e só então some os numeradores. O denominador comum permanece igual.</p></div>", "Fácil"], ["Quanto é −5 + 12?", ["−17", "−7", "7", "17", "5"], 2, "<div class=\"worked\"><h3>1. O que significa a operação?</h3><p>Em −5 + 12, começamos cinco unidades abaixo de zero e acrescentamos doze unidades positivas.</p><h3>2. Como calcular?</h3><p>Os sinais são diferentes. Primeiro comparamos os valores absolutos: 12 é maior que 5. Subtraímos 12 − 5 = 7.</p><h3>3. Qual sinal usar e por quê?</h3><p>O valor de maior módulo é +12, por isso o resultado fica positivo: <strong>−5 + 12 = +7</strong>.</p><h3>4. Como conferir?</h3><p>Imagine uma dívida de R$ 5 e o recebimento de R$ 12. Depois de pagar a dívida, sobram R$ 7.</p><p class=\"selected-explanation\"></p><h3>Regra para memorizar</h3><p>Na soma de números com sinais diferentes, subtraia os módulos e mantenha o sinal do número com maior módulo. Não some 5 + 12, pois uma das parcelas é negativa.</p></div>", "Intermediária"]]};const KEY='rota-furb-'+DATA.id+'-v1';const all=[...(DATA.review||[]),...DATA.questions];const labels=['A','B','C','D','E'];let s=load();function load(){try{let o=JSON.parse(localStorage.getItem(KEY));if(o&&Array.isArray(o.attempts))return o}catch(e){}return {page:0,q:0,answers:Array(all.length).fill(null),confirmed:Array(all.length).fill(false),attempts:[],finished:false}}function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function esc(t){return String(t).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function explanation(q,i,answer){const chosen=answer===undefined?s.answers[i]:answer;const correct=q[2];const wrong=chosen!==correct;const label=chosen===null?'Nenhuma alternativa':labels[chosen]+') '+q[1][chosen];const msg=wrong?'<b>Você marcou '+esc(label)+'.</b> Essa alternativa não corresponde ao resultado pedido. Compare o valor escolhido com as etapas do cálculo acima e observe se você marcou uma etapa intermediária, confundiu a operação ou deixou de converter as unidades. A resposta correta é <b>'+labels[correct]+') '+esc(q[1][correct])+'</b>.':'Você marcou a alternativa correta. Confira o raciocínio abaixo para verificar se chegou ao resultado pelo procedimento adequado.';return q[3].replace('<p class="selected-explanation"></p>','<p class="selected-explanation">'+msg+'</p>')}function badge(d){return '<span class="difficulty '+esc(d)+'">'+esc(d)+'</span>'}function go(n){s.page=n;save();render();scrollTo(0,0)}function finish(){if(!s.finished){s.attempts.push({date:new Date().toISOString(),answers:[...s.answers],score:DATA.questions.reduce((v,q,i)=>v+(s.answers[i+(DATA.review||[]).length]===q[2]),0),reviewScore:(DATA.review||[]).reduce((v,q,i)=>v+(s.answers[i]===q[2]),0)});s.finished=true;}go(DATA.sections.length+2)}function retry(){s.answers=Array(all.length).fill(null);s.confirmed=Array(all.length).fill(false);s.q=0;s.finished=false;go(DATA.sections.length+1)}function render(){const el=document.getElementById('app');let p=s.page;document.getElementById('meter').style.width=(Math.min(p,DATA.sections.length+2)/(DATA.sections.length+2)*100)+'%';if(p===0){el.innerHTML='<div class="eyebrow">'+esc(DATA.subject)+' · Aula '+esc(DATA.number)+'</div><h1>'+esc(DATA.title)+'</h1><p class="muted">Aula em telas sequenciais, com explicações, exemplos e avaliação interativa.</p><div class="callout"><b>O que você vai estudar:</b> '+DATA.sections.map(x=>esc(x[0])).join(' · ')+'</div><p class="notice">Material autoral para estudo, não oficial da FURB. A dificuldade é estimativa pedagógica.</p><div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="go(1)">Começar aula →</button></div>';}else if(p<=DATA.sections.length){let a=DATA.sections[p-1];el.innerHTML='<div class="eyebrow">Conteúdo '+p+' de '+DATA.sections.length+'</div><h1>'+esc(a[0])+'</h1>'+a[1]+'<div class="actions"><button class="btn secondary" onclick="go('+(p-1)+')">← Voltar</button><button class="btn" onclick="go('+(p+1)+')">'+(p===DATA.sections.length?'Ir para avaliação':'Próxima tela')+' →</button></div>';}else if(p===DATA.sections.length+1){let i=s.q,q=all[i],isReview=i<(DATA.review||[]).length,confirmed=s.confirmed[i];let options=q[1].map((o,j)=>'<button class="option '+(confirmed&&j===q[2]?'correct':confirmed&&j===s.answers[i]?'wrong':!confirmed&&j===s.answers[i]?'selected':'')+'" '+(confirmed?'disabled':'')+' onclick="choose('+j+')"><b>'+labels[j]+')</b> '+esc(o)+(confirmed&&j===q[2]?' ✓':confirmed&&j===s.answers[i]?' ✕':'')+'</button>').join('');el.innerHTML='<div class="qhead"><div><b>Questão '+(i+1)+' de '+all.length+'</b><div class="muted">'+(isReview?'Revisão da aula anterior':'Conteúdo da aula atual')+'</div></div>'+badge(q[4])+'</div><h2>'+esc(q[0])+'</h2>'+options+(confirmed?'<div class="feedback '+(s.answers[i]===q[2]?'':'bad')+'"><b>'+(s.answers[i]===q[2]?'Resposta correta!':'Resposta incorreta.')+'</b>'+explanation(q,i)+'</div>':'<p class="muted">Selecione uma alternativa e confirme para conferir a explicação.</p>')+'<div class="actions"><button class="btn secondary" onclick="previous()">← Voltar</button><button class="btn" '+(s.answers[i]===null?'disabled':'')+' onclick="advance()">'+(!confirmed?'Confirmar resposta':i===all.length-1?'Finalizar avaliação':'Próxima questão →')+'</button></div>';}else{const last=s.attempts[s.attempts.length-1],first=s.attempts[0],best=Math.max(...s.attempts.map(a=>a.score),0);const current=last||{score:0,reviewScore:0};let diffs=['Fácil','Intermediária','Difícil'].map(d=>{let ix=DATA.questions.map((q,i)=>[q,i]).filter(x=>x[0][4]===d);let ok=ix.filter(x=>current.answers[x[1]+(DATA.review||[]).length]===x[0][2]).length;return '<div class="stat">'+badge(d)+'<b>'+ok+'/'+ix.length+'</b><small>acertos</small></div>'}).join('');let hist=s.attempts.map((a,i)=>'<details class="history"><summary>'+ (i+1)+'ª tentativa · '+new Date(a.date).toLocaleString('pt-BR')+' · '+a.score+'/10</summary><p>Revisão: '+a.reviewScore+'/'+(DATA.review||[]).length+'</p>'+all.map((q,j)=>'<p><b>'+(j+1)+'. '+esc(q[0])+'</b><br>'+badge(q[4])+' · Sua resposta: '+(a.answers[j]===null?'Sem resposta':labels[a.answers[j]])+' · Correta: '+labels[q[2]]+'<br>'+explanation(q,j,a.answers[j])+'</p>').join('')+'</details>').join('');el.innerHTML='<div class="eyebrow">Avaliação concluída</div><h1>Seu desempenho</h1><div class="stats"><div class="stat"><small>Primeira nota</small><b>'+first.score+'/10</b></div><div class="stat"><small>Melhor nota</small><b>'+best+'/10</b></div><div class="stat"><small>Última nota</small><b>'+current.score+'/10</b></div></div><h2>Acertos por dificuldade</h2><div class="stats">'+diffs+'</div><p><b>Revisão da aula anterior:</b> '+current.reviewScore+'/'+(DATA.review||[]).length+' (fora da nota principal).</p><h2>Histórico de tentativas</h2>'+hist+'<div class="actions"><a class="btn secondary" href="index.html">← Voltar ao curso</a><button class="btn" onclick="retry()">Refazer prova (sem apagar histórico)</button></div>';} }function choose(j){if(!s.confirmed[s.q]){s.answers[s.q]=j;save();render()}}function previous(){if(s.q===0){go(DATA.sections.length)}else{s.q--;save();render()}}function advance(){if(s.answers[s.q]===null)return;if(!s.confirmed[s.q]){s.confirmed[s.q]=true;save();render();return}if(s.q===all.length-1){finish()}else{s.q++;save();render()}}render();</script><script id="study-guides-js">(function(){const GUIDE=["Proporção e porcentagem", [["Razão", "Compara duas grandezas por divisão.", ["a:b", "a/b"], "12 km em 2 h: razão de 6 km/h.", "Compare grandezas compatíveis e observe unidades."], ["Proporção", "Igualdade entre duas razões.", ["a/b = c/d"], "2/3 = 4/6.", "Em proporções válidas, produtos cruzados são iguais."], ["Regra de três direta", "Se uma grandeza aumenta, a outra aumenta na mesma proporção.", ["mais → mais", "menos → menos"], "3 cadernos custam R$ 18; 5 custam R$ 30.", "Antes de calcular, identifique se a relação é realmente proporcional."], ["Regra de três inversa", "Uma grandeza aumenta enquanto a outra diminui proporcionalmente.", ["mais → menos"], "4 trabalhadores fazem um serviço em 6 dias; 8, no mesmo ritmo, em 3 dias.", "A produtividade deve ser considerada igual."], ["Porcentagem", "É uma razão por cem.", ["10% = 0,10", "25% = 1/4", "50% = 1/2"], "15% de 200 = 0,15 × 200 = 30.", "Aumento de 20% e desconto de 20% sucessivos não se anulam."]]];function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const btn=document.createElement('button');btn.id='study-guide-launch';btn.type='button';btn.textContent='📖 Regras e exemplos';btn.setAttribute('aria-haspopup','dialog');const shade=document.createElement('div');shade.id='study-guide-shade';shade.innerHTML='<div id="study-guide-dialog" role="dialog" aria-modal="true" aria-label="Regras e exemplos"><div class="ghead"><div><h2>Regras e exemplos</h2><div class="gsub">'+e(GUIDE[0])+' · Consulta rápida para revisar a qualquer momento</div></div><button class="gclose" type="button">Fechar ✕</button></div>'+GUIDE[1].map((g,i)=>'<details '+(i===0?'open':'')+'><summary>'+e(g[0])+'</summary><div class="gbody"><p>'+e(g[1])+'</p><b>Termos e regras</b><div class="gterms">'+g[2].map(x=>'<span>'+e(x)+'</span>').join('')+'</div><b>Exemplo</b><div class="gexample">'+e(g[3])+'</div><div class="gtip"><b>Atenção:</b> '+e(g[4])+'</div></div></details>').join('')+'</div>';document.body.append(btn,shade);function close(){shade.classList.remove('open');btn.focus()}btn.addEventListener('click',()=>{shade.classList.add('open');shade.querySelector('.gclose').focus()});shade.querySelector('.gclose').addEventListener('click',close);shade.addEventListener('click',ev=>{if(ev.target===shade)close()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&shade.classList.contains('open'))close()});})();</script><script id="math-fraction-renderer">(function(){const re=/(\d+)\s*\/\s*(\d+)/g;function transform(root){if(!root)return;const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){if(!n.parentElement||n.parentElement.closest('script,style,textarea,code,pre,.math-frac'))return NodeFilter.FILTER_REJECT;return /\d+\s*\/\s*\d+/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);nodes.forEach(n=>{const s=n.nodeValue;re.lastIndex=0;const frag=document.createDocumentFragment();let last=0,m;while((m=re.exec(s))){if(m.index>last)frag.appendChild(document.createTextNode(s.slice(last,m.index)));const f=document.createElement('span');f.className='math-frac';f.setAttribute('role','math');f.setAttribute('aria-label',m[1]+' sobre '+m[2]);const a=document.createElement('span');a.className='math-top';a.textContent=m[1];const b=document.createElement('span');b.className='math-bottom';b.textContent=m[2];f.append(a,b);frag.appendChild(f);last=re.lastIndex}if(last){if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));n.replaceWith(frag)}})}let busy=false;const obs=new MutationObserver(()=>{if(busy)return;busy=true;obs.disconnect();transform(document.body);obs.observe(document.body,{subtree:true,childList:true});busy=false});transform(document.body);obs.observe(document.body,{subtree:true,childList:true})})();</script></body></html>
